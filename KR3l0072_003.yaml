  text: 桯史卷第三八則
  hash: sha256:7ce8ee3b66bb3f514c36e974cfc09ce5fce84a8b7fc8e8a9a9262873bc5d2a5b
  markers:
  - {type: page-break, offset: 0, content: '', id: KR3l0072_SBCK_003-1a}
body:
  text: 相臺嶽珂嵗星之祥建炎庚戌狄騎飲海上躬御樓船次于龍翔秋駐蹕會稽時虜𥘉退師尚宿留淮泗朝議凛凛懼其反斾士大夫皆有杞國之憂范丞相宗尹薦朝散大夫毛隨有甘石學有詔赴行在所隨入對言按漢志嵗星所在國不可伐昔湯之元祀嵗星順行與日合于房房心宋亳分也周武王至豐之明年嵗星順行與日合于柳留于張柳張河洛分也故湯征無敵餘慶貤衍猶及微子武王定鼎郟鄏而周公迄營成周四方以無侮今年冬歲當躔而興宋自此虜必不能南渡矣然禦戎上䇿莫先自治願修政以應天道上大喜既而果不復來紹興辛已逆亮渝盟有上封者言吾方得歲虜且送死詔以問大史考步如言陳文正康伯當國請以著之親征詔書故其辭有曰嵗星臨於吳分冀成淝水之勳鬪士倍於晉師當決韓原之勝蓋指此是冬亮遂授首二事之驗不差毫釐蓋宋國之號而吳則今時巡之所都天意篤棐於是益昭昭矣隨家衢之江山後亦不顯梓潼神應逆曦將叛前事之數月神思昏擾夜數躍起寢中叱吒四顧或終夕不得寢意頗悔欲但巳其弟晛力慫慂之曰是謂騎虎顧可中道下耶曦家素事梓潼自玠璘以來事必禱有驗乃齋而請是夕夢神坐堂上已被赭玉謁焉因告以逆且祈卜年之修永神不答第曰蜀王已悉付安丙矣既寐大喜謂事必遂時安以隨軍漕在魚關驛召以歸命以爰立安顧逆謀堅決觸之且俱靡惟徐圗可以得志不得巳諾之猶辭相印遂以丞相長史權知都省事授之居踰月而成獲嘉之績梓潼在蜀著應特異紹興壬子瀘人殺帥張孝芳蓋嘗正晝見于閲武堂逆黨恇潰以迄天誅相安之夢得之蜀士瀘之變在京魏公鏜帥蜀時慶元已未余在中都親聞之其他蓋不可縷數云機心不自覺秦檜在相位頥指所欲為上下奔走無敢議者曹泳尹天府民間以乏見鏹告貨壅莫售日嚚而爭因白之檜檜笑曰易耳即席命召文思院官未至趣者絡繹奔而來亟諭之曰適得旨欲變錢法煩公依舊夾錫樣鑄一緍將以進入盡廢見鏹不用約以翌午畢事院官不敢違唯而退夜呼工鞴液將以及期富家聞之大窘盡輦宿藏爭取金粟物賈大昻泉溢于市既而樣上省寂無所聞矣都堂左揆閣前有榴每著實檜默數焉匆亡其二不之問一日將排馬忽顧謂左右取斧伐樹有親吏在旁倉卒對曰實甚佳去之可惜檜反顧曰汝盜吾榴吏叩頭服蓋其機穽根於心雖嵬瑣弗自覺此所謂莫見乎隱者亦可嘆也館娃浯溪靈巖中宫為蘇永勝槩吊古者多詩之近世王義豐楊誠齋為之賦植意卓絶脫去雕篆畦畛余得之王英伯録藏焉義豐賦館娃曰泛浮玉之北堂得館娃之遺基從先生而遊焉揖夫差而弔之或曰是可唾也奚以弔為哉夫沈湎以喪國固君人之失道然而有鍾鼓者胡可以弗考聞管籥者民喜而相告苟厥妃之當愛惟恐王之不好矣是則女樂亦可少乎必曰夏有末喜商有妲已周有褒姒而吳以西子苟求其故未必專於此也齊有六嬖威公以興正而不譎聖人稱焉非夫九合一正之業得仲父以當其任則其一巳之內少有以自適者舉不足以害成耶關大夫進夏德豈昏微子得政商豈穢聞蘇公家父並用則𤇺火豈得妄舉子胥不見戮則吳之離宫别館至于今可存抑夫差之資異在列國亦翹楚一戰而越沮再會而諸侯懼使僅得一中佐置雙翼於猛虎惟自剖其骨鯁而放意於一女敵乘其間無以外禦杯酒之失何足問獨為此邦惜殺士之舉也此士不遭殺夫差不可愚苧羅之姝適足為我娛胡得而竊吾之符榮楯可居適足華吾廬胡足以隳吾之都惟忠良之既誅始猖狂而自如臺兮姑蘇舟兮太湖食兮鱠鱸曲兮棲烏宿兮嬪嬙修明兮夷光二八兮分明捧心兮專房徑兮採香屧兮響廊笑倚兮玉床奈樂兮東方稻蟹種兮不遺爭盟兮黃池無人兮針規有仇兮相窺至德之廟遂為禾黍悉陂池與臺榭倐一變而𣑽宇入笙歌於海雲令聲鐘而轉鼓儼麛鹿之容與瞰僧儀而觀覩駭越壘以在望奚五戎之閲武松引韻以嗚咽柳顰眉而凝佇山黯黯兮失色水洶洶兮暴怒追此謬於千里本差之於毫釐譬之養生捐其良醫逮疾作於中夜懵藥石之不知志士仁人所為太息於斯焉蓋嘗反覆于此竊謂種蠡亦可哂也勾踐方明舉國以聽十年生聚十年教訓以此衆戰何伐不定何至假負薪之女為是可耻之勝哉始其土城誨淫自君終焉五湖合歡其臣青溪之典不正金谷之義不立悠悠扁舟遂其全璧使之脫鼎中之魚而羣沙頭之鷺返耶溪之蓮而吐洞庭之橘竊謂越之君臣何其陋於此役也越則陋矣吳亦太庸士目既抉夫誰納忠可􅓧人之亡巳其自反而責躬乎公既然雍相與斂容起視四山之中覺蕭蕭兮悲風誠齋賦浯溪曰豫自二妃祠之下故人亭之旁招招漁舟薄遊三湘風與水兮俱順未一瞬而百里歘兩峰之際天儼離立而不倚其一怪怪竒竒蕭然若仙客之鑑清漪也其一蹇蹇諤諤毅然若忠臣之蹈鼎鑊也怪而問焉乃浯溪也蓋􅝓亭在南峿臺在北上則危石對立而欲落下則清潭無底而正黑飛鳥過之不敢立迹余𥘉勇於好竒乃疾趨而登之挽寒藤而垂足照衰容而下窺余忽心動毛髮森竪乃迹故步還至水滸削苔讀碑慷慨吊古倦而坐於釣磯之上喟然嘆曰惟彼中唐國已膏肓匹馬北方僅或不亡觀其一過尚父日殺三庶其人紀有不斁矣夫曲江為篋中之羽雄狐為明堂之柱其邦經有不蠹矣夫水蝗䅋民之畒融竪椎民之髓其天人之心有不去矣夫雖微祿兒唐獨不隊厥緒哉觀馬嵬之威垂渙七萃之欲離殪尤物以説焉僅平逹於巴西吁不危哉嗟乎齊則失矣而楚亦未為得也靈武之履九五何其亟也宜忠臣之痛心寄春秋之二三䇿也雖然天下之事易於處而不難於議也使夫謝奉册於髙邑將稟命於西帝違人欲以圗功犯衆怒以求濟天下之士果肯欣然為明皇而致死哉蓋天厭不可以復祈人潰不可以復支何哥舒之百萬不如李郭千百之師推而論之事可知矣且士大夫之捐軀以從吾君之子者亦欲附龍鳯而攀日月踐台斗而盟帶礪也一復蒞以耄荒則夫千麾萬旟一呼如響者又安知其不掉臂也耶古語有之投機之會間不容穟當是之時退則七廟之忽諸進則百世之揚觶嗟肅宗處此其實難為之九思而未得其計也巳而舟人告行秋日巳晏太息登舟水駃於箭回瞻兩峰江蒼茫而不見義豐賦中稱先生蓋時從范石湖成大遊誠齋則以環轍湘衡過顔元碑下耳二地出處本不倫筆力到處便覺夫差肅宗無所逃罪獨恨管子趨霸之説不可以訓如為唐謀則忠今兩剎中皆無此刻而酲夢復語往往滿壁間云天子門生盤石趙逵以紹興辛未魁集英之唱後三年以故事召歸為校書郎時秦檜老矣怙權殺天下善類以立威搢紳脅息趙至一見光範檜適喜欲收拾之問知其家尚留蜀曰何不俱來趙對以貧未能致檜顧吏囁嚅語有頃奉黃金百星以出曰以是助舟楫費趙出不意力辭之吏從以出同舍郎或勸以母怫檜意者趙正色曰士有一介不取豫獨何人哉君謂氷山足恃乎勸者縮頸反走吏不得已歸猶不敢以其言白檜已不樂居久之語浸聞檜大怒曰我殺趙逵如獮狐兔耳何物小子乃敢爾耶風知臨安府曹泳羅致其隸輩而先張本于上曰近三館士不檢頗多與宫邸通臣將廉之其醖禍不淺矣會得疾十月而有絳巾之招髙宗更化微聞其事十一月亟詔兼官朱邸繼復召對擢著作佐郎謂之曰卿乃朕自擢秦檜日薦士曾無一言及卿以此知卿不附權貴真天子門生也又曰兩王方學詩冀有以切磋之上意蓋欲以此破前謗趙之未召實為東川僉幕總領符行中有子預薦意其為類試官密以文屬之趙不啓緘擲几下既而符氏子不預榜總因以他事捃托之甚峻然卒不能汙趙之介特有守蓋已見於初筮云姑蘇二異人姑蘇有二異人曰何蓑衣曰呆道僧蹤迹皆竒詭淳熙間名聞一時士大夫維舟者率往訪之至今吳人猶能言其大略何本淮陽朐山人書生也祖執禮仕至朝議大夫世為鼎族遭亂南來寓于郡嘗授業于父已能文一旦焚書裂衣遁去人莫之知既乃歸被草結廬于天慶觀之龍王堂佯狂妄談久而皆有驗卧草中不垢不穢晨必一至吳江溲焉郡至吳江五十里往反不數刻人固訝之會有一瘵者拜謁乞醫何命持一草去旬而愈始翕然傳蓑可愈病亦有求而不得隨輒不起者於是逺近稍敬異之孝宗在位匆夢有蓑而跣哭而來吊問之曰臣蘇人也詰其故則不肯言寤以語左璫時上意頗崇緇抑黃弗深信也居月餘成恭后上仙莊文繼即世璫因進勉釋而及之意欲以驗前定寬上心上矍然憶昨夢輟泣而嘆璫進曰臣微聞蘇有何姓者類其人它日固未敢言因道其所為上大驚有詔諭遣不至上嘗燕居深念以規恢大計纍年未有所屬且坤儀虛位圗所以膺佐餕承顔之重者焚香殿中默言曰何誠能仙顧必知朕意遂授璫以香茗曰汝見何則致贄而已問所以來則曰陛下自禱我不及知視其何以復命璫承命惟謹何忽掉首吳音曰有中國人即有蕃人有日即有月不須問趣之去既復呼還曰所問者姓我猶忘之但言朱家例子不可用也使者歸奏上曰是能知我心遂賜號通神先生築通神菴于觀之內親御寶跗書扁以寵之巳而成肅正中宫歸謝氏蓋本朝故事惟欽成本姓崔後育任氏朱氏既而惟從朱姓不復歸上意嘗欲以為比而未決也北伐之議亦少息焉先是觀中諸黃冠以殿宇既燬欲試其驗羣造其廬拜且白之何從求疏軸主者謾以與何笑曰來日自有施者至午而使者果來既答則曰我不能入覲以此纍使者上聞而益竒之會浙西趙憲伯驌亦為之請遂肆筆金闕寥陽殿額出內帑緍錢萬繪事一新以答其意上每歲以璫將命即其居設千道齋合雲水之士施豫優普一歲偶踰期咸訝而請亟起于卧搖手瞬目而招之曰亟來亟來璫是日舟至平望乃見何在岸滸招而呼踵廬言之衆白何固未嘗出也因言所以其狀良是呆道僧者實本郡人為兵家子少有所遇何舊與之友狎不知幾何時髠而髽曰似道似僧故曰道僧狀不慧而言發竒中與何頡頏好蕩遊市井間見人必求錢止於三隨即與之貧者何既不趨召它日璫或薦道僧上欲見之何挽呼不使去曰是將捉汝縛汝監汝不容汝來矣道僧竟來見于內殿不拜所言不倫上狎之使出入勿禁且命隨龍人元居實總管者館之元懼其逃猝無以應上命果日使十人從之所至不舍踰年歸見何何以杖詬逐之至死訖不與接一談重華倦勤復使召之不肯就邀守萬端三年而致之紹熙甲寅春道僧入北內坐榻前曰今日六月也好大雪侍璫咸笑顧曰爾滿身皆雪而笑我狂耶相與罔測亦莫以為意至季夏八日而至尊厭代矣縞素如言焉二人勇於啖肉食至十數斤獨皆不飲酒亦不言其所以然也何又能耐寒暑余兄周伯言有元某者丙午歲七十矣嘗言自丱角見之顔色無少異蘇有妄道士日從之遊將倣其為何不怒獨冒雪馳至垂虹而浴道士不能偕慙而去余兄往見之頗能言宦歷所至酷不喜韓子師方為守千騎每來則提擊而罵之亦有人所不堪者子師素嚴厲於此不以為忤也道僧先數年卒何慶元間猶在相傳百餘歲矣洪文敏夷堅辛志乙三志亦雜載其事雖微不同要皆履竒行怪有不可致詰者故著之趙希光節槩吳畏齋獵諭蜀有卭守楊熹者頗從輶軒羾所聞因道資中趙希光節槩甚悉余兄德夫時從幕府得其書以示余楊之言曰趙昱字希光淳熙宰相衛公雄之子少苦學以司馬周程氏為師每謂存天性之謂良貴充諸巳之謂內富故漠然不以利祿動其心出仕二十餘年僅一磨勘歷任不滿三考其恬退如此汛掃一室左圗右書盡晝夜積日月不舍終身弗改先是衛公相孝宗皇帝一日奏事上從容語及鄭丙曰鄭丙不曉事問他吳挺乃云小孫兒解甚砥衛公曰以大將比小兒丙誠不曉事然以臣見挺雖有所長亦有所短上曰何故公曰為人細密警敏此其所長然敢於欺君父又恃其憸巧而愚弄士大夫此其所短但朝廷用之不得其地上曰何謂不得其地衛公曰往年恢復至德順中原父老簞食壺漿以迎王師者肩摩𬒮接悉取免敵錢大失民望迄以無功中原之人至今怨此子深入骨髓而朝廷乃使之世為西將西人又以二父故莫不畏服挺亦望宣撫之任久矣蜀雖名三軍二軍僅當其偏禆雖陛下神武御將百挺何能為然古帝王長慮却顧為子孫萬世之計似不如此上大感悟後挺死朝廷雖略行其言已而復故開禧丁卯吳曦僣叛昱每念衛公此語輒投地大慟或至氣絶不蘇𥘉欲買舟順流而東賊以兵守蜀門弗果行於是製大布之衣每有自關表避亂而歸者輒號泣弔之亟貽書成都帥臣楊輔謂逆雛驕竪干亂天紀痛哉宗社哀哉蒼生此直愚騃無知為虜所啖逆順昭然其下未必皆樂從肘腋之間禍將自作事尚可為因勸以舉義遂絶粒至於卧疾不能起猶晝夜大號聲逹於外置一劒枕間每舉欲自刺輒為家人捍之而止如是數四終不食而死熹所紀具是不復損益余生雖晚尚及識衛公父子紹熙壬子冬先君捐館于廣余甫十齡護喪北歸衛公以寧武之節來治于洪余舟過章江亟命幕屬來唁親以文奠焉余已卒無時之哭因謁棨下援手言疇昔歔欷不自勝顧余甚幼遣使從先夫人求余程業頗竒其不懾賞其詞語而憐其蚤孤也余歸未釋絰而衛公薨輀車西泝余輅希光于琵琶頎然溫厚今想見之已足以信熹之傳時方暑待亭上親吏言希光方治養生術以子午時有所行謝客移數晷乃得見沖淡無競其素也衛公止一子希光雖重繼體之託亦無訾云稼軒論詞辛稼軒守南徐巳多病謝客豫來筮仕委吏實隸總所例於州家殊參辰旦望贄謁刺而巳余時以乙丑南宫試歲前涖事僅兩旬即謁告去稼軒偶讀余通名啓而喜又頗階父兄舊特與其潔余試既不利歸官下時一招去稼軒以詞名每燕必命侍妓歌其所作特好歌賀新郎一詞自誦其警句曰我見青山多嫵媚料青山見我應如是又曰不恨古人吾不見恨古人不見吾狂耳每至此輒拊髀白笑顧問坐客何如皆歎譽如出一口既而又作一永遇樂序北府事首章曰千古江山英雄無覔孫仲謀處又曰尋常巷陌人道寄奴曽住其寓感槩者則曰不堪回首佛狸祠下一片神鴉社鼓憑誰問廉頗老矣尚能飯否特置酒召數客使妓迭歌益自擊節遍問客必使摘其疵孫謝不可客或措一二辭不契其意又弗答然揮羽四視不止余時年少勇於言偶坐于席側稼軒因誦啓語顧問再四余率然對曰待制詞句脫去今古軫轍每見集中有解道此句真宰上許天應嗔耳之序嘗以為其言不誣童子何知而敢有議然必欲如范文正以千金求嚴陵祠記一字之易則晚進尚竊有疑也稼軒喜促膝亟使畢其説余曰前篇豪視一世獨首尾二腔警語差相似新作微覺用事多耳於是大喜酌酒而謂坐中曰夫君實中豫痼乃味改其語日數十易纍月猶未竟其刻意如此余既以一語之合益加厚頗職視其骩骳欲以家世薦之朝會其去未果是時潤有貢士薑君玉瑩中嘗與余遊偶及此次日攜康伯可順庵樂府一帙相示中有滿江紅作於婺女潘子賤席上者如歎詩書萬卷致君人番沉陸且置請纓封萬户徑須賣劒酬黃犢慟當年寂寞賈長沙傷時哭之句與稼軒集中詞全無異伯可蓋先四五十年君玉亦疑之然余讀其全篇則它語却不甚稱似不及稼軒出一格律所攜乃板行又故本殆不可曉也順庵詞今麻沙尚有之但少讀者與世傳俚語不同批此恐是辛讀康詞偶熟不覺用其語耳決非竊也桯史卷第三
