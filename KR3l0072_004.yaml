  text: 桯史卷第四九則
  hash: sha256:3ffd0b8cc0d388a32b7e8f28f090113fe6822e52ccc3911aad767c36f70d6058
  markers:
  - {type: page-break, offset: 0, content: '', id: KR3l0072_SBCK_004-1a}
body:
  text: 相臺嶽珂壽星通犀帶德壽在北內頗屬意玩好孝宗極先意承志之道時罔羅人間以共怡顔㑹將舉慶典市有北賈攜通犀帶一因左璫以進于內帶十三銙銙皆正透有一壽星扶杖立上得之喜不復問價將以為元日壽巵之侑賈索十萬緍既成矣傍有璫見之從賈求金不得則擲之曰凡壽星之扶杖者杖過於人之首且詰曲有竒相今杖直而短僅至身之半不祥物也亟宣視之如言遂卻之此語既聞遍國中無復售者余按㑹要開寶九年二月十九日召皇弟晉王及吳越國王錢俶其子惟濬射苑中俶進御衣金器壽星通犀帶以謝帶之著於前世者僅此一見耳周夢與釋語余里中士每秋賦與計偕貧不能行者或仰給勸駕嘉泰辛酉永嘉周夢與吕齡宰德化垂滿矣士有以故例請者弗報贄以啓束裝而俟又弗報怒而索其贄余適謁琴堂坐間夢與口占授札吏復之曰伏承寵翰見索長箋愛莫能留感而且駭珠璣在側固知酬應之難筆研生塵未免紓遲之咎趙客有辭而取璧楚人敢訝於亡弓所恨具舟巳及瓜而代去無由洗眼觀奪錦之歸來更冀恢洪以基光大畢緘顧余作釋語曰豫非摩訶薩埵乃諸公之提婆逹多耳余笑莫敢答士擲其報章于門而去閽者白之曰正自乏楮君就席以為室間書庋無所問里士不欲名夢與老儒自號牧齊精史學議論亹亹起人意表器局凝重喜愠不形於色獨微有卜商之短仕終安豐倅云鄭廣文武詩海冦鄭廣陸梁莆福間帆駛兵犀雲合亡命無不一當百官軍莫能制自號滚海蛟有詔勿捕命以官使主福之延祥兵以徼南𬈑延祥隸帥閫廣旦望趨府羣寮以其故所為遍賔次無與立談者廣鬱鬱弗言一日晨入未衙羣僚偶語風簷或及詩句廣矍然起于坐曰鄭廣粗人欲有拙詩白之諸官可乎衆屬耳乃長吟曰鄭廣有詩上衆官文武看來總一般衆官做官却做賊鄭廣做賊却做官滿坐慚噱章以𥘉好誦此詩每曰今天下士大夫愧鄭廣者多矣吾儕可不知自警乎九江二盜吾鄉有周教授者家太一觀前畜犬數十皆西北健種晨紲昏縱穿窬者無敢睨其藩一日起觀扄鑰有異發笈空焉亟集里正視驗跡捕四出杳莫知所從居三日始獲之𥘉盜得資分塗一盜出蛇岡山將如贑吉晝日嘗過其下見道傍梅有繁實夜渴甚登木而取之有蛇隱葉間傷其指負傷而逃至侯溪則指幾如股矣不能去卧旅邸中主人責炊曰豫無它藏獨餘鋌銀可斧而售既而無砧不可碎歸之盜又出囊珠主人念山谷間無售者時德壽宫中貴人劉奭廬石耳峰下持以求質奭曰姑卑汝萬錢詰朝歸汝餘金奭已聞周氏之盜意疑其是馳僕示之曰吾家物也捕于邸贓證一網而得因以跡餘黨如言無脫者又有馬屠居城東為僞劵亂真歲以其劵售舒蘄間得馬驢驅以歸羔于肆以鬻盡復出人但見其驅至日多售用日侈莫疑其所自來適黃有逋冦黃陂之捕吏即之疑一夫焉未察夫實盜也覺其意入肆啜羔坐而袒裼自禠其巾呶于衆閧而出捕者以其變服弗之識也訝其久商于其徒曰吾目見其入今暮矣杳不再覿是家非橐盜者乎遂偕入搜之盜則逸去而僞劵之印楮簾臼儼然皆存因遂告之官夫二盜之彰亦異矣梅實偶然而藏虺捕吏無心而得驗天固以此啓之耶抑稔慝當露適因其所值耶犬不能吠詰之以繇則曰是夕也以豚蹄傅麻苧雜草烏烹之犬至輒投苧纒藥噤無復聲者馬驢每至賤賈而售使門庭翕然嗔咽既非其所仰益可肆於廉取它日語人曰吾以薄取致厚訾售之速耳市人弗覺也此盜亦有道者歟葉少藴內制童貫以左璫幸大觀間緣開邊功建武康節鉞公言弗與而莫敢攖也其三年二月將行復洮州賞石林葉少藴在北門微聞當遂為使相懼當視草不能自免出語沮之蔡元長頗愧於衆論丁酉鎖院乃自檢校司空奉寧節度進司徒易鎮鎮洮而巳少藴黽勉奉詔制出告廷鄭華原素不樂少藴􅎥語貫曰葉內翰欺公至託王言以寓微風貫問其故華原曰首詞有云眷言將命之臣宜懋旌勞之典凡今內侍省差一小中官降香則當曰將命修一處寺觀造數件服用轉官則曰旌勞公以兩府故事為宣威麻辭乃爾是以黃門輩待公也又其末云若古有訓位事惟能德因敵以威懷于以制四夷之命賞視功而輕重是將明八柄之權尚書周官分明上面有建官惟賢一句不使却使下一句謂公非賢爾視功輕重之語亦以公之功止於如此不足直醲賞也貫初垂涎儀同已大失望聞之頳面徑揖起歸質諸館賔俾字字解釋而已聽之其言頗符則大怒泣訴于祐陵納告榻上竟不受其年五月戊午遂以龍學出少藴汝州繼又落職領洞霄祠少藴時得君甚中以隂事始克去之華原意以軋異巳不知適以張閹宦之威也少藴自志其事以余觀之三公論道官雖曰檢校亦不若終沮以正之均為一去云洞霄在中朝從官常蒞之不專以處宰執南渡以後乃不然也宣和御畫康與之在髙皇朝以詩章應制與左璫狎適睿思殿有徽祖御畫扇繪事特為卓絶上時持玩流涕以起羔牆之悲璫偶下直竊攜至家而康適來留之燕飲漫出以示康紿璫入取殽核輒泚筆几間書一絶于上曰玉輦宸游事巳空尚餘奎藻繪春風年年花鳥無窮恨盡在蒼梧夕照中璫有頃出見之大恐而康巳醉無可奈何明日伺間扣頭請死上大怒亟取視之天威頓霽但一慟而巳余嘗見王盧溪作宣和殿雙鵲圖詩曰玉鎖宫扉三十六誰識連昌滿宫竹內苑寒梅欲放春龍池水暖鴛鴦浴宣和殿後新雨晴兩鵲蜚來東向鳴人間畫工貌不成君王筆下春風生長安老人眼曽見萬嵗山頭翠華轉恨臣不及宣政初痛哭天涯觀畫圖盧溪與之雖非可倫擬者第詳玩詩語似不若前作簡而有味云乾道受書禮紹興要盟之日虜先約母得擅易大臣秦檜既挾以無恐益思媚虜務極其至禮文之際多可議者而受書之儀特甚逆亮渝平孝皇以奉親之故與雍繼定和好雖易稱叔姪為與國而此儀尚因循未改上常悔之乾道五年陳正獻俊卿為相上一日顧問欲遣泛使直之且移騎兵于建康以示北向㑹歸正人侍旺未遣虜屢以為言正獻恐召釁執不可亟奏曰臣早來蒙聖慈宣問遣使事臣巳略奏一二此事臣子素所憤切便當理㑹屬今者有疑似之迹彼必以本朝意在用兵多方為備萬一先動吾事力未辦淮西城壁未集今不若少遲若專遣使則中外疑惑使者既行只宜便相聽許猶為有名茍或未從殊失國體天下之人以為陛下捨其大而圖其小也適蒙中使降下王弗前此宣㫖本末今遣使不為無辭臣之愚見欲姑俟侍旺事少定或冬間因賀正使遣王卞偕行先與北館伴議論言朝廷將遣泛使之意或令殿上口奏彼若許遣則有必從之理若其不許犬羊豈可責以禮度則臣願陛下深謀逺慮磨厲以須忍其小而圖其大他時翦除醜類恢復故疆名分自正國勢自強在於今日誠未宜計虛名而受實害也臣淺陋愚暗念慮及此更乞宸裹少賜詳酌天下幸甚上為少止而終以為病其秋偕虞雍公允文爰立左右上密求顓對時范石湖自南宫郎崇政說書為右史侍講天意攸屬明年亟欲遂前事且將先以陵寢為詞而使使者自及受書以御札問正獻曰朕痛念祖宗陵寢淪於腥羶四十餘年今欲特差泛使往彼祈請依巫伋鄭藻例施行卿意以為何如可密具奏來正獻復奏曰臣伏蒙中使宣降到御札下咨臣以遣北朝泛使本末顧臣淺陋豈足上當天問恭讀聖訓不勝感泣仰惟陛下焦勞萬機日不暇給規恢逺略志將有為痛祖宗之陵寢未還念中原之版圗未復精誠所感上通於天天祐聖德何功不成此固微臣素所激昻憤切思以仰贊廟謨為國雪耻恨不即日掛天山之斾勒燕然之銘然而性質頑滯於國家大事每欲計其萬全不敢為嘗試之舉是以前者留班面奏亦以為使者當遣但目前未可恐泄吾事機以實諜者之言彼得謹為備若鎮之以靜遲一二年彼不復疑俟吾之財力稍充士卒素飽乃遣一介行李往請所難往反之間又一二年彼必怒而以師臨我然後徐起應之以逸待勞此古人所謂應兵其勝十可六七夫天下之事為之有機動惟厥時孔子曰好謀而成使好謀而不成不如無謀臣之愚暗安知時變不過如向所陳不敢改辭以迎合意指不敢依違以規免罪戾不敢僥幸以上誤國事踈狂直突罪當萬死惟陛下憐其愚而録其忠不勝幸甚上不聽正獻遂去國范遷起居郎假資政殿大學士左太中大夫醴泉觀使兼侍讀丹陽郡開國公為祈請使以行上臨遣之曰朕以卿氣宇不羣親加選擇聞外議洶洶官屬皆憚行有諸范對曰無故遣泛使近於求釁不執則戮臣已立後仍區處家事為不還計心甚安之王色愀然曰朕不敗盟發兵何至害卿嚙雪餐氊或有之不欲明言恐負卿耳范奏乞國書併載受書一節弗許遂行虜遣吏部郎中田彥皋侍御史元顔溫迓焉范知虜法嚴附請决不可逹一不泄語二使不復疑至燕乃夜蔽帷秉燭密草奏具言他日北使至欲令親王受書其辭云云大昕而朝遂懷以入初跪進國書隨伏奏曰兩朝既為叔姪而受書禮未稱昨嘗附元顔仲李若川等口陳久未得報臣有奏劄在此搢笏出而執之雍酋大駭顧誶其宣徽副使韓鋼曰有請當語館伴此豈獻書啓處耶自來使者未嘗敢爾厲聲令綽起者再三范不為動再奏曰奏不逹歸必死寧死于此雍酋怒拂袖欲起左右掖之坐又厲聲曰教拜了去鋼復以笏抑范拜范跪如初雍酋曰何不拜范曰此奏得逹當下殿百拜以謝乃宣詔令納館伴處范不得巳始袖以下望殿上臣僚往來紛然既而虜太子謂必戮之以示威其兄越王不可而止頃之引見如常儀歸館伴果宣㫖取奏去是日鋼押宴謂范曰公早來殿上甚忠勤皇帝嘉嘆云可以激厲兩朝臣子范唯唯謝廷議方殷㑹夏國有任德敬者乃夏酋外祖號任令公再世用事謀篡其國事敗而族蜀宣司故嘗以蠟書通問為夏人所獲致之虜庭雍酋益怒范朝辭遂令其臣傳諭詰之范答以姦細之僞不可測退朝而館伴持真書來印文皎然可識范笑曰御寶可僞况印文乎虜直其詞遂不竟十月范還虜之報章有曰抑聞附請之辭欲變受書之禮出於率易要以必從上於是知其忠勤有大用意後八年迄參大政云受書乃隆興以後盟書大節目故備記其事特詳當時尚他有廷臣謀議可參見日月尚邇惜乎其未盡聞也一言悟主石湖立朝多竒節其為西掖時上用知閣門事樞密都承㫖張說為僉書滿朝譁然起爭上皆弗聽范既當制朝士或過問當視草與否笑不應獨微聲曰是不可以空言較問者不愜又譁然謂范黨近習取顯位范亦不顧既而廷臣不得其言有去者范詞猶未下忽請對上意其弗繳知其非以說事接納甚溫范對久將退乃出詞頭納榻前玉色遽厲范徐奏曰臣有引諭願得以聞今朝廷尊嚴雖不可以下擬州郡然分之有别則略同也閣門官日日引班乃今郡典謁吏耳執政大臣倅二比也陛下作福之柄固無容議但聖意以謂有一州郡一旦驟拔客將吏為通判職曹官顧謂何耶官屬縱俯首吏民觀聽又謂何耶上霽威沉吟曰朕將思之明日說罷後月餘范丐去上曰卿言引班事甚當朕方聽言納諌乃欲去耶既而范竟不安于位以集撰帥靜江明年春說遂申命實乾道八年也悟主以一言之頃理明辭正雖不能終格猶足為公議立赤幟云蘇葛䇿問東坡先生元祐中以翰苑發䇿試館職有曰今朝廷欲師仁祖之忠厚懼百官有司不舉其職而或至於偷欲法神考之勵精恐監司守令不識其意而流入於刻左正言朱光廷首擲其事以為不恭御史中丞傅堯俞侍御史王岩叟交章劾奏一時朝議譁然起宣仁臨朝為之宣諭曰詳覽文意是指今日百官有司監司守令言之非是譏諷祖宗紛紛踰時始小定既而亦出守紹聖崇寧治黨錮言者屢以藉口迄不少置也政和間葛文康勝仲為大司成又發䇿私試有曰聖上懋建大中克施有政忠恕崇厚同符昭陵綜核勵精遹追寧考殆將收二柄而總攬之也今欲嚴督責肅逋慢而無刻核之迹隆牧飬流豈弟而無姑息之過諸生謂當如何其問今見丹楊集中是時語忌最嚴而無一人指疵之者文康迄位法從哀榮始終二䇿問語意如一而禍福乃爾大異是蓋有命也
