front:
  text: 桯史卷第五十三則
  hash: sha256:f519d3e8a9a3150f6a4f0c64e4ccb5e37383d4b4e7d361c90134858d66874133
  markers:
  - {type: page-break, offset: 0, content: '', id: KR3l0072_SBCK_005-1a}
body:
  text: 相臺嶽珂劉觀堂讀赦詩紹興巳未金人歸我侵疆曲赦新復州縣赦文曰上穹開悔禍之期大金報許和之約割河南之境土歸我輿圗戢宇內之干戈用全民命大酋兀术讀之以謂不歸德其國明年遂指為釁以起兵復陷而有其地後二年和議成秦檜懼當制者之不能説虜也以孽子熺及其黨程克俊輔鼇故其文曰上穹悔禍副生靈願治之心大國行仁遂子道事親之孝可謂非常之盛事敢忘莫報之深恩而况申遣使軺許光宗廟諱盟好來存殁者萬餘里慰契闊者十六年禮備送終天啓固陵之吉壤志伸就養日承長樂之慈顔於是郵傳至四方遺黎讀之有泣者蜀士劉望之作詩曰一𥿄盟書換戰塵萬方呼舞却沾巾崇陵訪沈空遺恨郢國憐懷尚有人收拾金繒煩廟算安排鍾鼎誦宗臣小儒何敢知機事終望君王赦奉春時語禁未大嚴無以為風者望之有集自號觀堂它書多諂秦所謂奉春竟不知指何人也部胥增損文書先君之客耿道夫端仁為余言其姻張氏不欲名淳熙間尉廣之增城有黠盜劉花五者聚黨剽掠官司名捕纍載弗獲一日有告在鄰邑之境民家者民素豪枳關環溪畜犬獰警吏莫敢闖其藩張欲躬捕弓級陳某者奮而前曰是危道不煩親行我得三十人饒取之使之往信宿而得鞫其橐侣凡十餘輩散迹所往咸縶而來贓證具以告之縣於法應賞矣先是張以它事忤令盜之至令訊爰書以實言府張以非馬前捕不應令將論報張乃知之祈之椽史咸曰案已具府視縣辭而已事且奏不容增府尹適知已又祈之亦弗得自分絶望又一年秩滿買舟如京過韶因謁憲臺坐謁次有它客縱談一尉事適相類漫告之客曰是不可為然於法情理凶虐嘗懸購者雖非躬獲亦當免試或循資盍試請一公移儻可用張方慮關升薦削不及格聞之大喜遂白之憲憲命以成案録為據付之至臨安果以𥘉筮無舉貟當入殘零張良窘偶思有此據以示部胥胥視之色動曰丐我一昔得與同曹議居二日來邀張至酒家劇飲中席謂之曰君欲改秩乎張錯愕不敢謂然胥曰我不與君劇君能信我事且立辦詰所以笑不答遂去明日復至其邸張疑未泮出謀之道夫道夫曰胥好眩詡志於得錢然亦有能了事者不可信亦不可郤盍為質而要其成張歸胥又來則曰君不深信我我請母持錢去事成乃見歸許諾索緍二千酬酢竟日以千緍成約張貸其半千道夫同緘識于霸東周氏兩月不復來顧以為妄相與深咎輕信徒取愒日忽夜三鼓有扣門者乃胥焉喜見眉睫曰幸不辱命文書銜袖取觀之則名登于進卷矣張大駭旦質之左銓良是三代爵里皆無訛又扣之省闥亦然以為自天而下然終莫測其繇也欣然卑謝資又厚以饋而問其故胥不肯泄曰君第汔事何庸知我既而班見如彛得宰福之永福去亦自閟不言惟道夫知之先君為侍左郎道夫在館因密訪其事蓋胥𥘉得憲司據見所書功閥皆曰增城縣尉司弓級陳某獲若干盜因不以告人夜致之家於每司字增其左畫曰同則如格矣筆勢穠纎無少異同列不之覺徴案故府胥亦隨而增之但時矯它曹夤緣之命促其行委曲遮護徒以欲速告迄不下元處而賞遂行刻木輩舞文顧賕謝乃其常蓋未有若此者以此知四選蠹積蓋不可勝算司衡綜者可不謹哉看命司中都有談天者居於觀橋之東日設肆于門標之曰看命司其術稍售其徒憎之曰司者有司之稱一妄庸術乃以有司自命豈理也哉相與謀訟之一人起曰是不難我能使之去旦日徙居其對衢亦易其標曰看命西司過者多悟而笑其人愧赧亟撤不敢留伎流角智軋敵乃有諭於不言者亦可謂巧矣書之以資善謔宣和服妖宣和之季京師士庶競以鵝黃為腹圍謂之腰上黃婦人便服不施襟紐束身短製謂之不製襟始自宫掖未幾而通國皆服之明年徽宗內禪稱上皇竟有青城之邀而金虜亂華卒於不能制也斯亦服妖之比歟安慶張寇兩淮自開禧搶攘之後惟舒僅全嘉定已已歲洊飢潰兵張軍大煽亂始犯桐城掠寓公朱少卿致知之家頗得民馬益合亡命兩夕而浸多遂鴟張闖郡太守林仲虎棄城遁入自北門至于逵路號于邦人曰凡吾之來將以為父兄子弟非有掠􅐁之心也謹無捐而居無棄而業無嬰我兵鋒於是逃者稍稍抱馬足乞生賊亦弗殺至譙門立馬視樓扁四顧曰我射而中安字之首點則入不然舍去一發中之登郡􅈦大發府庫以豫民翕然爭趨惟尸胥魁一人曰是舞文而虐吾民者相為除之而已即日去屯潛山營于真源宫將大其所圖基以裒兵會有詔池陽兵千捕他盜偶遇之踵而登山賊不虞其至之速也頗懼時官軍未知賊衆寡莫敢先入環而守之賊計窮越山而跳縶道流而奪其巾衣偽為迸逸者告于官軍曰賊衆方盛冝少須軍士不之疑皆趣使去巳而幟矗木間馬嘶廡下鉦鼓刀斗鞺􅝅四發益信其有人將謀于軍曰賊在內徒株守無益焚其宮是將焉往是日風盛百燎並舉徒聞號呼而竟莫有出者宫既蕩盡以為賊亦灰矣亟奏功朝廷𥘉聞仲虎失守亟詔池出兵繼得撲滅之報將第賞而張軍大乃自望江劫二舟載所獲婦女浮江而下至建康登層樓揮金自如一飲而費二十萬察姦者疑其為執訊得實乃知焚死者多縶留之黃冠也獄具肆于市而尼前賞舟中多衣冠家人遞牒送其所居真源無孑遺其徒適有遊方者歸旋理瓦礫為復營計今尚未完匹夫奮草莽凶歲常事然驟得一郡即市恩忍殺其志蓋不淺脫身煙熖智足周身卒以所嗜敗此亦天網之不可逃者歟陽山舒城建炎航海之役張俊既戰而棄鄞兀术入之即日集賈舟募瀕海之漁者為鄉導將遂犯蹕而風濤稽天盤薄不得進兀术怒躬命巨艘張帆徑前風益猛自度不習舟楫桅舞舷側窘懼欲却而未脫諸口也遙望大洋中隱隱一山顧問海師此何所對曰陽山兀术慨然歎曰昔唐斥境極于隂山吾得至此足矣遂下令反棹其日御舟將如館頭亦遏于風不爾幾殆蓋天禠其魄而開中興云龍舒在淮最殷冨虜自亂華江浙無所不至獨不入其境説者謂其語忌蓋以舒之比音為輸也宸奎堅忍字光堯既與子孝愛日隆每問安北宫間及治道時孝宗鋭志大功新進逢意務為可喜效每落落淳熙中上益明習國家事老成鄉用矣一日躬朝德壽從容宴玉音曰天下事不必乘快要在堅忍終於有成而已上再拜請書紳歸而大字揭于選德殿壁辛丑歲將廷䇿多士貢名者或請時事于朝路間聞其語而不敢形於大對且慮於程文不妥帖僅即其近似為主意或曰持守或曰要終既而御集英臚唱宰執進讀獨有一卷子首曰天下未嘗有難成之事人主不可無堅忍之心上覽而是之遂為第一蓋親擢也周伯兄常誦此事謂凡文字明白痛快當如此余聞於其客劉逹夫何處難忘酒自唐白樂天始為何處難忘酒詩其後詩人多效之獨近世王景文質所作雋放豪逸如其為人余得其四篇曰何處難忘酒蠻夷大不庭有心扶白日無力洗滄溟豪傑將班白功名未汗青此時無一盞壯氣激雷霆何處難忘酒姦邪大陸梁腐儒空有酈好漢揔無張曹趙扶開寶王徐賣靖康此時無一盞淚與海茫茫何處難忘酒英雄太屈蟠時違聊置畚運至即登壇梁甫吟聲苦干將寶氣寒此時無一盞拍碎石闌干何處難忘酒生民太困窮百無一人飽十有九家空人説天方解時和歲自豐此時無一盞入地訴英雄景文它文極多號雪齋集大略似是余又讀王荆公臨川集亦有二篇其一篇特典重曰何處難忘酒君臣會合時深堂拱堯舜密席坐臯夔和氣襲萬物歡聲連四夷此時無一盞真負鹿鳴詩二公同一題而喑嗚叱吒一轉於爼豆間便覺間雅不侔矣余嘗作一室環寫此詩恨不多見云見一堂孝宗朝尚書郎鹿何年四十餘一日上章乞致其事上驚諭宰相使問其繇何對曰臣無他顧德不稱位欲稍矯世之不知分者耳遂以其語奏上曰姑遂其欲時何秩未貟郎詔特官一子凡在朝者皆詩而祖之何歸築堂扁曰見一蓋取人人盡道休官去林下何嘗見一人之句而反之也何去國時齒髮壯不少衰居二年以微疾卒或較其積閥謂雖居位猶未該延賞天道固有知云所官之子曰昌運余在故府時昌運為左帑嘗因至北關送客吳勝之為余道其事今知連州義騟傳吾鄉有義騟事甚竒余嘗為作傳曰義騟者九江戍校王成之鎧騎也成家世隸尺籍開禧間虜大入淮甸成以卒從戎四方山屢戰有功稍遷將候騎方淮民習安倉卒間虜至而逃畜孽滿野成徇地至花靨見病騟焉疥而瘠骨如堵牆行遂水草步且僵烏鳶啄其上流血赭髀莫適為主縶而得之會罷兵歸飼以豐秣幾半年膚革僅完毛耐復生日置之槽櫪愸愸然與羣馬不相顧時一出繫廡下顧景嘶鳴若自慶其有所遇成亦未始異之牙治在城陬每旦與同列之隸帳下者率夜漏未盡二刻騎而往屏息庭槐下執檛候晨鴈鶩行立俟頥指盡午退以為常馬或蹙􅒒不任相通融為假借一日有告馬病從成請騟往始命鞍踶鳴人立左右驤拒不可制易十數健卒莫能孰何乃以歸之成成曰安有是呼常馭羸卒持鞚來則帖耳馴服如平時振迅通衢磬控緩亟無少忤者自是惟成乘則受之他人則復弗受雖日浴于河羣馬皆禓而騎相望後先騟之馭者終莫敢竊睨其膺鬛稍前即噬齧之軍中咸指為駑悍擯弗齒嘉定庚午洞寇李元礪盜弄潢池兵庚符下統府調兵三千人以往成與行﨑嶇山澤夷若方軌至吉之月餘寇來犯龍泉柵成出搏鬪四五合危敗之矣或以鈎出其腋及鞬而隊死焉官軍亟鳴鉦騟屹立不去躑躅徘徊悲鳴尸側賊將顧曰良馬也取之元礪有弟悍很恃藝每出掠率強取十二三適見之色動曰我欲之將不敢逆遂試之蹴踘進退折旋良愜即不勝喜貯以上廄煮豆粟濯泉翦􅎗用金玉為鎧華韀沃續極其鮮明羣渠皆釃酒來賀輜重卒有為賊掠取者知之曰騟他日未當若是彼畜也而亦畏賊耶竊怪之於是日遊其騟於洞間上下峻坂無不如意恨得之晚思一快意馳騁而地多阻且不可得後旬浹復犯永新柵官軍聞有寇至披鹿角出迎擊鼓聲始殷果乘騟以來騟識我軍旗幟亟馳賊覺有異大呼勒挽不止則怒以鐡槊擊之胯盡傷騟不復顧冒陳以入軍士識之者曰此王校之騟也是異服者必其酋相與遂之執以下訊而得其實則縳以徇于軍曰得元礪之弟矣譟而進賊軍大駭軍士勇躍爭奮遂敗之急羽露書以出竒獲醜聞檻送江右道朝廷方患其跳梁日徯吉語聞而嘉之第賞有差衆耻其功之出於馬也沒騟之事騟之義遂不聞於時居二日騟歸病傷不秣而死稗官氏曰孔子曰驥不稱其力稱其德也今視騟之事信然夫不苟受以為正報施以為仁巽以用其權而決以致其功又卒不失其義以死非德其孰能稱之也彼仰秣而戀豆歷跨下而不知耻因人而成事者雖有奔塵絶景之技才不勝德嫓之駑駘何足算乎余意君子之將有取也而居是鄉詳其事故私剟取著于篇鳯凰弓鄭華原居中在宥府和子美詵知雄州嘗以事詣京師召與語而恱之遂薦於徽袒敷奏明鬯大契宸旨進橫階一等俾還任詵因上制勝強逺弓式詔施行之弓製實弩極輕利能破堅於三百步外即邉人所謂鳯凰弓者紹興中韓蘄王世忠因之稍加損益而為之新名曰剋敵亦詔起部通製至今便焉洪文敏容齋三筆謂祖熙寧神臂之規實不然也詵知兵嘗沮伐燕之議以及於責北事之作未及用以死蓋兩河名將云大小寒韓平原在慶元𥘉其弟仰胄為知閣門事頗與密議時人謂之大小韓求捷徑者爭趨之一日內燕優人有為衣冠到選者自敘履歷材藝應得美官而留滯銓曹自春徂冬未有所擬方徘徊浩歎又為日者弊帽持扇過其旁遂邀使談庚甲問以得祿之期日者厲聲曰君命甚髙但於五星局中財帛宫若有所礙目下若欲亨達先見小寒更望成事必見大寒可也優蓋以寒為韓侍燕者皆縮頸匿笑余憶慶元巳未歲如中都道徽之祈門夜憩客邸見壁間一詩漫味語意乃天族之試南宫者所作其辭曰蹇衛衝風怯曉寒也隨舉子到長安路人莫作親王看姓趙如今不似韓旁有何人細書八字墨迹尚新但云霍氏之禍萌於驂乘而已余謂優語所及亦一驂乘也蒙其指目者反懵然若不少悟何耶趙良嗣隨軍詩趙良嗣既來降頗自言能文間以詩篇進益簡眷遇至命兼官史局今續通鑑長編重和元年十二月丁未推修國朝會要帝系后妃吉禮三類賞良嗣實竄名參詳與轉一秩焉亦可占其非據矣後既坐誅其所自為集凡數十卷時人皆唾去不視蕩燬無收拾者余讀北遼遺事見良嗣與王瓌使女真隨軍攻遼上京城破有詩曰建國舊碑胡月暗興王故地野風乾回頭笑向王公子騎馬隨軍上五鑾上京蓋今虜會寧乃契丹所謂西樓者實耶律氏之咸鎬豐沛犬羊固不足恤而良嗣世仕其國身踐其朝貴為九卿一旦決去視宗國顚覆殊無禾黍之悲反吟咏以志喜其為人從可知也縱有名篇正亦不足録况僅止爾耶五鑾乃上京殿名保機之故巢也桯史卷第五
