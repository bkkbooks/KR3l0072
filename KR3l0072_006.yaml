front:
  text: 桯史卷第六六則
  hash: sha256:935c9935dc263f7cd738e6b411e6b496d7bf11f90fdaaa5f1dd674f8575f87ec
  markers:
  - {type: page-break, offset: 0, content: '', id: KR3l0072_SBCK_006-1a}
body:
  text: 相臺嶽珂汪革謡䜟淳熙辛丑舒之宿松民汪革以鐡冶之衆叛比郡大震詔發江池大軍討之既潰又詔以三百萬名捕其年革遁入行都廂吏執之以聞遂下大理獄具梟于市支黨流廣南余嘗聞之番易周國器元鼎曰革字信之本嚴遂安人其兄孚師中嘗登鄉書以財豪鄉里為官榷坊酤以捕私醖入民家格鬪殺人且因以掠􅐁黥隸吉陽軍壬午癸未間張魏公都督江淮孚逃歸上書自詭募亡命為前鋒雖弗效猶以此脫黥籍歸益治資産復致千金革偶䦧牆不得志獨荷一繖出聞淮有耕冶可業渡江至麻地家焉麻地去宿松三十里有山可薪革得之稍招合流徙者治炭其中起鐡冶其居旁又一在荆橋使里人錢某秉德主焉錢故吳越支裔也貧不能家妻美而豔革私之邑有酤坊在倉步白雲革訟而擅其利歲致官錢不什一别邑望江有湖地饒魚蒲復佃為永業凡廣袤七十里民之以漁至者數百戶咸得役使革在淮仍以武斷稱如居嚴時出佩刀劔盛騎從環數郡邑官吏有不愜志者輒文致而訟其罪或莫夜嘯烏合歐擊瀕死乃置於是爭敬畏之願交歡奉頥㫖革亦能時低昂折節與遊得其死力聲熖赫然自儔夷以下不論也𥘉江之統帥曰皇甫倜以寬得衆别聚忠義為一軍多致驍勇繼之者劉光祖頗矯前所為奏散遣其衆太湖邑中有洪恭訓練居邑南門倉巷口舊為軍校先數年巳去尺籍家其間軍士程某二人素識之往歸焉恭無以容又不欲逆其意革之長子某好騎射輕財結客遂以書薦之往果喜留之一年而盡其技革資用適窘謝以鐡鏹五十緍二人不滿問其所往曰將如太湖革因寄書以遺恭革與恭好有私幹期以秋以其便之弗端亶書紙尾曰乃事俟秋凉即得踐約二人既出飲它肆酣相與咨怨竊發緘窺之而未言至太湖見恭恭門有茗坊延之坐自入于室取四縑將遺之恭有妾曰小姐躬蠶織勞以恭之好施也吝不豫縑屏後有詈言二人聞之怒恭堅持縑出不肯受亦不投以書徑歸九江揚言于市謂革有異謀從我學弓馬兵陳已約恭以秋叛將連軍中為應我因逃歸故使邏者聞之意欲以藉手冀復收光祖廉得之恐捕二人送後司既無以脫遂出其書為證光祖繳上之朝有詔捕革郡命宿松尉何姓忘其名素畏其豪彎卒又咸辭不敢前妄謂拒捕幸其事之它屬以自解時邑無令有王某者以簿攝邑事郡檄簿往說諭革巳聞之頗為備飲簿以酒烹鵝不熟而薦意緒倉皇簿覺有異不敢言而出行數里解后郡遣客將郭擇者至擇與汪革交稔故郡使繼簿將命從以吏卒十餘人簿下馬道革語勸勿往擇不可曰太守以此事屬擇今徒還且得罪遂入革復飲之時天六月方暑虐以酒自已至申不得去擇𥘉謂革無他既見乃露刃列兩廂門下憧憧往來袒禓呼嘯頗懼亶孫辭丐去革畢飲字謂擇曰希顔吾故人今事籍籍革且不知所從始雀鼠貪生未敢出有楮劵四百丐希顔為我展限擇陽諾方取楮捕吏有王立者亦以革之餉飲也醉聞其得錢扣窗呼曰三省樞密院同奉聖㫖取謀反人教練乃受錢展限耶革長子聞之躍出縛擇曰吾父與爾善爾乃匿聖㫖文書給吾父死地戶闔甲者興王立先中二刀仆僞死盡殱捕吏鈎曵出置牆下將殺擇探懷中得所藏郡移擇搏頰祈哀曰此非他人乃何尉所為苟得尉辨正死不恨革許之分命二子往起炭山及二冶之衆炭山皆鄉農不肯從爭迸逸惟冶下多逋逃羣盜實從之夜起兵部分行伍使其腹心龔四八董三董四錢四二及二子分將之有衆五百餘六日辛亥遲明蓐食趨邑數人者故軍士若將家子弟亦有能文者俠且武平居以官人稱革皆親下之革有三馬號惺惺騮小驄騍曰畨婆子駿甚馭曰劉青驍捷過人革是日𬒳白錦𫀆屬櫜鞬腰劔總鵝梨旋風髻道荆橋秉德之妻闖于垣匿弗之見乃過之未至縣五里錢四二有異心因謂革曰今捕何尉顧不足多煩兵君以親騎入大隊姑屯此可也革然其言以三十騎先入郭門問尉所在則前一日以定民訟舍村寺未歸乃耀武郭中復南出劉青方鞚忽顧革曰今雖不得尉能質其家尉且立來革曰良是反騎趨縣尉廨在縣治革將至有長人衣白立門間髙與樓齊其徒俱見之人馬辟易亟奔還則錢四二者已與其衆潰逃略盡惟龔董守郭擇不去者尚五六十人計無所出乃殺擇而還麻地其居屋數百間藏書甚富榖粟山積盡火之幼孫千一甫十一歲使乘惺惺騮如無為漕司分析非敢反特為尉迫脅狀遂殺二馬挈其孥至望江以五舟分載入天荒湖泊葦間與龔董灑涕别去曰各逃而生毋以為君纍也其次子有婦張實太湖河西花香鹽賈張四郎之女有智數嘗勸革就逮弗從至是與其子相泣自湛于湖時人哀之王立既不死負傷而逃歸郡郡聞革起聚民兵㑹巡尉來捕且驛書上言詔發兩統帥偏禆撲滅勿使熾居十日而兵大合徒知其在湖不敢近視舟有煙火且聞伐鼓聲稍久不出使闖之則無人焉煙乃麻屑為詰曲如印盤縳羊鼓上使以蹄擊革蓋東矣革之至江口劫二客舟浮家至鴈汊采石僞官歸峽者謁征官而去人莫之疑舒軍既失革朝廷益慮其北走胡大設賞購革乃匿其家于近郊故死友家夜使宿弊窑曰吾事明家可歸師中兄遂入北關遇城北廂官白某者于塗白嘗為同安監官識革方駭避革曰聞官捕我急請以為君得束手詣闕下天獄獄吏訊其家所在備楚毒卒不言從獄中上書言臣非反者蹭蹬至此蓋嘗投匭請得以兩淮兵恢復中原不假援助臣志可見矣不知訟臣反而捕者為誰請得以辨乃詔九江軍送二人捕洪恭等雜驗皆無反狀書所言秋期乃它事革亶坐手殺平人論極典從者末减二人亦以首事妄言杖脊竄千里方其孫訴漕司時遞押繫太湖荷小校過棠梨市國器嘗見之惺惺騮棄野間為人取去宿松人復攘之以瘠死革之壻曰毛翥字時舉第百一居倉步亦業儒以不預謀至今存後其家果得免依孚而居後一年事益㢮乃如宿松識故業董四從有總首詹怨之捕送郡郭擇家人逆諸門搏擊之至郡庭首不髮矣其捕董時亦賞緍十郡不復肯卑薄其罪僅編管撫州革未敗天下謡曰有箇秀才姓汪騎箇驢兒過江江又過不得做盡萬千趨鏘又曰往在祁門下鄉行第排來四八首尾皆同凡十餘曲舞者率侑以鼓吹莫曉所謂至是始驗革第十二以四合八其應也二人𥘉言蓋謂革將自廬起兵如江云國器又言革存時每酒酣多好自舞亦不知兆止其身宿松長人或謂其邑之神曰福應侯威靈極著革時亦欲縱火殺掠使無所睹邑幾殆時守安慶者李歲久亦不知其為何人也鐵劵故事苗劉之亂勤王兵向闕朱忠靖勝非從中調護六龍反正有詔以二凶為淮南兩路制置使令將部曲之任時正彥有挾乘輿南走之謀傳不從朝廷微聞而憂之幸其速去其屬張逵為畫計使請鐡劵既朝辭遂造堂䄂劄以􅈤忠靖曰上多二君忠義此必不吝顧吏取筆判奏行給賜令所屬檢詳故事如法製造不得住滯二凶大喜是夕遂引遁無復譁者時建炎三年四月己酉也明日將朝郎官傳宿扣漏院白急速事命延之入傅曰昨得堂帖給賜二將鐵劵此非常之典今可行乎忠靖取所持帖顧執政秉燭同閲忽顧問曰檢詳故事曽檢得否曰無可檢又問如法製造其法如何曰不知又曰如此可給乎執政皆笑傳亦笑曰已得之矣遂退後傅論功遷一官忠靖嘗自書其事云鴻慶銘墓孫仲益覿鴻慶集太半銘志一時文名獵獵起四方爭輦金帛請日至不暇給今集中多云云蓋諛墓之常不足咤獨有武功大夫李公碑列其間乃儼然一璫耳亟稱其髙風絶識自以不獲見之為大恨言必稱公殊不怍於宋用臣之論諡也其銘曰靖共一德歷踐四朝如砥柱立不震不搖亦太侈云余在故府時有同朝士為某人作行狀言者摘其事以為士大夫之不忍為即日罷去事頗相類仲益蓋幸而不及於議也蘇衢人妖余兄周伯以淳熙丙申召為太府簿時姑蘇有民家姓唐一兄一妹其長皆丈有二尺里人謂之唐大漢不復能嫁娶每行倦倚市簷憩坐如堵墻不可出出輒傾市從觀之日啖斗餘無所得食因適野為巨室受囷粟蓋立囷外即可舉手以致不必以梯也以是背微傴有璫以輅使客見之大驚遂入奏詔廪之殿前司時郭棣為帥周伯間一往必敬喏其聲如鐘德夀時欲見之懼其聚民乃卧之浮于河至望仙專舟焉又江山邑寺有緇童眉長踰尺來淨慈都人爭出視之信然事聞禁中詔給僧牒賜名延慶寺僧日坐之門護以行馬士女填咽炷香謂之活羅漢遂裒施資為殿寺有故銅像甚侈乃位之中不朞而成周伯亦親見之是非肖貌賦形之正近於人妖矣後數年周伯去國皆不知所終快目樓題詩江西詩派所在士多漸其餘波然資豪健和易不常詩亦隨以異廬陵在淳熙間先後有二士其一曰劉改之余及識之嘗書之矣舊歲在里中與張漕仲隆棟之子似仲游因言劉叔擬詩句叔擬名擬才豪甚其詩往往不肯入格律淳熙甲辰乙已間余兄周伯持浙東庾節待次一日過仲隆同登其家後圃快目樓有詩楣間曰上得張公百尺樓眼髙四海氣橫秋只愁笑語驚閶闔不怕闌干到斗牛逺水拍天迷釣艇西風萬里襲貂裘眼前不著淮山礙望到中原天際頭周伯讀而壯之問知其擬居月餘擬來謁仲隆仲隆留之因置酒北湖招周伯曰詩人在此亟踐勝約既至一見如舊交坐中以二詩遺周伯其一曰昔年槌鼓事邉庭公相身為國重輕四海幾人思武穆百年今日見儀刑筆頭風月三千字齒頰冰霜十萬兵天亦知人有遺恨定應分付與中興其二曰巳買湖山卜奠居因君又復到康廬十年到處看詩卷一日湖邊從使車南渡忠良知有種中原消息定關渠從今便是門䦨客時出山來探詔除詩成風簷展讀大喜遂約之入浙明年叔擬過㑹稽留連纍月餉之緍錢甚夥叔擬又有題嶽陽樓一篇周伯喜誦之余得其親録本曰八月書空鴈字聮嶽陽樓上俯晴川水聲軒帝鈞天樂山色玉皇香案煙大舶駕風來島外孤雲銜日落吟邊東南無此登臨地遣我飄飄意欲仙余反覆四詩大概皆一軌轍新警峭拔足洗塵腐而空之矣獨似傷露筋骨蓋與改之為一流人物云叔擬後亦終韋布詩多散軼不傳記龍眠海㑹圖李龍眠既棄畫馬之嗜亶作𥙷陀大士相以施緇徒垂老得匹楮戲筆五百應真像幾年乃成平生繪寫具大三昧僅此軸耳先君在蜀得之毋氏雅敬浮屠常櫝致香火室中余來京口因暇日出示王英伯遂倣貝葉語為作記其右曰南閻浮提有大善知識現居士宰官婦女身在家修菩薩𣑽行有一𥘉學與其子游以是因緣得至其舍一日出示五百大阿羅漢海㑹妙相一軸於是合掌恭敬歎未曽見如人入暗忽覩光明心大歡喜莫可喻說宛轉諦觀神通變化皆得自在小大長短老幼妍醜各有所别足踏滄海如履坦途蛟蜃黿鮀魚鱉蛙蛤俯首聽命如乘安車天龍八部夜義羅剎諸惡鬼衆前後導從如役僕厮寶花繽紛天樂競集金橋架空琪樹蔽日或闖而窺或倚而立瓶鉢杖拂各有所執凌雲御風升降莫測或解衣渡水或濯足坐石或挽或負狀貌迭出以種種形成於一色於一色中衆妙畢具如幻三昧隨剎現形千變萬化不離一性如是我聞釋迦文佛既成道巳乃於耆闍崛山集阿羅漢有學無學菩薩摩訶薩次第授記陳如號曰普明五百阿羅漢亦同一號名曰普明既受佛記即得如來方便法而金剛經云實無有法名阿羅漢則是諸大阿羅漢有法無法有相無相皆不可知不可測飄流大海一切衆生天龍八部諸鬼神衆若有若無若隱若顯亦不可知不可測如夢中語如水中塵如暗中影如空中花謂之有相可乎謂之有法可乎是又不可知不可測然則斯圖之作滄海浩渺神通變化竒形異狀曲極其妙求諸法耶求諸相耶是又愚所不可知不可測夫佛於賢劫中在大梵天未出毋胎居摩尼殿集天釋梵八部之衆演暢摩訶衍法度無量無邊衆生其殿百寶裝嚴衆妙殊特匪因緣而有匪自然而成則是殿是佛是法是相謂之有乎謂之無乎知此則知海之為海羅漢之為羅漢蛟蜃黿鮀魚鱉蛙蛤天龍八部夜義羅剎似耶否耶有耶無耶匪大圎覺合凡聖於一理混物我於一心是否兩忘色空俱滅則法且無有何况於相相且無有何况於畫畫且無有何况於記雖然是理也為發大乘者說為發最上乘說若夫即心是佛因佛見性善男子善女人有能於一切法一切相而生敬心則聚沙為塔畫地成佛皆是道場何况圖畫裝嚴盡形供養當知是人成就第一希有功德所得福德亦復如是不可思議不可稱量於往昔時有大居士號曰龍眠得畫三昧始好畫馬念念弗忘有大比丘見而語之由此一念當墮馬腹於是居士躩然懴悔乃於一切諸佛諸大菩薩而致意焉端嚴妙麗隨念現形皆得三昧是羅漢者居士之所作也以居士之一念畫此羅漢以大善知識之一念得此羅漢當知是畫為第一希有畫者得者匪於過去無量阿僧祇劫承佛受記未易畫此亦未易得此至於有法無法有相無相如魚飲水冷暖自知是記也蓋為畫設開禧二年百六日𥘉學王邁謹記英伯它文亦多竒纍試詞闈不偶今尚在選調中余前書京口故游蓋其人也桯史卷第六
