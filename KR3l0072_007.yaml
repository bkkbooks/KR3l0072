front:
  text: 桯史卷第七五則
  hash: sha256:9826f4d8e48ad12c2824e89aeaace2093487a96724b91a585e86c299aa7147ab
  markers:
  - {type: page-break, offset: 0, content: '', id: KR3l0072_SBCK_007-1a}
body:
  text: 相臺嶽珂吳畏齊獵謝贄啓開禧兵隙將開憂國者慮其不終乙丑之元吳畏齊自鄂召過京口以先君湖湘之契先來訪余亟送出南水門謝不敏既而留中為大蓬未幾遂以祕撰帥荆復出閘西泝時北事巳章灼余念數路出師具有殷鑒雖上流運竒先王有遺規而今未必能且是時招僞官遣妄諜亹亹多費實無益於事天下寒心而謀國者不之知也因草一啓代贄及之曰騎虹過賀曽親謦咳之承倉鼠嘆斯尚墮塵埃之夢喜拜重來之命試伸一得之愚竊以宋受天命何啻百庚申虜汙中原又閲一甲子自崇觀撤藩籬之蔽而炎興紛和戰之謀誕謾敗事而選懦則有餘浮躁大言而矝夸之亡實有志者以拘攣而廢無庸者以積纍而升牢籠易制之人才玩愒有為之歲月肉食者鄙亡秦當可進而失機骨狺而爭逆亮以難從而求釁遂致蟠固狡兔之窟猶欲睥睨化龍之都决䇿和親姑謂奉春之孰計卧薪自厲誰為勾踐之盛心金湯恐喝於豫圖玉帛聮翩於逺餽百年棄置亦巳久矣萬口和附以為當然不特首足混於無别而反使有加將見膏血困於常輸而未知所止有識每一置念終夕為之寒心今雖欲為後乃益甚竊聞九世之大議僅積三時之成規蹤跡張皇已同獸鬪議論噂􅊱堅闢狐疑徒欲快一决而僥前功詎曰計萬全而為後慮畎畒有懷於憂國匭旌無路而陳情敢忘末學之激衷試請丈人之靜聽嘗觀古昔中興之業或因東南全盛之基規模雖狹於未宏功業亦隨其所就孫氏北無淮而西無蜀距江尚固於周防晉室內有寇而外有戎渡水亦成於克捷彼皆未盡有今日之所有我乃類欲為當時之不為邊草未搖紛紛抵掌塞塵一警惴惴奉頭㢮張以道固曰隨時勇怯任情料必至此未嘗有十年之生聚但聞以千里而畏人惟昧於天下轉移之機所以成流俗衰頽之弊願姑置尋常以破未識時之說特欲舉一二以釋妄乘勢之疑夫江淮為唇齒之邦關陜乃腹心之地欲近守則不當固其內而舍其外欲逺攻則安可即所後而忘所先况天險可守共守則險亦均地利可据能据則利必倍此皆不易之常理具有巳行之舊規襄陽關中之喉兵易進而亦易退京師海內之腹守可暫而不可常通秦蜀兩道之勢則兵力不宜輕居陳梁四戰之郊則守備不必泥使靈旗再圖北指詎不先出峴之師而大駕一日東歸似難執居汴之䇿蓋設嶮象存於習坎而趨時患在於用常誠由泗宿以下靈壁之師因登萊而濟海道之衆淮西則出夀春而窺許境關外則道大散而瞰雍郊是謂正兵皆為危道蓋河南雖可得而難於持久舟師雖可用而未為全謀即平壤以制敵蹉跌則不支用嶮道以出兵饋餉則難繼故顯忠卒成符離之􅗮而至於潰李寶僅濟膠西之捷而不敢留水路貽明徹之憂陸運制武侯之出非陳言之是襲亦啇監之可稽若夫運上流之竒此端繫大賢之責一軍下􅉑略中原之勢已搖萬騎出頴昌京畿之地旋復南城分徇而首尾互應朱仙進擊而手足猖披惟是時之舉偶困於謗書而此日之功難言於覆簣苟盡得䇿豈復至今自兩河而言則銅梁為舊疆由九郡而論則金坡為限塞平州與三關異路而不豫計真兒戲哉白溝僅一水纍世而不敢踰亦幸安耳今欲為能勝而必不可勝固當審所圖而棄其難圖豈徒舍敗績而趨成功庶不因空名而受實禍宣和之捷所以胎靖康之變隆興之戰所以成乾道之盟惟思之逺而慮之深庶功可成而憂可弭大姑少置小亦未安招攜固上䇿而納歸正乃自困之資用間誠至謀而遣妄諜乃無益之費僞官換授是當誅而蒙賞厚資輕卑是以實而易虛雖至愚猶且知其非豈在上顧甘循其弊許移治者是許其棄地令擇利者是令其退師徒使全家保妻子之臣用以藉口竊爵祿之寵邊城保鄣以廟堂使闕而不免於屢遷戎閫事機以主帥豢安而常淹於難逹偃然以承平文飾之體巍乎居要境藩維之權塞下之粟反內徙以自虛軍中之弊猶日朘而不止歲市駿而不能償耗誰興開元監牧之謀日計漕而未足饋軍孰啓神爵屯田之䇿民兵文具禁籍虛貟奈何欲興不世之俊功尚爾未革易知之宿弊此特言其梗槩𥘉未效於㳙埃巳不勝賈生痛哭之私矧欲致臧宫鳴劔之議試捈悶悶母謂平平恭惟某官以世大儒助國正論貫兼資於文武視一節於險夷歸自乘軺公議浩然而歸重卑之顓閫天心昭若以可知上方勤西顧之憂公特任北門之寄風露三神之頂洊爾褰裳旌旗千騎之來跫然望履聳列城之觀望屹外閫之蕃宣當盡逺猷庶銷過計某辱知最渥因事有言屢矣蹉跎雖粗有少年之志斐然狂簡得毋貽小子之嗤或可執鞭願供磨盾其諸軟熟之貢徒致髙明之煩嗣聽䇿勳别當修贄畏齊在丹陽館一覽輒喜親作數語謝曰抗身名以衛社稷久沉射虎之威疏王爵以大門閭將表食牛之氣有來相過允荷不忘監倉學士風烈承宗詞葉振俗喜北平之有後幸郎君之克家庾氏卑官王孫令器必有表薦以發忠嘉至於陳誼之甚髙與夫期待之太過此則諸君子之責而非一郡守之憂某行官沔鄂之間即有兵民之寄當呼老校退卒問先烈之宏規將與羣公貴人誦故侯之名緒叙謝之意匆草莫殫於是一得之謀頗徹於諸公間矣又一年稍稍如言宇文顧齊聞之從章以𥘉録本去㑹除次對謬以充自代薦且有志識不羣之褒𥘉未相識也故余投謝駢儷有曰𥘉不求於識面亶自得於知心蓋指此它日又特剡亟稱之于廟堂余迄不知所䝉近翻故笈偶見存本因悼殄瘁潸然出涕書之以志余之愧於知巳者焉楚齊僣冊靖康元年金人陷京師明年太宰張邦昌僣帝位是歲邦昌伏誅又三年盡陷中原地殿中侍御史劉豫復僣帝位九年豫就執北去余嘗得其二冊文乃刪其吠堯者而剟録之邦昌之冊曰維天㑹五年歲次丁未二月辛亥朔二十有一日辛巳皇帝若曰朕惟我太祖武元皇帝肇建區夏務安元元肆朕纂承不敢荒怠夙夜兢兢思與萬國格于治粵惟有宋實乃通鄰貢歲幣以交歡馳星軺而講好期於萬世永保無窮蓋我有大造于宋也不圖變誓渝盟以怨報德開端招禍反義為仇今者國既乏主民冝混同然念厥功誠非貪土遂命帥府與衆推賢僉曰太宰張邦昌天育疏通神資睿哲處位著忠良之譽居家聞孝友之名實天命之有歸仍人情之所徯擇其賢者非子而誰是用遣使備禮以璽紱寶冊命爾為皇帝以援斯民國號大楚都于金陵自黃河以外除西夏封圻疆場仍舊世輔王室永為藩臣貢禮時修勿疑於述職問音歲至無緩於披誠於戲天生蒸民不能自治故立君以臨之君不能獨理故設官以教之乃知民非后不治后非賢不守其有位者可不謹歟子懋乃德嘉乃丕績日敬一日雖休勿休欽哉其聽朕命豫之冊曰維天㑹八年歲次庚戌七月辛丑朔二十有七日丁卯皇帝若曰朕公於御物不以天下為已私職在牧民乃知王者為通器威罰既巳殄罪位號冝乎授能乃者有遼運屬㒹危數窮否塞獲罪上帝流毒下民太祖武元皇帝杖黃鉞而拯黎元麾白旄而誓師旅妖氣既殄區宇大寧爰有宋人來從海道願輸歲幣祈復漢疆太祖方務善鄰即從來議重念斯民久罹塗炭未獲昭蘇不委仁賢孰能保定咨爾劉豫夙擅直言之譽素懷濟世之才居于亂邦生不偶丗百里雖智亦奚𥙷於虞亡三仁至髙或顯從於周仕當姦賊擾攘之際正愚氓去就之間舉郡來王奮然獨斷逮乎歷試厥勳克成夫委之安撫教化行任之尹牧獄訟理付之總戎盜賊息專之節制郡國清况有定衰救亂之謀必挾拯變扶危之䇿使民無事則櫜弓力穡有役則釋耒荷戈罷無名之征捐不急之務徴隱逸舉孝廉振紀綱修制度省刑罰而去煩酷發倉廩而息螽螟神人以和上下協應比下明詔詢考輿情列郡同辭一心仰在冝即歸仁之地以昭建業之元是用遣西京留守髙慶裔副使禮部侍郎知制誥韓昉備禮以璽紱寶冊命爾為皇帝國號大齊都于大名歲修子禮永貢䖍誠卑爾封疆並從楚舊更須安集自相攸居爾其上體天心下從人欲忠以藩王室信以保邦圻惟天難諶惟命靡常謹厥德保厥位爾其勉哉勿忽朕命玉冊皆以六十六方為制每方字兩行以金書之於呼犬羊亂華㒹倒冠履一至於此讀此者得不起魯仲連之愧乎優伶詼語秦檜以紹興十五年四月丙子朔賜第望仙橋丁丑賜銀絹萬匹兩錢千萬綵千縑有詔就第賜燕假以教坊優伶宰執咸與中席優長誦致語退有參軍者前褒檜功德一伶以荷葉交倚從之詼語雜至賔歡既洽參軍方拱揖謝將就倚忽墜其幞頭乃總髮為髻如行伍之巾後有大巾鐶為雙疊勝伶指而問曰此何鐶曰二勝鐶遽以朴擊其首曰爾但坐太師交倚請取銀絹例物此鐶掉腦後可也一坐失色檜怒明日下伶於獄有死者於是語禁始益繁芮燁令袊等吻禍蓋其末流焉嘉禾篇張丞相啇英媚事紹聖共倡紹述崇寧二年遂為尚書左丞㑹與蔡元長異論中執法石豫殿中御史朱紱余深以風㫖將劾奏之而無以為說或言其在元祐中嘗著嘉禾篇擬司馬文正於周公且為開封府推當其薨時代府尹為酹祭文有褒頌功德語因請正其罰有詔張啇英秉國政機論議反覆加之自取榮進貪冒希求元祐之𥘉詆訾先烈臺憲交章豈容在列可特落職依前通議大夫知毫州余家舊有石刻正其所謂嘉禾篇者文既爾雅論亦醇正惜乎其好德之不終也因録之以表其𥘉終焉篇之言曰維元祐丁卯十月定襄守臣得禾異畒同頴部使者臣張啇英作嘉禾神宗既登􅜯嗣皇帝冲幼中外震懼罔知社稷攸託惟太母晦聖德于深宫五十有四年克莊克明克仁克簡肆􅈾顧命保佑神孫以總大政既臨延和乃告于侍臣曰嗚呼先皇帝聰明文武宏規偉圖軼于古先丕惟曰禹貢九州之域久封裔壤塪于殊俗豺狼野心終不可豢序弗底平時以憂貽于我後昆乃備材力乃督事功務除大害不恤小怨今既墜厥志罹家多艱其弛利源與民共之所不欲一切蠲罷庶事肇革衆志未孚新故相刑愛惡相反議論乘隙紛綸互建疑生于弗親忿生于弗勝其睽成仇其合成黨盈庭睢盱震于視聽惟聖母燭以純靜斷以不惑去留用捨不歸于偏歸于是越三載羣慝斯嘉羣乖斯和羣異斯同馨聞于上帝風雨時若英華豐美𬒳于草木發珍祥于兹嘉禾厥本惟三厥壠惟五厥穗惟一臣聞曰在昔成王冲幼周公居攝近則召公不恱逺則四國流言成王灼知忠邪之情誅伐讒慝卒以天下聽於周公時則唐叔得禾異畒同頴以獻推古驗今跡雖不同理或胥近臣啇英敢拜手稽首旅天之命曰嗚呼先民有言衆賢和於朝萬物和於野和氣致祥乖氣致異治平之時君臣罔不咸有一德在虞舜時百僚師師在文王時多士濟濟降及幽王小人在位君子在野其詩曰潝潝訿訿又曰噂􅊱背憎嗚呼卿士庶尹敬之哉曲直之辨是非之判罔或不異如禾之本終以合潁利害之當豫奪之中罔或不同如禾之穎非離于本無有作同害于而公臣吳安操臣李昭叙等立石余又嘗求其開封祭文而觀之頌之極摯者亦特曰公在熙寧謫居洛京十有五年資治書成帝維寵嘉以子登􅌡方渴起居而帝在天太母垂簾保祐神孫疇咨在庭屬以宗社介特真淳無易公者公來秉鈞久詘而伸五害變法十科取人孰敢弗良孰敢弗正有傾其議必以死爭日月徂征思速用成心勦形瘵胡衛餘生嘉謀嘉猷百未有告訃音夜奏九重震悼爵惟太師開國于溫莫惠我民門巷煩冤乃命二卿葬其先原公殮具資一給于官悠悠蒼天從古聖賢損益盛衰與時屢遷功虧于簣志奪于年古也如斯豈公獨然巳矣溫公夫何憾焉如此而已雖違時論亦非大溢美者蓋五害等字乃當時之所深諱是以亟黜而不留也張之立朝其𥘉議論具是暨哲宗親政首為諌官乃指吕汲公范淳夫輩為大姦而以司馬文正文忠烈為負國甚者至以宣仁比吕武殊視此文為不同反覆之言聖謨其得之矣其後入黨籍却反成濫置大觀爰立本以其能與蔡立異而用之亦不能久也欽皇嗣服㑹時相主其人贈以太保與范司馬二文正並命天下莫不疑之王稱作東都事略載張罷左丞以言蔡京姦邪有自為相國志在逢君等語臺臣以為非所冝言而謫之考之史諜蓋專坐此篇稱書誤甚當因其異同之迹而遂從傳疑其實非也朝士留刺秦檜為相久擅威福士大夫一言合意立取顯美至以選階一二年為執政人懷速化之望故仕於朝者多不肯求外遷重內輕外之弊頗見於時有王仲荀者以滑稽遊公卿間一日坐于秦府賔次朝士雲集待見稍久仲荀在隅席輒前白曰今日公相未出堂衆官久俟某有一小話願資醒困衆知其善謔爭竦聽之乃抗聲曰昔有一朝士出謁未歸有客投刺于門閽者告之以某官不在留門狀俟歸呈禀客忽勃然發怒叱閽曰汝何敢爾凡人之死者乃稱不在我與某官厚故來相見某官獨無諱忌乎而敢以此言目之耶我必俟其來面白以治汝罪閽拱謝曰小人誠不曉諱忌願官人寬之但今朝士留謁者例告以如此若以為不可當復作何語以謝客客曰汝官既出謁未回第云某官出去可也閽愀然蹙頞曰我官人寧死却是諱出去二字滿坐皆大笑仲荀出入秦門預䙝客老歸建康以死談辭多風可雋味秦雖煽語禍獨優容之蓋亦一吻流也桯史卷第七
