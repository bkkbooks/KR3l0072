front:
  text: 桯史卷第八十二則
  hash: sha256:cce2ebaacd1aebc474af6089acecd82a98f2de3201e0758b20f1bae0e4fe3d69
  markers:
  - {type: page-break, offset: 0, content: '', id: KR3l0072_SBCK_008-1a}
body:
  text: 相臺嶽珂九江郡城九江郡自梁太清始奠湓口湓口乃漢灌嬰所築也灌井在焉故余家晉盆杅事猶有冡居城中城負江面山形勝盤据三方阻水頗難於攻取開寶中曹翰討胡則踰年不下或獻計於翰曰城形為上水龜非腹脅不可攻從之果得城至今父老指所由入云在北闉新倉後郡治之前對康廬有峰曰雙劔乾道間蜀人唐立方文若來為守謂翰實屠城而李成等寇亦嘗入郛殘其民取隂陽家說意劔所致乃闢譙樓前地築為二城夾樓矗其上謂之匣樓曰匣實藏劔江人相勸成之有日者過其下曰是利民而不利於守立方聞之不以為意居一年果卒官其異如此立方故知名嘗為中書舍人終之年六十八日官失職近丗清臺占候頗失其守雖試選甚囏多筌蹄之學以故證應之驗視前丗為疏開禧丙寅二月丙子余在京口章以𥘉居戎司薌風亭余涖事庾中歸過之小酌握手庭下日方申忽覺天半砰鍧有聲甚厲矯首正見一星南隊曵尾如帚逶迤久之始滅相與歎異未幾而兵釁開江淮荐饑死者幾半嘉定巳巳五月辛亥余里居晚浴散步西圃暝色將至從行一僮忽卬而驚呼視之亦一星大小如京口所見而色紺青尾𦦨煜煜自南徂北行頗迅亦隱隱鳴于空中時虜酋易位䝉韃闖其境兵禍紏結數年猶不解則所隊之方蓋有妖焉余不甚習變星二星所偶見皆白晝出太史且未嘗問亦不聞奏報其它躔度微忒意必不能詳也紫宸廊食余為扈簿日瑞慶節隨班上夀紫宸殿是歲虜方拏兵北邊賀使不至百官皆賜廊食余待班南廊日巳升見有老兵持二髹牌至金書其上曰輒入御厨流三千里既而太官供具畢集無帟幕限隔僅以鐐竈刀機自隨綿蕞簷下侑食首以旋鮓次暴脯次羊肉雖玉食亦然且一小楪如今人家海味楪之制合以玳瑁而金托之封其兩旁上以黃紙書品嘗官姓名以待進黼坐既御合班拜舞用樂伶人自門急趨折檻以兩䄡為作止之節廊下設纈褥置爼于前有有核爵以銀而厚其脣為之一耳頗不便於飲上鐫紹興十二年某州所造蓋和議成而舉彌文責之外郡以期速集也每舉酒玳合自東廡入廊饌繼至適盧棘簿子文在旁因言此藝祖舊制在汴京時天造草昧一日長春節欲盡宴廷紳有司以不素具奏不許令市脯隨其有以進仍詔次序勿改以昭示儉之訓如錫宴貢院前二盞止以果實薦無品食蓋當時市之者未至耳其第三盞亦首以旋鮓云余聞之典儀吏曰它日戎贄在廷則百官皆稱夀而退無賜食七十年矣此乃適因其不來而舉行者故竊志之阜城王氣崇寧間望氣者上言景州阜城縣有天子氣甚明徽祖弗之信既而方士之幸者頗言之有詔斷支隴以泄其所鍾居一年猶云氣故在特稍晦將為偏閠之象而不克有終至靖康僞楚之立踰月而釋位逆豫既僣遂改元阜昌且祈于金酋調丁繕治其故嘗夷鏟者力役彌年民不堪命亦不免於廢也二僣皆阜城人卒如所占云袁孚論事孝宗𥘉政袁孚為右正言一日亟請對論北內有私酤言頗切直光堯聞之震怒上嚴於養志御批放罷中使持璽封至堂時陳文正當國史文惠為參預未知其倪啓封相顧周測文惠曰上新即位而首逐一諌官未得其名此决不可請俟審奏翌日遂朝方扣榻以請玉音峻厲遽曰謂已行下矣尚何留文惠奏曰陳康伯固欲速行而臣不欲也臣有千慮之一願留身以陳班退文惠問孚何罪也上諭以疏意曰是非所冝言不逐何待曰陛下亦知德夀宫中無士人乎曰何謂也曰北內給事無非閹人是惡知大體若非幾箇村措大在言路時以正論折其萌芽此曹馮依自恣何所不至上竦而悟天顔少和文惠進曰不特此事爭臣無故賜罷天下咸以為疑而欲知其故若以此為罪則兩宫之間且生四方聞之必謂陛下方以天下養而使北內至於有此非供億不足而何必不得已而去當因其自請而聽之可耳上釋然霽威曰善將退復前曰後之日復當五日之朝願陛下試以意白去孚儻可以上皇意留之尤盛德事上許諾既歸自北宫亟召文惠而諭之曰太上怒袁孚甚朕所以亟欲去之昨日方燕太上賜酒一壷親書德夀私酒四字於上使朕局蹐無所文惠曰此陛下之孝也雖然終不可暴其事居數日孚請祠得守永嘉郡既而文惠又奏諌官以直言去非邦家之美請以職名華其行遂除直祕閣外朝竟不及知自是纎人知譛之不行亦無復投隟者一言回天體正誼得兩宫慈孝終始無間此舉實足以權輿之云鸚鵡諭蜀士尚流品不以勢詘乾道間楊嗣清甲有聲西州清議推屬𥘉試邑有部使者不欲名頗以繡衣自驕怒其不降意誣劾以罪趙衛公方為左史聞之不俟車亟往白廟堂曰譬之人家市猫于鄰卜日而致之將以咋鼠也鼠暴未及問而首抉雕籠以噬鸚鵡其情可恕乎當國者問其繇告以故相與大笑劾牘竟格不下嗣清仕亦不顯有弟曰嗣勳輔位至從橐其清名亦相伯仲云至今蜀人談謔以排拫善類者為猫噬鸚鵡王中父嘗為余道而忘其所為邑之名月中人妖逆曦未叛時嘗歲校獵塞上一日夜歸笳鼓競奏轔載雜襲曦方垂鞭四視時盛秋天宇澄霽卬見月中有一人焉騎而垂鞭與巳惟肖問左右所見皆符殊以為駭默自念曰我當貴月中人其我也揚鞭而揖之其人亦揚鞭乃大喜異謀繇是益决德夫兄至蜀安大資丙與之宴親言之夫妄心一萌舉目形似此正與投楮天池者均耳月妖何尤牸牧相衛先塋吕田原之北二里許有山焉不合如礪土名曰焦庫有周氏墳其間篁木蔽翳泉甘草茂牧者趨之嘉定癸酉四月甲午正晝有詹氏子十九歲牧一牸墳側方偃于背鄰之二兒甫齓戲于旁有虎出于薄直前搏牸二兒癡不識為虎擲瓦礫嗾而逐之虎顧牸不肯去二兒倚徙觀稍前乃緣登木牧子念其家貧惟恃此以耕不勝憤徑歸取斧將以殺虎其父在田不之知毋視其來也遽問而告其故顧東作方殷家無男子乃集里婦數人譟而從既至二兒觀酣嬉笑自若牸以角拒虎爪嚙無完革矣牧子視牸且困揮斧大呼欲以致虎虎果舍牸來時木影漏日刃環舞翕霍有光虎益自縮作勢奮迅欲以攫取牸少憩力蘇乃前鬪虎舍牧子與之相持牧子氣定更進虎又舍牸牸與牧迭抗虎如此者彌半日頃羣婦莫之孰何既而山下民聞者持梃歡呼來漸多虎遂棄而去牸牧竟全余時倚堊冡下僕輩親見之來告遣視民方環睨虎猶未逸也畜而義不忘衛所牧牧子亦克念其家奮不顧死皆可尚二兒不知畏不𬒳搏噬東坡沙上抵首之說諒可信云解禪偈余嘗得東坡所書司馬溫公解禪偈其精義深韞真足以得儒釋之同特表其語而出之偈之言曰文中子以佛為西方之聖人信如文中子之言則佛之心可知也今之言禪者好為隱語以相迷大言以相勝使學者倀倀然益入於迷妄故余廣文中子之言而解之作解禪偈六首若其果然則雖中國行矣何必西方若其不然則非余之所知也忿氣如烈火利欲如銛鋒終朝常戚戚是名阿鼻獄顔回安陋巷孟軻養浩然冨貴如浮雲是名極樂國孝弟通神明忠信行蠻貊積善來百祥是名作因果仁人之安宅義人之正路行之誠且久是名光明藏言為百代師行為天下法久久不可掩是名不壞身道義修一身功德𬒳萬物為賢為大聖是名菩薩佛於呼妄者以虛辭岐實理以外慕易內修滔滔皆是也豈若是偈之坦明無隱乎盍反而觀之玉虛密詞徽祖將內禪既下哀痛之詔以告宇內改過不吝發于至誠前一夕即玉虛殿常奉真馭之所百拜密請祈以身夀社稷夜漏五徹焚詞其間嬪嬙巨璫但聞謁禱聲而莫知其所以然明日遂御玉華閣召宰執書傳位東宫四字以付蔡攸又一日欽宗遂即位實宣和七年十一月辛酉也明年正月巳已赤白囊至徽祖夜出通津門以如亳社斡離不既退師龍德行宫在京口纎人乘間有劔南自奉之疑奉表亟請歸京師駕至睢陽李忠定綱奉詔迎謁見于幄殿既辭遂出所焚詞藁俾宣示宰執百官忠定家有藏本焉其辭曰奉行玉清神霄保仙元一六陽三五璇璣七九飛元大法師都天教主臣某誠惶誠恐頓首頓首再拜上言髙上玉清神霄九陽總真自然金闕臣曩者君臨四海子育萬民緣德菲薄治狀無取干戈並興弗獲安靖以宗廟社稷生民赤子為念巳傳大寶于今嗣聖庶幾上應天心下鎮兵革所冀邇歸逺順宇宙得寧而基業有無疆之休中外享升平之樂如是賊兵偃戢普率康寧之後臣即寸心守道樂處間寂願天昭鑒臣弗敢妄將來事定復有改革窺伺舊職獲罪當大已上祈懇或未至當更乞垂降災咎止及眇躬庶安宗社之基次保羣生之福五兵永息萬邦咸寧伏望真慈特賜省鑒臣謹因神霄直日功曹吏賫臣密表一道上詣神霄玉清三府引進仙曹伏願告報臣誠惶誠恐頓首頓首再拜以聞於呼禹湯罪已其興也勃焉聖心其有以得於天矣按蔡絛國史後𥙷載徽祖教門尊號為玉京金闕七寶元臺紫微上宫靈寶至真玉晨明皇大道君與此不同意歸美之稱不欲以自名耳唐武宗㑹昌投龍文稱承道繼玄昭明三光弟子南嶽上真人今茅山龍虎閣皂實有三壇符籙遍天下受之者亦各著稱謂或者帝王之號又有其别殆未可知也太歲方位建隆三年五月詔增修大內時太歲在戌司天監以興作之禁移有司毋繕西北隅藝祖按視見之怒問所繇司天以其書對上曰東家之西即西家之東太歲果何居焉使二家皆作歲且將誰凶司天不能答於是即日涖撤一新之今丗士大夫號於逹理者每易一榱覆一簣翦翦拘泥不得即决稽之聖言思過半矣逆亮辭怪金酋亮未篡僞封岐王為平章政事頗知書好為詩詞語出輒崛疆愸愸有不為人下之意境內多傳之且驟施於國東昏疑焉未及誅而有霄儀之禍宗族大臣以亮有素譽因共推戴既立遂肆暴無忌佳兵苛役以迄于亡然其居位時好文辭猶不輟余嘗得其數篇𥘉王岐以事出使道驛有竹輒詠之曰孤驛瀟瀟竹一叢不同凡卉媚春風我心正與君相似只待雲梢拂碧空又書壁述懷曰蛟龍潜匿隱滄波且與蝦蟆作混和等待一朝頭角就撼搖霹靂震山河既而過汝隂復作詩曰門掩黃昏染緑苔那回蹤跡半塵埃空亭日暮烏爭噪幽徑草深人未來數仭假山當戶牗一池春水繞樓臺繁花不識興亡地猶倚䦨干次第開又嘗作雪詞昭君怨曰昨日樵村漁浦今日瓊川小渚山色捲簾看老峰巒錦帳美人貪睡不覺天花剪水驚問是楊花是蘆花一日至卧內見其妻几間有巖桂植瓶中索筆賦曰緑葉枝頭金縷裝秋深自有别般香一朝揚汝名天下也學君王著赭黃味其詞㫖已多圭角蓋其蓄已不小矣及得志將圖南牧遣我叛臣施冝生來賀天申隱畫工於中節使圖臨安之城邑及吳山西湖之勝以歸既進繪事大喜􅗎然有垂涎杭越之想亟命撤坐間軟屏更設所獻而於吳山絶頂貌已之狀䇿馬而立題其上曰萬里車書盍混同江南豈有别疆封提兵百萬西湖上立馬吳山第一峰遷汴之歲已弒其母矣又二日而中秋待月不至賦鵲橋仙曰停杯不舉停歌不發等候銀蟾出海不知何處片雲來做許大通天障礙虬髯撚斷星眸睁裂惟恨劔鋒不快一揮截斷紫雲腰子細看嫦娥體態明年竟遂前謀使御前都統驃騎衛大將軍韓夷耶將射鵰軍二萬三千圍子細軍一萬先下兩淮臨發賜所製喜遷鶯以為寵曰旌麾𥘉舉正駃騠力健嘶風江渚射虎將軍落鵰都尉繡帽錦𫀆翹楚怒磔㦸髯爭奮捲地一聲鼙鼓笑談頃指長江齊楚六師飛渡此去無自墮金印如斗獨在功名取斷鎖機謀垂鞭方略人事本無今古試展卧龍韜韞果見成功旦莫問江左想雲霓望切玄黃迎路余又嘗問開禧降者能誦憶尚多不能盡識觀其所存寓一二於十百其桀驁之氣已溢于辭表它蓋可知也犬狺梟鳴要充其性不足乎議軟屏詩正隆事迹以為翰林修撰蔡圭所作詭曰御製反覆它作似出一機杼或者傳疑益訛抑其餘皆出於視草亦無所致詰録所見者聊以寓志怪云洪文敏夷堅支景僅載其二它不傳
