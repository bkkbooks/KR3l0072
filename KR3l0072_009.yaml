body:
  text: 相臺嶽珂𥙿陵聖瑞𥙿陵年十三居于濮邸一日正晝憩便寢英祖忽顧問何在左右褰帳方見偃卧有紫氣自鼻中出盤旋如香篆大駭亟以聞英祖笑曰勿視也後三年亦以在寢寤驚欽聖請其故曰方熟寐忽覺身在雲表有二神人捧足以登天是以呼耳既而果登大寶元祐元年三月十四日詔録聖瑞之詳付宗正寺狀元雙筆內黃傳珏者以財雄大名父世隆決科為二千石珏不力於學辨鶡碌碌下僚獨能知人嘗坐都市閲公卿車騎之過者言它日位所至無毫髮差𥘉不能相術每曰豫自得於心亦不能解也嘗寓北海王沂公曽始就鄉舉珏偶俟其姻于棘圍之外遇之明日以雙筆要而遺之曰公必冠多士位宰相它日無相忘聞者皆笑珏不為怍遂定交傾資以助其用沂公賴之既而如言故沂公與其二弟以兄事之終身不少替前輩風誼凛凛固可敬而珏之識亦未易多得也珏死明道問官止右班殿直監博州酒其孫獻簡堯俞元祐中為中書侍郎自志其墓余舊嘗見前輩所記與志微不同堯舜二字歐陽文忠知貢舉省闈故事士子有疑許上請文忠方以復古道自任將明告之以崇雅黜浮期以丕變文格蓋至日吳猶有喋喋弗去者過晡稍閴矣方與諸公酌酒賦請士又有扣簾梅聖俞怒曰瀆則不告當勿對文忠不可竟出應鵠𫀆環立觀所問士忽前曰諸生欲用堯舜字而疑其為一事或二事惟先生幸教之觀者閧然笑文忠不動色徐曰似此疑事誠恐其誤但不必用可也內外又一笑它日每為學者言必蹙頞及之一時傳以為雅謔余按東齋記事指為楊文公而徒問其為幾時人歲逺傳疑未知孰是然是舉也實得東坡先生識者謂不啻足為詞場刷耻矣彼士何嗤正隆南寇金國偽正隆丁丑春二月逆亮御武德殿召其臣吏部尚書李通刑部尚書胡勵翰林直學士蕭廉賜坐而語之曰朕自即位視閲章奏治宫中事常至丙夜始御內寢疇昔之夜方就榻恍惚如親覿有二青衣持幢節自天降授朕以幅紙若牒謂上帝有宣命朕再拜受遂佩弓矢具鍪鎧將從之前而朕常所御小騅號小將軍者倏巳空勒待墀下青衣揖就騎既行但覺雲霧勃鬱起馬蹄間下如海濤洶湧方覺心悸望一門正開金碧焜耀青衣指之曰天門也朕隨入焉又里許至鈞天之宫嚴邃宏麗光明奪目朕意欲馳二金甲人謂朕曰此非人間可下馬步入及殿下垂簾若有所待須臾有朱衣出贊拜髣佛聞殿上語如嬰兒使青衣傳宣卑朕曰天䇿上將令征某國朕伏而謝出復就馬見兵如鬼者左右前後杳無邊際發一矢射之萬鬼齊喏聲如震雷驚而寤喏猶不絶於耳朕立遣內侍至廄視小將軍喘汗雨浹取箭箙數之亦亡其一矣昭應如此豈天假手於我令混江南之車書乎方與卿等圖之謹無泄衆皆稱賀於是始萌芽南牧之議矣明年夏五月復召通及翰林學士承旨翟永固宣徽使敬嗣暉翰林直學士韓汝嘉入見薰風殿問曰朕欲遷都于汴遂以伐宋使海內一統卿意如何通以天時人事不可失機為對亮大恱永固却立楹間亮顧見之問之故徐進曰臣有愚慮請殫一得本朝自海上造邦民未見德而黷兵是聞皇統亦知其不戢之自焚也故雖如梁王之武毅猶以和為長䇿今宋室偏安天命未改金繒締好歲事無闕遽欲出無名之師以事逺征臣竊以為未便兼中都始成未及數載帑藏虛乏丁壯疲瘁營汴而居是欲竭根本冨庶之力以繕爭戰丘墟之地尤為非冝臣事陛下不敢不以正對因伏地請死亮以問暉汝嘉暉是通汝嘉是永固亮大怒拂袖起傳宣二臣殿側聽旨繼而召翰林待制綦戩講漢史戩及陸賈新語事亮怒稍霽乃赦之明日通為右丞暉為參知政事永固遂請老又明年左丞相張浩及暉與叛臣孔彥舟內侍梁漢臣卒營汴焉帝豝之禍實昉此汝嘉又二年來盱眙傳命諭郤我使人徐嚞等歸而微諌竟不免戮命讀張棣正隆事迹博考它記而得其顚末熊克中興小曆書於紹興二十八年者蓋誤以薰風之事合於武德云梁王者大酋兀术之封李大諒征蒙記謂嘗追册以帝號按紹興辛巳髙景山來求淮漢地指𥘉畫疆事亦以為梁王要當以國中通言者為正鱉渡橋虞雍公允文以西掖贊督議既郤逆亮于采石還至金陵謁葉樞密義問于玉帳留鑰張忠定燾及幕屬馮校書方洪檢詳邁在焉相與勞問江上戰拒之詳天風欲雪因留卯飲酒方行流星警報沓至蓋亮巳懲前􅗮將改圖瓜洲坐上皆恐謂其必致怨於我也時劉武忠錡屯京口病且亟度未必可倚議遣幕府合謀支敵衆以雍公新立功咸屬目葉四顧久之酌巵醪以前曰馮洪二君雖參帷幄實未履行陳舍人威名方新士卒想望勉為國家卒此勳業義問與有賴焉雍公受巵起立曰某去則不妨然記得一小話敢為都督誦之昔有人得一鱉欲烹而食之不忍當殺生之名乃熾火使釡水百沸橫篠為橋與鱉約曰能渡此則活汝鱉知主人以計取之勉力爬沙僅能一渡主人曰汝能渡橋甚善更為我渡一遭我欲觀之僕之此行無乃類是乎席上皆笑已而雍公竟如鎮江亮不克渡而弒自此簡上知馴致魁柄鱉渡本諺語以為蟹其義則同燕山先見宣和將伐燕用其降人馬植之謀由登萊航海以使于女真約盡取遼地而分之子女玉帛歸女真土地歸我議既定矣宇文肅愍虛中在西掖昌言開邊之非䇿論事亹亹王黼惡之及童貫蔡攸以宣威建臺遂使之參謀意欲溷以同浴且窒其口時有旨乏興避事皆從軍法肅愍不得免乃上書極諌曰臣伏覩陛下恢睿聖英武之略紹祖宗之詒謀將舉仁義之師復燕雲之故境不以臣愚不肖使參預機密臣𬒳命之𥘉意謂朝廷未有定議欲命臣經度相視其事及至河北諸路見朝廷命將帥調兵旅厲器械轉移錢糧已有擇日定舉之説臣既與軍政苟有所見豈敢隱默輒具利害仰干淵聽臣聞用兵之䇿必先計強弱虛實知彼知已以圖萬全今論財用之多寡指宣撫司所置便為財用有餘若沿邊諸郡帑藏空虛廩食不繼則略而不問論士卒之強弱視宣撫司所駐便言兵甲精鋭若沿邊諸郡士不練習武備刓缺則置而不講夫邊圉無應敵之具軍府無數日之糧雖孫吳復生亦未可舉師是在我者未有萬全之䇿也用兵之道禦攻者易攻人者難守城者易攻城者難守者在內而攻者在外在內為主而常逸在外為客而常勞逸者必安勞者必危今宣撫司兵約有六萬邊鄙可用不過數千契丹九大王耶律淳者智略輻湊素得士心國主委任信而不疑今欲亟進兵於燕城之下使契丹自西山以輕兵絶吾糧道又自營平以重兵壓我營壘我之糧道不繼而耶律淳者激勵衆心堅城自守則我亦危殆矣是在彼者未有必勝之兆也夫在我無萬全之䇿在彼亦未可必勝兹事一舉乃安危存亡之所繫豈可輕議乎且中國與契丹講和今踰百年間有貪婪不過欲得關南十縣而止耳間有傲慢不過對中國使人稍虧禮節而止耳自女真侵削以來嚮慕本朝一切恭順今捨恭順之契丹不封植拯救為我藩籬而逺踰海外引強悍之女真以為鄰國彼既藉百勝之勢虛喝驕矝不可以禮義服也不可以言説諭也視中國與契丹拏兵不止鏖戰不解勝負未決強弱未分持卞莊兩鬪之説引兵踰古北口撫有悖桀之衆繫纍契丹君臣雄據朔漠貪心不止越逸疆圉慿陵中夏以百年怠墮之兵而當新鋭難敵之虜以寡謀持重久安間逸之將而角逐於血肉之林巧拙異謀勇怯異勢臣恐中國之邊患未有寧息之期也譬猶冨人有萬金之産與寒士為鄰欲肆并吞以廣其居乃引強盜而謀曰彼之所處汝居其半彼之所畜汝取其全強盜從之寒士既亡雖有萬金之富日為切鄰強盜所窺欲一夕髙枕安卧其可得乎愚見竊以為確喻望陛下思祖宗創業之艱難念鄰域百年之盟好下臣此章使百寮廷議儻臣言可採乞降詔旨罷將帥還朝無滋邊隙俾中國衣冠禮義之俗永覩升平天下幸甚臣冒昧盡言不任戰栗書下三省黼讀之大怒捃以他事除集英殿修撰督戰益急而北事始不可收拾矣遼又有降將曰郭藥師統其卒曰常勝軍怙寵負衆漸桀驁不可馴肅愍憂之力言于朝請以恩禮留之京師盡使挈致家屬居于賜第緩急有用只以單騎遣行事畢即歸以杜後患亦弗聽既而金人寒盟藥師首叛粘罕遂犯太原肅愍以宣諭使事歸奏徽祖見之歎曰王黼不用卿封殖契丹以為藩籬之議是以有此是日遂詔於榻前草詔罪巳大革弊政其略曰百姓怨懟而朕不知上天震怒而朕不悟令下人心大恱識者以比陸贄感泣山東之詔云植之歸以童貫先改姓名李良嗣後賜國姓靖康𥘉伏誅藥師仕金至安邦鎮國功臣其子亦顯蠲毒圎髙皇育聖中原得西北之正氣夙賦充實自少至耋未嘗用溫劑每小不怡輒進蠲毒圎數百一以芫花大黃大戟為主侍醫縮頸而上服之自如有王涇者以技進侈言勇往居之不怍間奉圭七先意持論自詭無傷孝宗素危之屢詰責要以禍福弗之顧淳熙丁未聖夀踰八齡矣一日進餛飩覺胸膈咳壅涇猶主前藥既投而不支遂以大漸孝宗震怒立詔誅之慈福要上苦諌薄不獲巳減死黥流杖脊朝天門中使涖焉方覬其速斃涇貨五伯下其手卒得活𥘉巨醫王繼先幸紹興始用是取驗孝宗在朱邸扈蹕視師至建康館秦檜故第史文惠為講官實從行燕之正堂而命莊文醴曽龍于後圃孝宗樂飲以碼瑙觥釂者十二因遊于圃二臣復各獻一巵後三日屬疾髙皇賜藥使內侍視之服文惠聞之疑其為蠲毒亟袖人參圓入問而信遂竊易之僅愈是日微文惠幾殆髙皇蓋主此而不知南北之異稟也涇祖繼先之緒餘株守不變是以敗云憲聖護醫憲聖后在慈福慶元丁巳朝廷方卜郊而后不豫始猶自強起曰上始郊不可以吾故溷齋思敕左右勿奏十一月乙巳還御端門肆眚竣事趣駕至宫而大漸矣先是旬日忽寢疾侍醫進藥輒郤之咸請其故喟然曰吾夀八帙而以醫纍人耶意懲王涇之得罪也故廟諡之議曰郤藥輟進務全護醫蓋紀實云京魏公鏜時當軸嘗親為客言慈聖所謂只此日去免煩他百官其逹死生之變真若出一揆也魯公拜後慶元間有宿儒以文名入鼇掖為承旨朝議謂且大用會韓平原有歸子曰葎先鈐吳門兵時出妾方娠鬻當湖巨室魯氏得男焉葎也既貴無他子遂以重幣請于魯而歸之始至而平原適有恩制當降麻偶不詳知遂於廷綸中用魯公拜後事意蓋指忠獻耳有欲進者忌之摘其語謂含譏刺平原讀之見其姓之偶符大怒不踰月遂去國終其身不復用當其下筆時𥘉不自覺轉喉之觸謂禍福不可以智力勝當於此乎占之金陵無名詩批或傳是劉貢父題其行李中枕屏熙寧七年四月王荆公罷相鎮金陵是秋江左大蝗有無名子題詩賞心亭曰青苗免役兩妨農天下嗷嗷怨相公惟有蝗蟲感恩德又隨鈞斾過江東荆公一日餞客至亭上覽之不恱命左右物色競莫知其為何人也萬歲山瑞禽艮嶽𥘉建諸巨璫爭出新意事土木既宏麗矣獨念四方所貢珍禽之在圃者不能盡馴有市人薜翁素以豢擾為優場戲請于童貫願役其間許之乃日集輿衛鳴蹕張黃屋以遊至則以巨柈貯肉炙粱米翁效禽鳴以致其類既乃飽飫翔泳聽其去來月餘而囿者四集不假鳴而致益狎玩立鞭扇間不復畏遂自命局曰來儀所招四方籠畜者置官司以揔之一日徽祖幸是山聞清道聲望而羣翔者數萬焉翁輒先以牙牌奏道左曰萬歲山瑞禽迎駕上顧罔測大喜命以官賚豫加厚靖康圍城之際有詔許捕馴籞者皆不去民徒手得之以充飱云王涇庸醫宇文忠惠紹節在樞府余間見焉因及五行之理相與縱談有客在坐偶曰黥醫王涇者昨鞭背都市流逺方及平原用事始得歸稍敘故秩自言元不曽受杖嘗袒而示某以背完瑩無疵𥘉不解其如何也後見他醫言杖皆有瘢惟噬膚之𥘉傅以金箔則瘢立消意金木之性相制耳忠惠笑曰昔人有以胝足之藥售于市者輒揭扁于門曰供御或笑其不根聞于上召而罪之既而宥其愚及出乃復增四字曰曽經宣喚今此方無乃其比耶子將誰售客亦笑不敢應時忠惠未識涇也其二年余在里下聞忠惠不起為位以哭及都人來乃云涇實用蠲毒㵼足疾以致大故朝廷知之再命追涇所復官免杖流永興余因憶在京華時傅著作行簡姚胄丞師皋皆甘涇餌目擊其殞著作未啓手足猶進一刀圭不脫口而逝余一日隨班景靈見胄丞殿門下云痰癖新愈因相勞苦則曰王御醫實生我癖去矣痰下者數斗今顧疲􅒒他則無恙余聞而私憂之謂未必能勝未旬果卒嗟夫醫之害如此哉追思疇昔之言為之流涕并志顚末以悼其庸黑虎王醫師余稚年入閩過福聞有黑虎王醫師者冨甲一郡問之則繼先之别名也繼先丗業醫其大父居京師以黑虎丹自名因號黑虎王家及繼先幸於髙宗積官留後通國稱為醫師雖貶猶得麗於稱謂焉𥘉秦檜擅權而未張頗賂上左右以固寵繼先實表裏之當其盛時勢熖與檜挈大張去為而下不論也諸大帥率相與父事王勝在偏校因韓蘄王以求見首願為養子遂帥金陵軍聞者爭效不以為怪檜欲貴其姻族不自言每請進繼先之黨與官繼先亦乘間為檜請諸子至列延閣金紫盈門掩顧賕謝攘市便腴抑民子女為妾侍罪不可勝紀而依慿城社中外不敢議者三十年紹興辛巳六月蜀人杜莘老為南牀擬擊之而未發會邊釁啓繼先首輦重寶為南遁計都城為之騷然上聞之不樂劉武忠錡帥京口請以先發制人之䇿決用兵上意猶隱忍不決亶欲以兵應繼先素怯猶幸和議之堅以竊安因間言于上曰邊鄙本無事蓋新進用主兵官好作弗靖欲邀功耳各斬一二人和可復固上不答徐謂侍貂曰是欲我斬劉錡耶於是素軋其下而不得逞者頗浸潤及之矣逆亮索我大臣廷遣徐嚞張掄往聘亮以非指使諌議大夫韓汝嘉至盱眙止之更令遣所索奏至上適在劉婕妤閣當饋輟食婕妤怪之問諸侍貂而得其繇進説寬譬頗與繼先之言符上大驚問曰汝安得此婕妤不能隱具以所聞對遂益怒丁未詔婕妤歸别第莘老遂上疏列其十罪𥘉進讀玉色猶怫然莘老扣榻曰臣以執法事陛下不能去一醫死不敢退猶未許因密言外議謂繼先以左道幸恐謗議叢起臣且不忍聽上始變色首肯罷朝使宣旨曰朕以顯仁餌汝藥故假爾寵今言者如此當不復有靣目見朕期三日有施行其自圖之辛亥遂詔繼先居于福子孫勒停都城田宅皆沒官奴婢之強鬻者從便令下中外大恱繼先以先事聞詔多藏逺徙故雖籍不害其冨也迄今其故居華棟連甍猶號巨室一傳而子弟蕩柝至不能家或者謂其致不以道冝於厚亡趙牲之作中興遺史載繼先始末極詳參以所聞而著其事桯史卷第九
