front:
  text: 桯史卷第十一八則
  hash: sha256:f1cd6829475a908b4f7ed5727647c72480c4c29c61c8b185ac665ed7a826e09b
  markers:
  - {type: page-break, offset: 0, content: '', id: KR3l0072_SBCK_011-1a}
body:
  text: 相臺嶽珂李白竹枝詞紹聖二年四月甲申山谷以史事謫黔南道間作竹枝詞二篇題歌羅驛曰撑崖拄谷蝮蛇愁入箐攀天猿掉頭鬼門關外莫言逺五十三驛是皇州浮雲一百八盤縈落日四十九渡明鬼門關外莫言逺四海一家皆弟兄又自書其後曰古樂府有巴東三峽巫峽長猿鳴三聲淚霑裳但以抑怨之音和為數疊惜其聲今不傳余自荆州上峽入黔中備嘗山川險阻因作二疊傳與巴娘令以竹枝歌之前一疊可和云鬼門關外莫言逺五十三驛是皇州後一疊可和云鬼門關外莫言逺四海一家皆弟兄或各用四句入陽關小秦王亦可歌也是夜宿于驛夢李白相見於山間曰豫往謫夜郎於此聞杜䳌作竹枝詞三疊丗傳之不子細憶集中無有三誦而使之傳焉其辭曰一聲望帝花片飛萬里明妃雪打圍馬上胡兒那解聽琵琶應道不如歸竹竿坡靣蛇倒退摩圍山腰胡孫愁杜䳌無血可續淚何日金雞赦九州命輕人鮓甕頭船日瘦鬼門關外天北人墮淚南人笑青壁無梯聞杜䳌今豫章集所刋蓋自謂夢中語也音響節奏似矣而不能掩其真亦寓言之流歟蟻蝶圖黨禍既起山谷居黔有以屏圖遺之者繪雙蝶翾舞骨於蛛絲而隊蟻憧憧其間題六言於上曰胡蝶雙飛得意偶然畢命網羅群蟻爭收墜翼䇿勛歸去南柯崇寧間又遷于宜圖偶為人攜入京鬻于相國寺肆蔡客得之以示元長元長大怒將指為怨望重其貶㑹以訃奏僅免其在黔嘗摘香山句為十詩卒章曰病人多夢醫囚人多夢赦如何春來夢合眼在鄉社一時網羅之味蓋可想見然余觀其前篇又有冥懷齊逺近委順隨南北歸去誠可憐天涯住亦得之句浩然之氣又有百折而不衰者存蟻計左矣周益公降官周益公相兩朝慶元間以退傳居于吉隱然有東山之望當路忌之時善類引去者紛紛一皆指為僞學婺有吕祖泰者東萊之别派也勇義敢言憤時事之日非奮然投匭上書力詆用事者且乞以益公為相皂囊下三省朝論雜然起或以為益公實頥指之遂露章奏劾且謂淳熙之季王魯公為首台益公嘗擠而奪之位以身為僞學摽凖羽翼其徒使邪說橫流以害天下屏居田野不自循省而誘致狂生扣閽自薦以覬召用乞加貶削上不以為然言者益急乃鐫一官為少保下祖泰于天府杖而竄之益公上表謝余時在里中傳得之今尚憶其全文曰告老七年宿愆故在貶官一等洪造難名敢期垂盡之年猶麗怙終之罪中謝伏念臣踈庸一介際遇四朝逮事髙皇已遍塵於臺省受知孝廟復久玷於機衡不思勉效於同寅乃敢與聞於異論既肺肝衆所共見豈口舌獨能自明惟光宗興念於元僚亦屢分於閫寄肆陛下曲憐其末路爰俾遂於里居首將正於狐丘巢忽危於燕幕狂生妄發姓名輒及於樵蘇公議大喧論罰盍輸於薪粲僅削司徒之秩猶存平土之官兹蓋恭遇皇帝陛下崇德尚寬馭民敬故國皆曰殺雖微可恕之情耄不加刑姑用惟輕之典遂令衰朽亦與生全臣有愧積中無階報上省愆田里視桑䕃之幾何托命乾坤比櫟材而知免𥘉當路入浸潤欲文致以罪而難其重名意或有辨論乃置於貶及奏至引咎紆徐言正文婉灑然消釋既而東朝奉寶冊詔復其秩時北門者當制廷綸有曰駭匹夫狂悖之上聞乃片言詿誤之併及既有疑於三至姑薄禠於一階朕方建皇極而融㑹於黨偏尊重闈而濡浹於慶施申念三朝之遺老僅同下國之靈光寧屈彛章以全晚節屬外親之詣闕在更生𥘉豈預知貶宫保以居間矧彥博巳嘗得謝猶不謂非罪也嘉定更化詔湔祖泰過名授以文資而晦庵朱文公而下皆褒贈賜諡於是其言始伸方祖泰之得罪有宗姓者尹京据案作色涖制梃焉祖泰大呼庭下曰公為天族同國休戚某乃為何人家計安危而獲斯辱也尹亦慙趣訖其罪使去行都人至今能誦其詳猶有為咤惜者畨禺海獠畨禺有海獠雜居其最豪者蒲姓號白畨人本占城之貴人也既浮海而遇風濤憚於復反乃請于其主願留中國以通往來之貨主許焉舶事實賴給其家歲益久定居城中屋室稍侈靡踰禁使者方務招徠以阜國計且以其非吾國人不之問故其宏麗竒偉益張而大冨盛甲一時紹熙壬子先君帥廣余年甫十歲嘗游焉今尚識其故處層樓傑觀晃蕩綿亘不能悉舉矣然稍異而可紀者亦不一因録之以示傳竒獠性尚鬼而好潔平居終日相與膜拜祈福有堂焉以祀名如中國之佛而實無像設稱謂聱牙亦莫能曉竟不知何神也堂中有碑髙袤數丈上皆刻異書如篆籕是為像主拜者皆嚮之旦輒㑹食不置匕箸用金銀為巨槽合鮭炙梁米為一灑以薔露散以氷腦坐者皆置右手于褥下不用曰此為觸手惟以溷而巳羣以左手攫取飽而滌之復入于堂以謝居無溲匽有樓髙百餘尺下瞰通流謁者登之以中金為版施機蔽其下奏厠鏗然有聲樓上雕鏤金碧莫可名狀有池亭池方廣凡數丈亦以中金通甃制為甲葉而鱗次全類今州郡公宴燎箱之為而大之凡用鉟鋌數萬中堂有四柱皆沉水香髙貫于棟曲房便榭不論也嘗有數柱欲羾于朝舶司以其非常有恐後莫致不之許亦卧廡下後有窣堵波髙入雲表式度不比它塔環以甓為大址絫而增之外圜而加灰飾望之如銀筆下有一門拾級以上由其中而圜轉焉如旋螺外不復見其梯磴每數十級啓一竇歲四五月舶將來群獠入于塔出于竇啁唽號呼以祈南風亦輒有驗絶頂有金雞甚巨以代相輪今亡其一足聞諸廣人始前一政雷朝宗潨時為盜所取跡捕無有㑹市有窶人鬻精金執而訊之良是問其所以致曰獠家素嚴人莫闖其藩豫棲梁上三宿而至塔裹麨糧隱于顚晝伏夜緣以剛鐡為錯斷而懷之重不可多致故止得其一足又問其所以下曰豫之登也挾二雨蓋去其柄既得之伺天大風鼓以為翼乃在平地無傷也盜雖得而其足卒不䏻𥙷以至今他日郡以歲事勞宴之迎導甚設家人帷觀余亦在見其揮金如糞土輿皂無遺珠璣香貝狼籍坐上以示侈帷人曰此其常也後三日以合薦酒饌燒羊以謝大僚曰如例龍麝撲鼻竒味不知名皆可食逈無同槽故態羊亦珍皮色如黃金酒醇而甘幾與崖蜜無辨獨好作河魚疾以腦多而性寒故也余後北歸見藤守王君興翁諸郎言其冨巳不如曩日池匽皆廢云泉亦有舶獠曰尸羅圍資乙於蒲近家亦蕩析意積賄聚散自有時也王荆公王荆公相熙寧神祖虛心以聽荆公自以為遭遇不世出之主展盡底藴欲成致君之業顧謂君不堯舜世不三代不止也然非常之元諸老力爭紛紜之議殆偏天下久之不䏻堪又幸其事之集始盡廢老成務汲引新進大更弊法而時事斬然一新至于元豐上巳漸悔罷政居鍾山不復再召者十年其後元祐羣賢迭起不推原遺弓之本意急於民瘼無復周防激成黨錮之禍可為太息余嘗侍樓宣獻及此宣獻誦荆公是時嘗因天雪有絶句曰勢合便疑埋地盡功成直欲放春回農夫不解豐年意秪欲青天萬里開其志蓋有在余應曰不然舊聞京師隆冬嘗有官檢凍死秀才腰間繫片𥿄啓視之乃喜雪詩四十韻使來年果豐巳無救溝中之瘠矣况小人合勢如章曽蔡吕輩未知竟許放春否宣獻聽然是其說及今觀之發冢之議同文之獄以若人而居位豈不如所臆度荆公𥘉心於是孤矣尊堯集表日録一書本熙寧間荆公奏對之辭私所録記紹聖以後稍尊其說以竄定元祐史諜蔡元度卞又其壻方烜赫用事書始益章建中靖國𥘉曽文肅布主紹述垂意實録大以据依陳了翁瓘為右司貟外郎以書抵文肅謂薄神考而厚安石尊私史而壓宗廟不可文肅大怒罷為外郡尋責合浦了翁始著合浦尊堯集為十論亶辨其所紀載猶未敢以荆公為非及北歸又著四明尊堯集為八門曰聖訓曰論道曰獻替曰理財曰邊機曰論兵曰處已曰寓言始條分而件析之無婉辭矣政和元年徽祖聞有此章下政典局宣取時了翁坐其子正彚獄徙通川郡移文索之了翁遂以表進乞於御前開拆𥘉崇寧既建辟雍詔以荆公封舒王配享宣聖廟肇創坐像了翁憤之併於奏牘寓意其略曰代言之筆盡目其徒為儒宗首善之宫肇塑其形為坐像禮官舞禮而行諂吏書獻佞而請觀光乎仲尼乃王雱聖父之贊比諸孔子實卞等輕君之情彼衰周之僻王弃真儒之將聖當時不得配太廟之饗後世所以廣上丁之祠今比安石為欽王之臣則方神考為何代之主又况一人幸學列辟班隨至尊拜伏於爐前故臣驕倨而坐視百官氣鬱多士心寒自有華夏以來無此悖倒之禮神考之再相安石始終不過乎九年安石之屏迹金陵弃置不名者十載八字威加於鄧綰萬機獨運於元豐豈可於善述之時忽崇此不遜之像又曰又况臨川之所學不以春秋為可行謂天子有北面之儀謂君臣有迭賔之禮禮儀如彼名分若何此乃衰世侮君之非豈是先王訪道之法贑川舊學記刋于四紀之前辟水新雍像成於一壻之手唱如聲召應若響隨其自叙則曰愚公老矣益堅平險之心精衛眇然未捨填波之願殁而後已志不可渝望雖隔於戴盆夢不忘於馳闕丹誠上格天語遙詢要觀尊主之恭緩議奸時之罪淵冰在念梟磔寧逃書奏有㫖陳瓘自撰尊堯集語言無緒並係詆誣不行毀弃送與張啇英意要行用特勒停送台州羈管令本州當職官常切覺察不得放出州城月具存在申尚書省於是廟堂意叵測識者為了翁危之了翁不顧至天台剡謝之辭猶曰知詆誣之不可志在尊堯豈行用之敢私心惟助舜語言無緒議論至迂獨歸美於先猷遂大違於國是不行毀棄有誤咨詢虛消十載之光隂靡恤一門之溝壑果煩揆路特建刑章若非䝉庇於九重安得延齡於再造其凛凛不屈蓋如此余後因讀夷堅支乙見其記優人嘗因對御戲設孔子正坐顔孟與安石侍側孔子命之坐安石揖孟子居上孟辭曰天下逹尊爵居其一軻僅䝉公爵相公貴為真王何必謙光如此遂揖顔子顔曰回也陋巷匹夫平生無分毫事業公為名世真儒位貌有間辭之過矣安石遂處其上夫子不䏻安席亦避位安石皇懼拱手云不敢往復未决子路在外憤憤不能堪徑趨從祀堂挽公治長臂而出公治為窘迫之狀謝曰長何罪乃責數之曰汝全不救護丈人看取别人家女壻其意以譏卞也時方議欲升安石於孟子之右為此而止是知當時公議雖小夫下俚猶不愜不特了翁也其後朝論亦頗疑於禮文遇車駕幸學輒以屏障其面是時荆公位實居孟子上與顔子為對未嘗為止夷堅誤矣國𥘉舊制兖鄒二公東西嚮今郡縣學二公所以並列于左者蓋靖康撤荆公像之時徒撤而不復正耳其位尚可考也然徽祖聖孝根心每以𥙿陵篤眷之故不忍以荆公為非翠華北狩居五國城一日燕坐聞外有貨日録者亟輟衣易之曹功顯勛親紀其事羮牆之念本無一日忘了翁之辨雖明其迄不見省者亦政宣大臣無以正救為將順者歟三忠堂記廬陵號多士儒先名臣今古輩出里人圖所以尊顯風厲以垂無窮者嘉泰四年八月始為堂縣庠以祀三忠時周益公在里居春秋七十有九矣是歲多不懌稍謝碑版之請不肯為一日韋布𣢾其門者百數閽辭焉弗可乃強為通益公方卧奮然起曰是當作即為屬藁文不加點而成邑人愜望四方聞其復秉筆求者沓至益公實病矣其冬十月朔遂薨蓋絶筆焉後四年余得録本於李次夔大章其文曰文章天下之公器萬世不可得而私也節義天下之大間萬世不可得而踰也吉為江西上郡自皇朝逮今二百餘年兼是二者得三公焉曰歐陽公修以六經粹然之文崇雅黜浮儒術復明遂以忠言直道輔佐三朝士大夫翕然尊之天子從而諡曰文忠莫不以為然南渡搶攘右相杜充擁衆臣虜金陵守陳邦光就降惟通判楊邦乂㦸手罵賊視死如歸國勢凛凛士大夫復翕然尊之天子從而褒贈之賜諡曰忠襄則又莫不以為然時宰議禮衆論訩訩惟一編修官胡銓毅然上書乞斬相參虜使三綱五常賴以不墜士大夫復翕然尊之厥後天子從而褒贈賜以忠簡之諡則又莫不以為然是之謂三忠雖然此邦非無宰相如劉沆沖之在朝嘗力薦文忠留置翰苑又引冨文忠公弼共政今姓名著在勳臣之令而諡則未聞子瑾孫僴俱為待制迄不䏻請矧𬒳遇之從臣乎夫然後知節以一惠天子猶不敢專亦必士大夫翕然尊之乃可得耳廬陵宰趙汝厦即縣庠立三忠祠歲時率諸生祀焉巍巍堂堂衮服有章揭日月而行學者固仰其煒煌若夫百世之下聞清風而興起得無幕休烈揚顯光者耶汝厦用意逺矣其後樓宣獻銘益公墓稱其精確簡嚴士謂紀實益公諡文忠余謂它日有尚賢者在位隮配其間尚可謂四忠也臨江四謝臨江謝氏世以儒鳴元豐八年有名懋者及其弟𡵨其子舉廉世充同登進士第連標之盛侈於一時時人謂之臨江四謝舉廉字民師東坡嘗以書與之論文今載集中艮齊諤紹熙間位中執法以厚德著蓋其族孫也桯史卷第十一
