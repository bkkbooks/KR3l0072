body:
  text: 桯史卷第十三六則相臺嶽珂范碑詩跋趙履常崇憲所刋四說堂山谷范滂傳余前記之矣後見跋卷乃太府丞余伯山禹績之六世祖若著倅冝州日因山谷謫居是邦慨然為之經理舍館遂遣二子滋滸從之游時黨禁甚嚴士大夫例削札掃迹惟若著敬遇不怠率以夜遣二子奉几杖執諸生禮一日携紙求書山谷問以所欲拱而對曰先生今日舉動無愧東都黨錮諸賢願寫范孟博一傳許之遂默誦大書盡卷僅有二三字疑誤二子相顧愕服山谷顧曰漢書固非能盡記也如此等傳豈可不熟聞者敬嘆若著滿秩持歸上饒家居寶藏之再丗散逸歸東武周氏又歸忠定家伯山僅傳摹本其子子壽鑄為四明制屬攜之笈中之官樓攻愧見之為作詩曰冝人𥘉謂冝於人菜肚老人竟不振承天院記顧何罪一斥致死南海濵賢哉别駕眷遷客不恤罪罟深相親哀哀不容處城闉夜遣二子從夫君一日攜紙丐竒畫引筆行墨生煙雲南方無書可尋問默寫此傳終全文𥙷亡三篋比安丗偶熟此卷非張巡巖巖汝南范孟博清裁千載無比倫坡翁侍毋曽啓問百謫九死氣自伸别駕去官公亦巳身雖既衰筆有神我聞此書久欲見摹本尚爾况其真輟君清俸登堅珉可立懦夫羞佞臣及履常登朝以真蹟呈似攻愧乃復題其後又面命幼子冶録里士俞惠叔疇詩一篇亟稱其隹焉其辭曰貂璫羣雛擅天網手驅名流入鈎黨屯雲蔽日日光無卯金神器春冰上汝南節士居危邦志剗蕭艾扶蘭芳致君生不逮堯舜死合夷齊俱首陽千年興壞真暮旦殷鑒詎應如許逺安知後人哀後人又起諸賢落南歎冝州老子筆有神蟬蛻顔揚端逼真少模龍爪已名丗晚用雞毛亦絶人平生孟博吾尚友時事駸駸建寧舊胸蟠萬卷老蠻鄉獨感斯文聊運肘老子書名橫九州一𥿄千金不當酬此書豈但翰墨設心事悢悢關百憂人言老子味禪恱疾惡視滂寧爾切須知許國本精忠不幸為滂甘伏節九原莫作令人悲遺墨敗素皆吾師從君乞取冝州字要對崇寧黨籍碑二詩明白痛快足以吊此老於九垓之期矣獨惠叔末章頗傷峻厲跋卷又有柴中守一詩曰小春晝日如春晚飲罷披圖清興逺夜光照屋四座驚金薤銀鈎真墨本當年太史謫冝州腸斷梅花棲戍樓拾遺不逢東道主翰林長作夜郎囚蠻烟瘴雨森鈇鉞更值韓盧搜兔窟老色上面歡去心惟有忠肝懸日月郡丞嗜好殊丗人投箋乞字傳兒孫平生孟博是知己筆下寫出精神騫興亡萬古同一轍黨論到頭不堪說刋章下郡漢道微清流入河唐祚絶先朝白晝狐亦鳴正氣消盡邪氣生殿門斷碑仆未起中原戎馬來縱橫生蛟入手不敢玩往事凄凉重三歎蘭亭瘞鶴徒爾為好刻此書禆廟算牛腰軸雖大詩之者惟此三人柴作亦佳特未免唐人所謂昌黎淮西碑猶缺冒頭不得之戲耳伯山前輩老成嘗為九江校官余又及同班行子壽丗科今為鎮江外轄蓋方鄉用者晦庵感興詩朱晦翁既以道學倡天下涵造義理言無虛文少喜作詩晚年居建安乃作齊居感興二十篇以反其習自序其意斷斷乎皆有益於學而非風雲月露之詞也余從吾鄉蔡元思念成誦得之其序曰豫讀陳子昻感遇詩愛其詞旨幽邃音節豪宕非當丗詞人所及如丹砂空青金膏水碧雖近乏丗用而實物外難得自然之竒寶欲效其體作十數篇顧以思致平凡筆力萎弱竟不能就然亦恨其不精於理而自託於仙佛之間以為髙也齊居無事偶書所見得二十篇雖不能探索微眇追迹前言然皆切於日用之實故言亦近而易知既以自警且以貽諸同志云一曰昆侖大無外旁礴下深廣隂陽無停機寒暑互來往皇羲古神聖妙契一俯仰不待窺馬圖人文已宣朗渾然一理貫昭晣非象罔珍重無極翁為我重指掌二曰吾觀隂陽化升降八紘中前瞻既無始後際那有終至理諒斯存萬丗與今同誰言混沌死幻語驚盲聾三曰人心妙不測出入乘氣機凝冰亦焦火淵淪復天飛至人秉元化動靜體無違珠藏澤自媚玉韞山含暉神光燭九垓玄思徹萬微塵編今寥落歎息將安歸四曰靜觀靈臺妙萬化此從出云胡自蕪穢反受衆形役厚味紛㭆頥妍姿坐傾國崩奔不自悟馳騖靡終畢君看穆天子萬里窮轍迹不有祈招詩徐方御辰極五曰涇舟膠楚澤周綱巳陵夷况復王風降故宫黍離離玄聖作春秋哀傷實在兹祥麟一以踣反𬒮空漣洏溧淪又百年僣侯荷爵圭王章久以喪何復嗟歎為馬公述孔業託始有餘悲拳拳信忠厚無乃迷先幾六曰東京失其御刑臣弄天綱西園植姦穢五族沈忠良青青千里草乘時起陸梁當塗轉凶悖炎精遂無光桓桓左將軍仗鉞西南疆伏龍一奮躍鳯雛亦飛翔祀漢配彼天出師驚四方天意竟莫回王圖不偏昌晉史自帝魏後賢合更張丗無魯連子千載徒悲傷七曰晉陽啓唐祚王明紹巢封垂統已如此繼體冝昏風麀聚瀆大倫牝晨司禍凶乾綱一以墜天樞遂崇崇向非狄張徒誰辦取日功云何歐陽子秉筆迷至公唐經亂周紀凡例孰此容侃侃范太史受說伊川翁春秋二三策萬古開羣蒙八曰朱光遍炎宇微隂眇重淵寒威閉九野陽德昭窮泉文明昧謹獨昏迷有開先幾微諒難忽善端本綿綿掩身事齊戒及此防未然閉關息商旅絶彼柔道牽九曰微月墮西嶺爛然衆星光明河斜未落斗柄低復昻感此南北極樞軸遙相當太一有常居仰瞻獨煌煌中天照四國三辰環侍旁人心要如此寂感無邊方十曰放勛始欽明南面亦恭巳大哉精一傳萬丗立人紀猗歟歎日躋穆穆歌敬止戒􅋙光武烈待旦起周禮恭惟千載心秋月照寒水魯叟何常師刪述存聖軌十一曰吾聞庖羲氏爰𥘉闢乾坤乾行配天德坤布協地文仰觀玄渾周一息萬里奔俯察方儀靜隤然千古存悟彼立象意契此入德門勤行當不息敬守思彌敦十二曰大易圖象隱詩書簡編訛禮樂矧交喪春秋魚魯多瑤琴空寶匣絃絶將如何興言理餘韻龍門有遺歌十三曰顔生躬四勿曽子日三省中庸首謹獨衣錦思尚絅偉哉鄒孟氏雄辨極馳騁操存一言要為爾挈裘領丹青著明法今古垂煥炳何事千載餘無人踐斯境十四曰元亨播羣品利貞固靈根非誠諒無有五性實斯存丗人逞私見鑿智道彌昏豈若林居子幽探萬化原十五曰飄颻學仙侣遺丗在雲山盜啓元命祕竊當生死關金鼎蟠龍虎三年養神丹刀圭一入口白日生羽翰我欲往從之脫屣諒非難但恐逆天道偷生詎能安十六曰西方論緣業卑卑喻羣愚流傳丗代久梯接凌空虛顧眄指心性名言起有無捷徑一以開靡然丗爭趨號空不踐實躓彼榛棘途誰哉繼三聖為我焚其書十七曰聖人司教化橫序育羣材因心有明訓善端得深培天叙既昭陳人文亦褰開云何百代下學絶教養乖羣居競葩藻爭先冠倫魁淳風反淪喪擾擾胡為哉十八曰童蒙貴養正孫弟乃其方雞鳴咸盥櫛問訊謹暄凉奉水勤播灑擁篲周室堂進趨極䖍恭退息常端莊劬書劇耆炙見惡逾探湯庸言戒粗誕時行必安詳聖塗雖云逺發軔且勿忙十五志于學及時起髙翔十九曰哀哉牛山木斤斧日相尋豈無萌蘖在牛羊復來侵恭惟皇上帝降此仁義心物欲互攻奪孤根孰能任反躬艮其背肅容正冠襟保養方自此何年秀穹林二十曰玄天幽且默仲尼欲無言動植各生遂德容自清溫彼哉夸毗子呫囁徒啾喧但逞言辭好豈知神監昏曰豫昧前訓坐此枝葉繁發憤永刋落竒功收一原馳騁今古剟華反實斯可謂志之所存者其中二篇論二氏之學猶若有輕重有無之辨晚學恨不得撰杖屨以質疑焉武夷先生建中靖國𥘉有宿儒曰徐常持節河朔風采隱然重于時然持論與時大異曽文肅布惡之嘗具詆先烈人姓名陳之乙覽常列其間然未有以罪也㑹市肆有刋武夷先生集者乃常所為文文肅之子紆適相國寺偶售得之首篇乃熙寧間上王荆公書詆常平法者紆以置几案間不為意文肅偶入黌舍見之䄂以入明日遂奏榻前且謂常元未嘗上此書特沽流俗之名耳言者從之遂免所居官竟以蹭蹬徐嘗有教子詩曰詞賦切冝師二宋文章須是學三蘇其措意如此冝其與文肅異也任元受啓批任有小醜集行於丗後又有淵聖升遐疏文二道秦檜秉權寖久植黨締交牢不可破髙皇淵默雷聲首更大化懲言路壅蔽之弊召湯元樞鵬舉于外執法殿中繼遷侍御史時有選人任盡言者居下僚好慷慨論事聞其除亟以啓賀之曰伏審光奉明綸榮躋橫榻國朝更西都三府之制故御史不除大夫端公居南司五院之中與獨坐迭為憲長自昔雖稱於雄劇比歲或乖於選掄汚我霜臺賴公雪耻輒陳管見少助風聞靖言有宋之姦臣無若亡秦之巨蠹十九載輔國而專政亘古無之二百年列聖之貽謀掃地盡矣乃若糊名而較藝亦復肆志而任私敢以五尺之童連冠兩科之士老牛舐犢愛子誰無野鳥為鸞欺君實甚公攘名器報微時簞食之恩峻立刑誅鉗當世搢紳之口一時謫籍半坐流言父子至於相持道路無復偶語每除言路必預經筵蓋緣乳臭之雛實預金華之講受其頥㫖應若影從忠臣不用而用臣不忠實事不聞而聞事不實逮政府樞庭之有闕必諌官御史而後除所以復鷹犬之報而搏吠已憎踈鴛鷺之班而孤危主勢私竊冨貴之勢利豈止於子孫而為臣仰奪造化之爐錘至不容人主之除吏方當寧之意未罪魏其而在位之臣專何王氏致學官之獻佞假題目以文姦引前代興王之詩為其孫就試之䜟旋從外幕擢置中都冀招致於妖言啓包藏之異意忠憤扼腕智識寒心上愧漢臣既乏朱雲之請劒下慙唐室未聞林甫之斫棺坐令存沒之姦備極寵榮之典正緣和議常贊睿謀故聖主念功務曲全於體貌然憲臺議罪當明正於典刑賞當功所以示朝廷之至恩罰當罪所以貽臣子之大戒政若偏廢國將若何敢為上言莫如君重恭惟侍御氣剛而志烈學老而才雄自親擢於中宸即大符於民望明目張膽士林日誦於讜言造膝沃言天下咸受其隂賜雖直道盡更其覆轍而宏綱獨漏於吞舟惟九重之委任寖隆故四海之責望尤備願言彈擊無置渠魁矧今日之新除有昔人之故事韋仁絇自稱鵰鶚才固絶倫張文紀不問狐狸惡惟誅首縱黃壤之已隔在白簡以難逃使六合之間忠義之心如日九泉之下邪佞之骨常寒庶幾紹興湯御史之名不在慶曆唐子方之下其他丗俗之諂語諒非方正之樂聞側聽褒遷别當修致湯得之喜䄂以白上天顔為回故一時公議大明姦諛膽落盡言其助也任字元受有集名小醜楊誠齊為之序仕亦不大顯余先君手抄其啓雜爼中冰清古琴嘉定庚午余在中都燕李奉寧坐上客有葉知幾者官天府與焉葉以博古知音自名前旬日有士人攜一古琴至李氏鬻之其名曰冰清斷紋鱗㕙制作竒崛識與不識皆謂數百年物腹有銘稱晉陵子題銘曰卓哉斯器樂惟至正音清韻髙月苦風徑璅餘神爽泛絶機靜雪夜𫾣冰霜天擊磬隂陽潜感否臧前鏡人其審之豈獨知政又書大曆三年三月三日上底蜀郡雷氏斫鳯沼內書正元十一年七月八日再修士雄記李以質於葉葉一見色動掀髯歎咤以為至寶客又有憶誦澠水燕談中有是名者取而閲之銘文歲月皆吻合良是葉益自信不誣起附耳謂主人曰某行天下未之前覿雖厚直不可失也李敬受教一償百萬錢鬻者撑拒不肯曰吾祖父丗寶此將貢之上方大璫某人固許我矣直未及半渠可售李顧信葉語絶欲得之門下客為平章莫能定余覺葉意知其有贋旁坐不平漫起周視讀沼中字皆歷歷可數因得其所疑乃以袖覆琴而問葉曰琴之媺惡余姑謂弗知敢問正元何代也葉笑未應坐人曰是固唐德宗何以問為余曰誠然琴何以為唐物衆譁起致請乃指沼字示之曰元字上一字在本朝為昭陵諱沼中書正從卜從具是矣而貝字闕其旁點為字不成蓋今文書令也唐何自知之正元前天聖二百年雷氏乃預知避諱必無此理是蓋為贋者徒取燕談以實其說不知闕文之熟於用而忘益之且沼深不可措筆修琴時必剖而兩因題其上字固可識又何疑焉衆猶爭取視見它字皆煥明實無旁點乃大駭李更衣自內出或以白之抵掌笑葉慚曰是猶佳琴特非唐物而已李不欲逆勉彊薄酬頓損直十之九得焉鬻琴者雖怒而無以辭也它日遇諸塗頩而過之今都人多售贋物人或贊媺隨輒取贏焉或徒取龍斷者之稱譽以為近厚此與攫晝何異蓋真敝風也選人戲語蜀伶多能文俳語率雜以經史凡制帥幕府之宴集多用之嘉定𥘉吳畏齊帥成都從行者多選人類以京削繫念伶知其然一日為古冠服數人游于庭自稱孔門弟子交質以姓氏或曰常或曰於或曰吾問其所涖官則合而應曰皆選人也固請析之居首者率然對曰子乃不我知論語所謂常從事於斯矣即某其人也官為從事而繫以姓固理之然問其次曰亦出論語於從政乎何有蓋即某官氏之稱又問其次曰某又論語十七篇所謂吾將仕者遂相與歎咤以選調為淹抑有慫慂其旁曰子之名不見於七十子固聖門下第盍扣十哲而受教焉如其言見顔閔方在堂羣而請益子騫蹙頞曰如之何何必改兖公應之曰然回也不改衆撫然不怡曰無巳質諸夫子如之夫子不答久而曰鑽遂改火急可巳矣坐客皆愧而笑聞者至今啓顔優流侮聖言直可誅絶特記一時之戲語如此桯史卷第十三
