front:
  text: 桯史卷第十四五則
  hash: sha256:62546342a868acde18f8ba4b9c1d8e5e6c15e6ec4ae21f2c4e588970074f6aee
  markers:
  - {type: page-break, offset: 0, content: '', id: KR3l0072_SBCK_014-1a}
body:
  text: 相臺嶽珂陳了翁始末陳了翁在徽祖朝名重一時為右司貟外郎曽文肅敬之欲引以附已屢薦于上使人諭意以將大用之了翁謂其子正彚曰吾與丞相議多不合今乃欲以官相餌吾有一書將遺之汝為我書且曰郊恩不逺恐失汝官奈何正彚再拜願得書了翁喜明日持以見文肅于都堂適與左司朱彥會待于賔次朱借讀其書動色既見文肅果大怒嘻笑謂曰此書它人得之必怒布則不然雖十書不較也了翁退即録所上文肅書及日録辨國用須知以狀申三省曰昨詣尚書省投書蒙中書相公面諭其詳謂瓘所論為元祐淺見單聞之説兼言天下未嘗乏才雖有十書布亦不動瓘不逹大體觸忤大臣除具申御史臺乞賜彈劾外伏乞敷奏早行竄黜遂出知泰州鄒道鄉在西掖救之不從上臨朝謂文肅曰瓘如此報恩地耶又曰卿一向引瓘又欲除左右史朕道不中議論偏今日如何文肅愧謝𥘉議竄徙韓文定為首台陸農師在政地救之曰瓘言誠過當若責之則更以此得名曽布必能容之也謫乃薄余謂前輩名節之重身蹈危機不復小顧申省公牘百載而下讀之凛凛有生氣余丱角時先夫人教誦古今奏議謂足壯它日氣節此書與焉今尚憶其全文曰壦聞之古賢未嘗無過周公孔子顔淵皆有過也子路聞過則喜所以為聖賢之徒成湯改過不吝所以為百丗之師故曰過而能改善莫大焉匹夫改過善在一身大臣改過福及天下閣下德隆功大四海之內所贊頌然謂閣下無過則不可尊私史而壓宗廟緣邊費而壞先政此二者閣下之過也違神考之志壞神考之事在此二者天下所共知而聖主不得聞其説蒙蔽之患孰大於此瓘之所撰日録辨一篇已進之於上閣下試一讀之則所謂尊私史而壓宗廟者可見矣瓘去年所論陜西河東事未盡詳悉近守無為奉行朝廷詔敕乃知天下根本之財皆已運於西邊比緣都司職事看詳內降劄子因述其事名曰國用須知亦已進之於上閣下試讀之則所謂緣邊費而壞先政者可見矣主上修繼述之效閣下乃違志壞事以為繼述自今日已往其效漸見所以誤吾君者不亦大乎效之速者尤在於邊費熙寧條例司之所講元豐右曹之所守舉朝公卿無如閣下最知其本末今閣下獨擅政柄首壞先烈彌縫壅蔽人未敢議它日主上因此兩事以繼述之事問於閣下閣下將何以為對當此之時閣下雖有腹心之助恐亦不得髙枕而卧也且邊事之費外則帥臣內則宰相帥臣知一方之事而巳雖竭府庫之財而傾之不可責也至於宰相之任則異乎此矣豈可以知天下匱竭而恬不恤匱竭困壞先政因務蔽蒙閣下欲辭其過可乎瓘比緣稟事聞閣下之言指尚書省為道揆之地瓘謂閣下此言失矣三省長官宜守法而巳若夫道揆天子三公之事豈太宰之所得預乎兩年日食之變皆在正陽之月此乃臣道大強之應亦閣下之所當畏也宜守而揆豈抑畏之謂乎周官曰居寵思危今天下旱蝗方數千里天變屢作人心憂懼邊費壞敗國用耗竭而閣下方且以為得道揆之體可謂居寵而不思危矣閣下於瓘有薦進之恩瓘不敢負是以論吉凶之理獻先甲之言冀有輔於閣下若閣下不察其心拒而不受則今日之言謂之負恩可也負與不負在瓘察與不察在閣下事君之位無髙下各行其志孰得而奪之乎瓘去年九月三日上封章皆乞奏知東朝所以尊人主而抑外家也欽聖未見察則瓘𬒳貶黜後來慈意開悟則瓘得牽復人主察孤臣之盡忠欽聖知忠言之有輔毋慈子孝主聖臣直此國家兩全之道廟社無疆之福也今欽聖納忠之美未白於天下而諌官不二之心得罪於廟堂脅持之風甚於去歲乖離之論唱自大臣所以厚欽慈者果在此乎瓘前日辭都司之命而閣下未許其去者閣下必有以處瓘矣此士大夫之所共諭也主上念欽聖納忠之意察孤臣不二之心奬眷之恩至深至厚瓘欲擇死所以圖報效無負於人主無愧於外家一身之安危豈睱恤哉然則今日之言安知不見察於閣下也閣下深思而已瓘不敢供要職重取煩言又不忍默默而去惟閣下留聽幸甚前書尊堯集表蓋與此互見始末讋諛立懦不厭屢書也正彚是似益可嘉後竟坐罪流削坎壈不自悔云八陳圖詩瞿唐灔澦天下至嶮每春夏漲潦砂磧巨石如屋者皆一夕隨波去獨諸葛武侯八陳圖巋然歷千古獨存識者謂其有神護紹興中蜀士有喻汝礪者持憲節來治于夔趣召過郡與夔帥宴江上謂是圖源委風后表而詩之自為序曰夔帥任子野以人日置酒江瀕觀武侯八陳圖諸公皆云八陳自武侯始捫膝先生獨謂不然乃作古風示之庶幾諸公知八陳之所由起其詩曰魚復江邊春事起萬點紅旗揚清泚主人元是劉夢得載酒娛賔水光裏酒闌放腳步沙磧細石作行相靡迤卧龍起佐赤龍子天地風雲入鞭箠蛇盤虎翼飛鳥翔四正四竒公所壘當時二十四萬師開門闔門隨臂指幾回嚇殺生仲逹往往宵遁常騎豕海中仙人丈二履相與往來迃玉趾笑云此公大肚皮龍拏虎擲堆胸胃江頭風波幾劘蕩斷岸奔峯俱披靡陽侯鏖戰三峽怒秪此細石吹不起晉大司馬宣武公常山之蛇中首尾幕中矹矹何物客未有一客能解此千年獨有老竒癲見之斂𬒮三嘆喟頗知此法自元女細與諸公剖根柢君不見風后英謀儘竒詭龕定蚩尤等蜉蟻漢大將軍親閲試四夷聞風皆禠氣馬隆三千相角掎西羌茸茸落牙觜而公於此出新意蓋丗功名無第二不知何處著雙手建立乃與天地比河圖洛書亦如此堂堂孔明今未死我門生人如死人老了不作一件事却𬒳獼猴坐御床孰視天王出居汜既不能跖穿膝暴秦玉庭放聲七日哭不已又不能斷脰決腹死社稷滿地淋漓流腦髓羡它安晉溫太真壯它霸越會稽蠡八年嫪戀飽妻子灑涕東風肉生髀斑斑猶在杲卿髮離離未落張巡齒愛惜微軀欲安用有臣如此難準擬雖然愛國心尚在左角右角頗諳委二廣二矩及二甄春秋所書晉所紀况乃東廂與洞當復有青龍洎旬始淫淫陳法有如許智者舍是愚者蔽此圖昔人之芻狗參以古法行以巳偏為前距狄笑之制勝於兹亮其豈爾朱十萬破百萬第顧方略何如耳嗟我去國歲月老渺渺赤心馳玉扆可憐阿伾財女子而我未刷邦家耻屬者買舟瀘川縣扣船欲泛吳江水赤甲山前春雪深白帝城下扁舟艤胡為於此久留滯細雨打篷愁不睡剽聞逆雛犯淮泗陛下自將誅陳豨六師如龍賊如鼠殺回屋瓦皆蜚墜距黍直射六百步虜尸蔽江一千里哀哉獼猴太癡絶垂死尚持虞帝匕那知光武定中興要把中原痛􅐡洗君不見陛下神武如太宗萬全制陳將平戎倚聞獻馘平江宫坐使四海開春容六騑還自江之東光復舊京如轉蓬蜀花千枝萬枝紅輒莫取次隨東風竒癲眼腦醉冬烘東向舞蹈壽乃翁醉醒聊作竹枝曲乞與欵乃歌巴童喻三嵎人靖康𥘉為祠部外郎偽楚之僣集議祕省簮辨恇懾喻獨捫其膝曰此豈易屈者哉即日挂冠去於是以捫膝自號有集十四卷它詩文嶮怪挺絶皆稱是劉後溪光祖實序之焉開禧北征開禧丙寅五月王師北伐有詔發鎮江總司緡錢七十萬犒淮東軍命官宣旨軍前宣臺檄余往時鏠旗罙入未有所底傳聞叵測人皆憚行文移峻甚余不敢辭遂浮漕河而北次楚道北神登海舟以入于淮天方暑夜碇中流海光接天星斗四垂回首白雲之思惻然悽動至漣水城已焚蕩六軍皆露宿獨餘軍學宣聖一殿巋然瓦礫中余謁宣參錢溫父廷玉方病卧一板門上在十哲之傍視像設皆左祍相顧浩歎遂至金城海舟之行雙桅舞風舷幾入水稍轉則反之未嘗正也歸復道洪澤龜山至盱泗招撫郭倪招宴泗之凝雲樓樓據城而髙城不甓址以石北望中原無龍斷焉樓之下為廳事後有屋三楹榜曰金蘭堂方積笴充棟榜青牌金字乃一士人書不知虜法何以不禁也郡治陋甚僅如江浙一監當衙宇耳虜法簡便大抵如此聞之淮人云此乃承平遺規南渡以後州郡事體始增侈既涉淮迄事歸而王師失利潰兵蔽野下泣聲不忍聞皆傷痍或無半體為之潸然間有依余馬首以南然不可勝救也是役也殿司兵素驕貫於炊玉不能茹糲食部餫者復幸不折閲多雜沙土軍中急於無糧強而受之人旦莫給飯二盂沃以炊湯多棄之道復負重暑行不堪其苦多相泣而就罄道旁逃屋皆是臭不可近地多眢井亦或赴死其間每憩馬一汲輒得文身之皮浮于桶面間以井滿不可汲余暍甚不復能勺徒勺酒烹雞而薦之既還南徐官下以藴熱飲惡下利幾三月乃蘇余嘗以塗中所作詩篇為録曰北征多寓見其間特不詳所歷暇日回思少年氣鋭直前不懾者為之心折因書梗概以起髀肉之悲泗州塔院余至泗親至僧伽塔下中為大殿兩旁皆荆榛瓦礫之區塔院在東廂無塔而有院後以上石甃洞作兩門中為巖穴設五百應真像大小不等或塑或刻皆左其祍余以先妣素敬釋氏奉其一于笈中以歸殿上有十六柱其大皆尺有半八觚色黯淡如暈錦正今和州土碼瑙也和之産紹興間始剖山得之不知中原何時已有此前六條特異皆晶明如纏絲承梁者二髙皆丈有六尺其左者色正紅透時暑日方出隱柱而觀燁然晃明天下竒物也泗人為余言唐時張刺史建殿而髙麗有僧以六柱至航海入淮一龜砆露立云舊有碑載其事今不存莫詰信否塔有影前輩傳記雜書之余至之明日適見于城中民家亟往觀焉信然泗固無塔而影儼然在地殊不可曉或謂影之見為不祥泗尋蕩棄豈其應歟殿柱聞郭倪欲載以還維揚今不知何在二將失律王師始度淮李汝翼以騎帥郭倬以池田俊邁以濠分三軍並趨符離環而圍之虜守實欲迎降忠義敢死已肉薄而登矣我軍反嫉其功自下射之顚陴者曰是一家人猶爾我輩何以脫於戮始復為備符離一尉遊徼于外不得歸城外十里間有叢木尉兵依焉我之餉軍者輦過其下招司不夙計征丁于市人皆無衛部運官吏多道匿無與俱者尉鳴鼓餉者盡棄而奔則出于本間聚而焚之已輒歸三將無覺者但怪糧不時至居數日而士不㸑矣𥘉取泗無攻具夜發盱眙染肆之竿若寺廟之剎為長梯以登泗本土堙又無禦者幸而捷忠義與軍士已爭功而譁及是復不攜寸木往居泗一月而後之宿宿聞有我師以其帥府命先芟積清野待炮械無所取辦敢死又巳前郤乃坐而仰髙搏手莫知所施汝翼之至也舍于城南有方井之地夷坦不宿草軍吏喜其免於崇剃也而營之會夜暑雨大作營乃故積水卑窪處草以浸死元非可頓兵也平明帳中水巳數尺軍飢遂先潰二軍不能攴皆掃營去改塗自蘄縣歸入城少憩而虜人坐其南門覆諸山下矣兵出方半縣門發屋者皆桀石以投人我軍機殱焉大酋僕撒孛董者使謂汝翼曰田俊邁守濠實誘我人而啓釁端執以歸我我全汝師汝翼不敢應池之帥司提轄余永寧者聞之以告倬曰今事已爾何愛一夫而不脫萬衆之命乎倬憮然頷之永寧傳呼召俊邁計事至則驅下馬反接俊邁厲聲呼倬曰俊邁有罪太尉斬之可也奈何執以與虜倬回顧汝翼俱不言第目永寧使速行俊邁脫手自扼其喉卒復􅐁之俊邁有二馭者忘其名實在旁不能救泣而逃虜既得俊邁折箭為誓啓門以出二將猶勦其後騎免者不能半焉輕騎至盱眙幕府自歸余時適至二將舍玻璃泉猶傳呼揚揚自若倬蓋招撫倪之弟也意右之招余言頗自文欲縶以歸于宣臺議既定問余何以處余曰大義滅親正典刑以全門户上䇿也使它日朝廷欲勿行則失刑矣何以馭軍行之則失恩矣何以待招撫倪勃然變乎色不終席而揖余以湯招幕有與余厚者退而咎余言太峻余笑不答遂登舟以歸倬未行客有獻計於倪者曰軍方敗事未宣也縶而歸之其聞愈章遂庇弗遣余歸病中得邸狀汝翼倬俱薄謫湘湖間意泯熄矣居亡何有旨命大理正喬夢符即京口置獄推俊邁事皆莫測所以發既乃聞余永寧者適以事至宣司遇俊邁之馭執之呼冤丘樞訊焉得其情以事已行不欲究第杖永寧脊黥流海島倬之弟僎輕佻人也好大言聞永寧得罪而恕實不知其事之出於倬妄謂不然以訴于平原平原謂之曰乎反易耳第萬或一然國有常憲彼時何以為君地不如姑已僎固稱枉請直之喬遂來復追永寧于道俱下吏左驗明甚九月獄具永寧磔死倬棄市從者皆論極典汝翼以不出語得減死竄瓊州復劾其匿軍帑之罪籍其家資俊邁家賜宅豫官時倪猶帥揚上親灑宸翰慰安之龍舒守章以𥘉升之方待次居京口因至揚倪泣謂之曰嶽監倉在否為我謝之愧不及先知之明也至冬倪亦以怯懦罷遂謫南康嘉定更化與僎俱流嶺南資産隨所在沒入之僎蓋又儀真喪師之將也倬之罪不及汝翼倬嘗為建康副帥在廬輕財勇往遷池不數旬即出兵於艱難中頗得士卒心方潰時不得已俱至蘄猶力戰獨以一諾罹禍汝翼嘗為九江帥刻剝無藝軍士甚貧者日課屨一雙軍中號為李草鞋其遷馬帥也船發琵琶亭塗人咸詬而提擊之既敗猶取馬司五萬緡歸其家焚其籍倬死之後喬再入院鞠贓罪兼旬而竟僅得不死人猶以為幸也明年有自虜逃歸者云見俊邁尚在虜蓋不殺或謂郭氏實倡言以自逭莫可致詰倪倬僎皆棣杲果之諸子浩之孫丗將家寵利盈溢進不知量隤其家聲云桯史卷第十四
