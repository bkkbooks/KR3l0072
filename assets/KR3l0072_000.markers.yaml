  - {type: variant, offset: 953, length: 2, content: 目録, WYG: 為名不甚可解考工記曰輪人為葢達常為圍三寸桯圍倍之注曰桯車杠也説文解字曰桯牀前几也皆與著書之義不合至廣韻訓為碓桯集韻訓與楹同義更相逺疑以𫝊疑闕所不知可矣毛晉刻本末有附錄一卷前為岳飛𫝊及飛遺文併珂詩文各一首已與此書無闗又附明劉瑞孝娥井銘王公詞記各一篇尤足驗非此書所舊有今併删之庶不溷簡牘焉乾隆四十三年六月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀欽定四庫全書桯史卷一十二則宋岳珂撰張紫微原芝}
