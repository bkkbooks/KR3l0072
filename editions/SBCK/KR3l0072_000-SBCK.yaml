  text: 桯史序
  hash: sha256:f361ce87034123ffe5ea0df164642858e8a04daa41d21d509ce3fe563266bf9a
  markers:
  - {type: page-break, offset: 0, content: '', id: KR3l0072_SBCK_000-1a}
body:
  text: 相䑓岳珂著雲間陳文東批點亦齋有桯焉介几間髹表可書余或従搢紳間聞聞見見歸倦理鉛槧􅂺記其上編已則命小史錄􅆇玄月率三五以為常每􅀼自恕以谓公是公非古之人莫之廢也見睫者不若身厯􅂰口者不若目擊史之朝廷設官􅄹三館大㮣皆汗青事詳覈備记裁以三長含毫閣筆猶孫其難而莫之敢議也彼齊東者何為㦲子幸生天不無事时亶竊粟縣官進不淂䇿名蘭䑓以垂信退不得隠几全其忌言之真呫呫法􅂑棟牛累扵世無毫髮益而猶時四顧出啄木畫誠可􅀏抵余無以復則指其桯曰汝􅀅多言日朘如五逹之交午乎汝􅀅嘿嘿養元如老聃之柱下乎人言勿䘏汝姑謂汝􅀅奚擇桯㗳然不應予􅀏曰此真良史也遂以為序嘉㝎焉逢淹茂􅀊圉如既望珂序桯史目録相臺岳珂卷第一十二則張紫微原芝藝祖禁䜟書徐鉉入聘石城堡寨湯􅄮公罷相南陔脫帽張元呉昊王義豐詩琵琶亭術者汴京故城施冝生􅀳盆杅卷第二十四則行都南北内犇麤字􅀃李順呉曦名䜟隆興按鞠東坡屬對冨翁五賊太學􅀕齋碑泉江三地名牧牛亭􅃛􅀑醖夣望江二翁劉改之詩詞金華士人滑稽賢己圖卷第三八則嵗星之祥梓潼神應機心不自覺館娃浯溪天子門生姑􅂫二異人趙希光節槩稼軒論詞卷第四九則壽星通犀帶周夣與釋語鄭廣文武詩九江二盗葉少藴内制宣和御畫乾道受書禮一言悟主蘇􅁑䇿問卷第五十三則劉觀堂讀赦詩部胥増損文書㸔命司宣和服妖安慶張冦陽山舒城宸奎堅忍字何處難忘酒見一堂義騟傳鳯凰弓大小寒趙良嗣隨軍詩卷第六六則汪革謡䜟鐡劵故事鴻慶銘墓􅂫衢人妖快目樓題詩記龍眠海㑹圖卷第七五則呉畏齋謝贄啓楚齊僣冊優伶詼語嘉禾篇朝士留刺卷第八十二則九江郡城日官失職紫宸廊食阜城王氣袁孚論事鸚鵡諭月中人妖牸牧相衛觧禪偈玉虚宻詞太􅀊方位逆亮辭怪卷第九十三則􅁉陵聖瑞狀元􅀟筆堯舜二字正隆南冦鼈渡橋燕山先見蠲毒圎憲聖護醫魯公拜後金陵無名詩萬嵗山瑞禽王涇庸醫黒虎王醫師卷第十八則永泰挽章殿中鷴劉藴古大散論賞書成都貢院萬春伶語山谷范滂傳紫巖二銘卷第十一八則李白竹枝詞蟻蝶圖周益公降官畨禺海獠王荆公尊堯集表三忠堂記臨江四謝卷第十二十三則王盧溪送胡忠簡秦檜死報吕東莱􅀕文猫牛盗味諌軒龍見赧書丹稜巽巖鄭少融遷除沙世堅淮隂廟金鯽魚張賢良夣乾坤鑑法卷第十三六則范碑詩跋晦庵感興詩武夷先生任元受啓冰清古琴選人戯語卷第十四五則陳了翁始末八陣圖詩開禧北征泗州塔院二將失律卷第十五八則淳熈内禪頌愛莫助之圖慶元公議楊艮議命獻陵䟽文李敬子黃潜善郭倪自比諸􅁑亮桯史目録
