  text: 桯史卷第一十二
  hash: sha256:0b11bad663eb0ea653d2eae6022a71b73f039c26fa8cfaa57ea14bf4b7413792
  markers:
  - {type: page-break, offset: 0, content: '', id: KR3l0072_SBCK_001-1a}
body:
  text: 相臺岳珂張紫㣲原芝髙宗覧婁陟明寅亮之議垂意祖烈詔擇秦支並建二王邸恩禮未有隆殺也㑹連嵗芝生太宫百執事多進頌詩張紫微孝祥時在館獨獻文曰原芝紹興二十四年芝生于太廟楹當仁宗英宗之室詔群臣觀瞻奉表文徳殿賀旣二年芝復生其處校書郎臣張孝祥作原芝曰非天私我有宋我祖宗在天篤丕祐于子孫明吿之符於惟欽哉在昔仁祖登三咸五以天下爲公授我英宗以永我基祚於惟欽哉我聖天子躬濟大業旣平旣治上怡下嬉惟大本未立社稷宗廟之靈亦靡克寜饗有燁兹芝胡爲乎来天維顯思命不易哉和氣致祥敢曰不然􅂚不于他乃廟産旃􅂚不于他于二宗之室􅂚不于他再嵗再出於惟欽哉天意則然我祖宗之意則然於惟欽哉小臣敢告我聖天子告我聖天子承天之意承祖宗之意早定大計惟一無貳紛以貳起辛伯有言惟貳惟一治忽所原匪弗圖之憂惟貳之懼敢告聖天子爲萬世利蠢爾小臣越職罪死弗罪以思惟我聖天子言有一得以禆吾國萬死奚恤渠敢愛死而畏越厥職上得之喜即擢爲南宫郎於是内廷始漸有所别迄于建儲云藝祖禁䜟書唐李淳風作推背圖五季之亂王侯崛起人有倖心故其學益熾開口張弓之䜟呉越至以徧名其子而不知兆昭武基命之烈也宋興受命之符尤爲著明藝祖即位始詔禁䜟書懼其惑民志以繁刑辟然圖傳已數百年民間多有藏本不復可收拾有司患之一日趙韓王以開封具獄奏因言犯者至衆不可勝誅上曰不必多禁正當混之耳乃命取舊本自巳驗之外皆紊其次而雜書之凢爲百本使與存者並行於是傳者懵其先後莫知其孰譌間有存者不復驗亦弃弗藏矣國朝㑹要太平興國元年十一月諸州解到習天文人以能者補靈臺謬者悉黥流海島盖亦障其流不得不然也徐鉉入聘國􅀄三徐名著江左皆以愽洽聞中朝而􅀐省鉉又其白眉者也㑹修述職之貢􅀐省寔來及竟例差官押伴朝臣皆以辭令不及爲憚宰相亦囏其選請于藝祖玉音曰姑退朝朕自擇之有頃左璫傳宣殿前司具殿侍中不識字者十人以名入宸筆􅀧其中一人曰此人可在廷皆驚中書不敢請趣使行殿侍者慌不知所繇薄弗􅀗巳竟徃渡江始燕􅀐省詞鋒如雲旁觀駭愕其人不能荅徒唯唯􅀐省叵測強聒而與之言居􅁆日旣無與之醻復者亦勌且黙矣余按當時陶竇諸名儒端委在朝􅀂使角辯騁詞庸詎不若鉉藝祖正以大國之體不當如此耳其亦不戰屈人兵之土苴歟其後王師征包茅于煜􅀐省復􅀅命請緩師其言累數千言上諭之曰不須多言江南亦何罪但天下一家卧榻之側豈容他人鼾睡耶大哉聖言其視􅀐省之辯正猶螢爝之擬羲舒也􅀐省名甚著三徐者近世或槩爲昆弟余嘉定辛未在故府樓宣獻鑰嘗出手編辨鸞岡三墓余謝不前考後讀周文忠必大游山録有衛尉卿延休􅀐省鉉内史鍇盖父子甚明而余已去國不復得請益云石城堡寨六朝建國江左臺城爲天闕復築石頭城于右􅀫師以守盖如古人連營之制然古今議攻守者多疑以爲分兵力而無用東陽陳同父亮嘗上書乞移都建康謂古臺城當在今鍾山而大司馬門在馬軍新營之側今城乃江南李氏所築耳使六朝因今城以守則不費侯景軰數日力何以歴年如彼其乆乎因言曹武惠登長干兀术上雨花臺城中秋毫不能遯余嘗親歴其地其􅀃皆是第指古臺城所在要未有明據亦出臆度自清凉寺而上皆古石頭頽墉猶可識其址皆依山而髙然則六朝非不知備也楊文節萬里持漕節嘗有詩曰巳守臺城更石城不知併力或分營六師只合環天闕一壘眞成借冦兵向者王蘇俱解此􅁈哉隗恊可憐生􅀂言虎踞渾堪􅀝萬􅀊千秋無戰爭其㫖明矣淳熈乙未郭棣帥淮東築維􅀭城又旁築一城曰堡寨地皆砥平相去餘數里雖牽制之勢亦不相及竟不曉何謂猶不若石城之得失相半也湯􅄮公罷相湯􅄮公思退相髙宗紹興三十一年以煩言罷洪文安遵在翰當直例作平語諌官隨而擊之以祠去孝宗相隆興二年復罷文安之兄文惠适適視草焉又作平語侍御史晁公武亦擊之文惠請外上曰公武言卿黨思退朕謂平詞出朕意固郤其章仍徙户侍矣盖其相兩朝再罷相乃累洪氏二兄弟先後若出一轍可􅀏如此􅄮公中詞科時與文敏邁實同年云南陔脫帽神宗朝王襄敏韶在京師㑹元夕張燈金吾㢮夜家人皆歩出將帷觀焉㓜子宷第十三方能言珠帽襐服馮肩以從至宣徳門上方御樓薌雲綵鼇簫吹雷動士女仰視喧擁闐咽轉盻巳失所在騶馭皆恇擾不知所爲家人不復至帷次狼狽歸未敢白請捕㐮敏訝其反之亟問知其爲南陔也曰他子當遂訪􅀂吾十三必能自歸怡然不復求咸叵測居旬日内出犢車至第有中大人下宣㫖抱南陔以出諸車家人驚喜迎拜天語旣定問南陔以所之乃知是夕也姦人利其服裝自襄敏第中巳竊跡其後旣負而趨南陔覺負已者之異也亟納珠帽于懐適内家車數乗將入東華南陔過之攀幰呼焉中大人恱其韶秀抱寘之􅂰翌早擁至上閤以爲宜男之祥上問以誰氏竦然對曰兒乃韶之㓜子也具道所以上顧以占對不凡且歎其早惠曰是有子矣令暫留欽聖鞠視宻詔開封捕賊以聞旣􅀗盡戮之乃命載以歸且以具獄示襄敏賜壓驚金犀錢果直鉅萬其機警見於㓜年者已如此南陔宷自號政和間有文聲敢爲不詘充其㓜者也余在南徐與其孫遇游傳其事張元呉昊景祐末有二狂生曰張曰呉皆華州人薄游塞上覘覧山川風俗􅁣然有志於經略耻於自售放意詩酒語皆絶豪嶮驚人而邉帥豢安皆莫之知倀無所適聞夏酋有意窺中國遂叛而徃二人自念不力出竒無以動其聴乃自更其名即其都門之酒家劇飲終日引筆書壁曰張元呉昊來飲此樓邏者見之知非其國人也迹其所憩執之夏酋詰以入國問諱之義二人大言曰姓尚不理㑹乃理㑹名耶時曩霄未更名且用中國賜姓也於是竦然異之日尊寵用事寶元西事盖始此其事國史不書詩文雜見于田承君集沈存中筆談洪文敏容齋三筆其爲人槪可想見文敏謂二人名偶與酋同寔不詳其所以更之意云王義豐詩王阮者徳安人仕至撫州守嘗從張紫微學詩紫微罷荆州侍緫得翁以歸偕之游廬山暇日出詩卷相與商榷自謂有得山南有萬杉寺本仁皇所建奎章在焉紫微大書二章其一曰老榦叅天一萬株廬山佳處著浮圖秪因買㫁山中景破費神龍百斛珠其二曰㽵田本是昭陵賜更著官船載御書今日山僧無飯喫􅁍催官欠意何如阮得此詩獨憮然不滿意曰先生氣吞虹蜺今獨少卑之何也紫微不復言送之江津别去􅂊兩旬而得湖隂之訃矣紫微盖於此絶筆阮是時亦自有二十八字曰昭陵龍去奎文在萬嵗靈杉守百神四十二年眞􅀨露山川草木至今春紫微大擊節自以爲不及旣而復過是寺又題其碑隂曰碧紗籠底墨􅅻乾白玉樓中骨巳寒淚盡當時聮􅀐客黃花時節獨來㸔亦紆餘有味云阮所作詩號義豐集刻江泮其出於藍者盖鮮校官馮椅爲之序琵琶亭術者淳熈己酉哲文倦勤詔以北宫爲重華宫光宗旣登極羣臣奉表請以誕聖日爲重明節如故事時先君召還省闥過郷􅀖維舟琵琶亭新暑􅀄袢小憩亭上有術者以拆字自名過焉因漫呼問家人字蹟多竒中命飲之酒忽作而曰近得邸報乎重華重明非佳名也其文皆二千日兆在是矣先君掩耳起亟以數鐶謝遣之旣而甲寅之事果如其言此與太平興國一人六十之䜟無異豈天道證􅀿固有數乎抑符合之偶然也汴京故城開寶戊辰藝祖􅀄脩汴京大其城址曲而宛如蚓詘焉􅂄老相傳謂趙中令鳩工奏圖初取方直四面皆有門坊市經緯其間井井繩列上覽而怒自取筆塗之命以幅􅁓作大圈紆曲縱斜旁注云依此修築故城即當時遺迹也時人咸罔測多病其不宜於觀美熈寧乙􅆗神宗在位遂欲改作鑒􅁐中牧豚及内作坊之事卒不敢更第増陴而巳及政和間蔡京擅國亟奏廣其規以便宫室􅁐囿之奉命宦侍董其役凡周旋數十里一撒而方之如矩墉堞樓櫓雖甚藻飾而蕩然無􅇮時之堅樸矣一時迄功第賞侈其事至以表記兩命詞科之題槩可想見其張皇也靖康胡馬南牧粘罕斡离不􅀭鞭城下有得色曰是易攻下令植砲四隅隨方而擊之城旣引直一砲所望一壁皆不可立竟以此失守沉幾逺睹至是始驗宸筆所定圖承平時藏秘閣今不復存施宜生施宜生福人也少游郷校有僧過焉與之言引之鱣堂下風簷杲日援手周視曰余善風鑒子有竒相故欲驗予術耳歸它日當語子又數年遇諸塗宜生方躓􅂣屋不勝困欲投筆漫徴前􅀃以所向扣之僧出酒一壷與之藉草飲復援其手曰面有權骨可公可卿而視子身之毛皆逆上且覆腕然則必有以合乎此而後可貴也時范汝爲訌建劒宜生心欲以嚴莊尚讓自期而未脫諸口聞其言大喜杖䇿徑謁干以祕䇿汝爲恨得之晚亟尊用之亡何而汝爲敗變服爲傭渡江至泰有大姓呉翁者家僮數千指擅魚鹽之饒宜生傭其間三年人莫之覺也翁獨心識之一日屏人問曰天下方亂英雄鏟跡亦理之常我視汝非傭必以實告不然且捕汝于官宜生不服曰我服傭事惟恭主人乃爾寘疑請辭而巳翁固詰之則請其故翁曰汝動作皆傭而微有未盡同者余日者燕客執事咸駿而汝獨孫諸儕撤器有噫聲􅀂欿然不怡此魚服而角也我固將全汝而何以文爲宜生驚汗亟拜曰主寔生我不敢匿遂告之繇翁曰官購方急圖形遍城野汝安所逃􅀛山有僧可託以心余交之舊矣介以入北䇿之良也從之翁贐之金隠之衲至寺服緇童之服以求納主僧者出儼然鄉校之所見也啓緘而留之餘數旬持撓夜濟宜生于淮曰大丈夫富貴命耳予無求報心天實命汝知復如何必得志母忘中國逆而順天所祐也虜法無驗不可行遂殺一人于道而奪其符以至于燕上書自言道國虚實不見用縻而致之黃龍㑹赦得釋因以教授自業虜有附試畔歸之士謂之歸義試連捷逆亮時有意南牧校獵國中一日而􅀗熊三十六廷試多士遂以命題盖用唐體宜生奏賦曰聖天子講武功雲屯八百萬􅀐日射三十六熊亮覽而喜擢爲第一不數年仕至禮部尚書紹興三十年虜來賀正旦宜生以翰林侍講學士爲之使朝廷聞之命張忠定燾以吏部尚書侍讀舘之都亭時戎盟方堅國備大㢮而諜者傳造舟調兵之事無虚日上意不深信舘者因以首丘風之至天笁微問其的宜生顧其介不在旁忽廋語曰今日北風甚勁又取几間筆扣之曰筆來筆來於是始大警及髙景山告釁而我粗有備矣宜生寔先漏師焉歸爲介所告烹而死宜生方顯時􅀛山僧至其國言于亮而尊顯之俾乗驛至京東視海舟號天使國師不知所終僧蹤跡有異淮人能言之出入兩境如跳河輕財結客又有至術髠而俠者也逆而顯順而戮豈其相然耶椎埋於先一折枝而贖其惡固神理之所不容也國史逸其事余聞之淮士􅆇子西如此􅀳盆杅余居負山在湓城之中先君未卜築時嘗爲戎帥皇甫斌宅斌歸于袁虚其室山有堅土凡市之塗墍版築咸得而畚致之無孰何者遂罄其半獨餘一面壁立余家旣來始厲其禁而山已不支慶元元年五月大􅀨隤其巔古􅃁出焉初僅數甓流下其上有刻如瑞草旁著字曰􅀳永寜元年五月造又有匠者姓名曰張某下有文如押字􅀠或得之以獻莫知所從來居數日而山隤堲周半墮骨髮棺槨皆無存矣兩旁列瓦盌二十餘左壁有一燈尚熒熒取之即滅猶有油如膏見風凝結不可抉盌中有甘蔗節它皆已化有小甆缾如硯滴竅其背爲蝦墓形製甚朴足下有一瓦盆如䙝器有銅帶數銙髹合餘者一片傅木如鐡有半鏡一銅盆絶􅀋今洗羅殊無古制度中有􅀟魚盆底有四鐶附著不測其所以用一銅杅穴底與市井庖人汁器同制每甓著年月姓名如先􅀗者環堲皆是碣曰􅀳征虜將軍墓余旣哀而揜之旣數日復雨山無址竟焉余考􅀳書永寜盖惠帝年號距今九百餘載是時盖未有城郭征虜之名漢雖有之在􅀳以此官顯者不著於史又無名氏可見甓範必有字古人作事如此不苟押字之制世以爲起於唐韋陟五朶雲而不知􅀳已有之余固疑其似而非又不可強識亦可異也凡物皆腐而燈獨尚明驪山人魚之􅀃固容有之蕭綂文選吊􅁳漠君文亦有蔗意其殽核之所重云陶器以再隤皆碎裂餘或爲親識間持去盆杅僅在而余侍親如閩留于家丙辰嵗詔禁挾銅者州家大索以輸嚴之神泉監家人懼杅復偕送官獨盆偶櫝它所今乃巋然存其出其毀要必有時亦重可嘆也因志于此以俟愽識桯史卷第一
