front:
  text: 桯史卷第二十四則
  hash: sha256:2151de86d956b1e34ea34ff2d17584d456dd5ad0f74d042c464032c5bef46ea4
  markers:
  - {type: page-break, offset: 0, content: '', id: KR3l0072_SBCK_002-1a}
body:
  text: 相臺岳珂行都南北内行都之山肇自天目清淑扶輿之氣鍾而爲呉儲精發祥肇應宅緯負山之址有門曰朝天南循其陿爲太宫又南爲相府斗拔起􅁆峰爲萬松八盤嶺下爲鈞天九重之居右爲􅃨嶺設周廬之衛止焉舊傳䜟記曰天目山垂兩乳長龍騫鳯舞到錢塘山明水秀無人㑹五百年間出帝王錢氏有國世臣事中朝不欲其語之聞因更其末章三字曰異姓王以遷就之䜟實不然也東坡作表忠觀碑特表出其事而䜟始章建炎元二之災六龍南廵四朝奠都帝王之眞於是乎驗朝天之東有橋曰望仙仰眺呉山如卓馬立顧紹興間望氣者以爲有鬰葱之符秦檜顓國心利之請以爲賜第其東偏即檜家廟而西則一徳格天閣之故基也非望挻凶􅀑瞰其室檜薨于位熺猶戀戀不能决去請以其姪常州通判烜爲光禄丞留涖家廟以爲復居之萌芽言者風聞遂請罷烜併遷廟主于建康遂空其居髙宗將倦勤詔即其所築新宫賜名徳壽居之以膺天下之飬者二十有七年清蹕躬朝嵗時燁奕重華􅁇御更慈福壽慈凡四侈鴻名宫室實皆無所更稍北連甍爲今佑聖觀盖普安故邸莊文魏王光宗皇帝寔生是間今上亦於此開甲觀之祥益知天瑞地靈章明有待斗筲負乗固莫得而妄據云犇麤字說王荆公在熈寧中作字􅀃行之天下東坡在舘一日因見而及之曰丞相􅄨微窅窮制作某不敢知獨恐每每牽附學者承風有不勝其鑿者姑以犇麤二字言之牛之體壯於鹿鹿之行速於牛今積三爲字而其義皆反之何也荆公無以荅迄不爲變黨伐之論於是浸闓黃岡之貶盖不特坐詩禍也李順呉曦名䜟淳化四年十二月蜀冦王小波死李順􅁇之明年正月己巳即蜀王位五月丁已兩川招安使王􅁇恩克成都順就擒開禧二年正月大將呉曦叛蜀歸􅅃于虜甲午即蜀王位丁酉受虜冊二月乙亥隨軍轉運安丙奉宻詔梟曦于興州􅀃者析順字謂居川之傍一百八日折㬢字謂三十八日我乃被戈較其即位受冊之日不差毫髪又俱終始于蜀嘻亦異矣隆興按鞠隆興􅀄孝宗銳志復古戒燕安之鴧躬御鞍馬以習勞事倣陶侃運甓之意時召諸將擊鞠殿中雖風雨亦張油帟布沙除地羣臣以宗廟之重不宜乗危交章進諌弗聴一日上親按鞠折旋稍乆馬不勝勩逸入廡間簷甚低觸于楣俠陛驚嘑失色亟奔湊馬已馳而過上手擁楣垂立扶而下神采不動顧指馬所徃使逐之殿下皆􅁛萬嵗盖與藝祖抵城挽鬃事􅀂合符節英武天縱固宜有神助也東坡屬對承平時國家與遼歡盟文禁甚寛輅客者徃來率以談謔詩文相娱樂元祐間東坡寔膺是選遼使素聞其名思以竒困之其國舊有一對曰三光日月星凡以數言者必犯其上一字於是徧國中無能屬者首以請于坡坡唯唯謂其介曰我能而君不能亦非所以全大國之體四詩風雅頌天生對也盍先以此復之介如言方共歎愕坡徐曰某亦有一對曰四徳元亨利使睢盱欲起辨坡曰而謂我忘其一耶謹閟而舌兩朝兄弟􅀖卿爲外臣此固仁祖之廟諱也使出不意大駭服旣又有所談輒爲坡逆􅐁使自愧弗及迄白溝徃反齚舌不敢復言他富翁五賊東陽陳同父資髙學竒跌宕不覊常與客言昔有一士鄰于富家貧而屢空每羡其鄰之樂旦日衣冠謁而請焉富翁告之曰致富不易也子歸齋三日而後予告子以其故如言復謁乃命待于屏間設髙几納師資之䞇揖而進之曰大凡致富之道當先去其五賊五賊不除富不可致請問其目曰即世之所謂仁義禮智信是也士盧胡而退同父每言及此輒掀髯曰吾儒不爲五賊所制當成何等人耶旣魁癸丑多士一命而卒先一年嘗以詿誤繫大理光宗知其名特詔赦之是嵗臚傳有因廷䇿指時政之失而及其事者名亦在鼎甲聮􅹻入團司同父見之不恱終期集如始見云太學祭齋碑國學以古者五祀之義凡列齋扁榜至除夕必相率祭之遂以爲爐亭守嵗之酌祝辭惟祈速化而已羣儒執事者帽而不􅅁以縚代之謂之叨冒爵中皆有􅁆鴨脚每獻則以酒沃之謂之僥倖凡今世之登科級者人或竊以此目之則怫然而怒孰知堂堂成均乃有願而不􅀗者乎余謂不然蜡狂之戯以㢮張觀之可也余里士柳二聘肄業立禮齋嘗爲余言如此泉江三地名余外家居泉之石􅀛其傍有天聖間皇城使蘇某者墓後壠中㫁田其間曰狗骨洋九江陶氏有驍衛將軍鑑墓於石龍山之原山折而南溝而絶之曰掘㫁嶺石門澗有支阜下至落拖山據其支之腰皆田田中有大畦焉砥平而髙可播種石餘曰銅釘坵傳者謂其地有休符太史嘗占之以聞于朝有詔夷鏟洋故有神工每欲成輒役萬􅀑而塡之役夫不得休有宿其傍者聞􅀑言以爲所畏者犬厭耳遂烹羣犬而寘骨焉釘以銅爲書符􅂐以絶地脉或曰殺童男女瘞其下爲厭勝是爲童丁說皆不根誕謾然余嘗親歴其地坵乃一平疇在大畈中支阜之下猶十餘里所止處初無􅃁穴莫知其所以用洋與嶺俱隠然有鋤治故跡耕者或謂得骨於故處考之業主之質劑則地名皆信然殊不可曉清臺考驗近世罕有精者妄一男子謂某所有某氣輒隨而發之􅆷人用牲勞民以夷堙詰應於恍愡固清朝之所不爲也他所如此名者比比而是要皆山有偶然低窪相襲而益訛考之載籍皆無所見惟續皇王寶運録有唐金州刺史崔堯封用太白山人之說掘牛山黄巢谷金桶水一事不書於唐史盖不經之說而余所書崇寧鑿阜城王氣僅雜見於野史云牧牛亭金陵牧牛亭秦氏之丘壠在焉有移忠旌忠寺相去五里金碧相照楊誠齋嘗乘軺過之題詩壁間曰函關只有一穰侯瀛舘寜無再帝丘天極八重心未死台星三􅀧拆方休只看壁後新亭䇿恐作栘中屬國羞今日牛羊上丘壠不知丞相更嗔不復自注其下云秦暮年起大獄必殺張徳逺胡􅀖衡等五十餘人不知諸公殺盡將欲何爲奏垂上而卒故有新亭之句然初節似􅂫子卿而晚謬余嘗過其地二刹正爲其家不檢子孫所撓主僧相􅁇而逃去有一支位者主之以寺歸之官刻大碑于門不許其家人之與其事始稍復振檜暮前隊碑宸奎在焉有其額而無其辭卧一石草間曰當時將以求文而莫之肯爲今巳矣檜在虜不乆即逃歸撻辣實縱之不知何以似子卿也黠􅀑醖夢清潭楊汝南少年時以郷貢試臨安待捷旅邸夜夢有人以油沃其首驚而寤牓旣出輒不利如是者三竊怪之紹興乙丑復與計偕懼其復夢也榜掲之夕招同邸者告以故益市酒殽明燭張愽具相與劇飲期以達旦夜向䦨四壁咸寂有僕曰劉五卧西牗下呻呼如魘亟振而呼之醒乃具言􅀄以執炙之勩視愽方酣幸主之不呼竊就枕忽有二人者扛油鼎自樓而登倉皇若有所訪顧見主之在坐也執而注之我怒而爭是以魘汝南聞之大慟曰二千里逺役今復巳矣同邸亦相與嘆咤爲之罷愽及明漫強之觀榜而其名儼然中焉視榜陳于地黯􅀂有迹振衣拂之油漬其上盖御史涖書淡墨以夜倉猝覆燈盌吏不敢以告也宛陵呉勝之柔勝淳熈辛丑得雋于南宫將赴廷對去家􅁆十里有地名曰朱唐舟行之所必經里之士夜夢有語之者曰呉勝之入都至朱唐而反矣起而告諸人時呉有親在垂白意其或尼於行也私憂之旣而無他集英賜第乃在第三甲上曰朱端常聮之者曰唐廙始悟所夢里士怒曰呉勝之登科何與我事􅀑乃侮我耶二事絶相􅀋要知科第有定分非可以智力求也唐有升甲恩今登科記非元次第云汝南余外祖母楊宜人之兄外家能誦傳之嘉定庚午余官故府與勝之爲僚皆親聞其言望江二翁舒之望江有富翁曰陳國瑞以鐡冶起家嘗爲其母卜地青烏之徒輻集莫適其意有建寧王生者以術聞延之踰年姶得吉于近村有張翁者業之國瑞治家未嘗問有無一以諉其子王生乃與其子計所以得地且曰陳氏卜葬環數百里莫不聞􅀂以實言則龍斷取貲未易厭也於是僞使其冶之隷如張翁家議圈豕􅀂以禱者因眺其山木之美而譽之曰吾冶方乏炭此可窑以得貲翁許之乎張翁固弗疑也曰諾居數日復來遂以錢三萬成約國瑞始來相其山大喜築垣繕廬三閱月而大備遂葬之明年清明拜墓上王與子偕忽顧其子曰此山得之何人厥直凡幾子以實告又顧王曰使不以計勝則爲直當幾何曰以時賈商之雖廉猶三十萬也國瑞亟歸命治具鞚馬謁張翁而邀之至則舘焉盛殽醖相與􅅃洽者幾月語不及他翁旣乆留將告歸復張正堂而醼之酒五行輦錢緍三百寘之阼實縑于篚酌酒于斚而告之曰予葬予母人謂其直之朘請以此爲翁壽翁錯愕曰吾他日伐山而薪不盈千焉三萬過矣此惡敢當國瑞曰不然葬而買地宜也詭以爲冶則非也余子利一時之微以是紿翁人皆曰直實至是用敢以爲請凡予之爲將以愧吾子之見利忘義者翁卒辭曰當時固巳許之實又過直子欲爲君子老夫雖賤可強以非義之財耶固授之徃反撐拒詰旦拂衣去國瑞乃怒其子曰汝實爲是必爲我致之不得已宻召其子􅂌焉曰是猶翁也翁竟不知嗟夫世之人以市道相交一錢之爭至於死而不悔聞二人之風亦可以少媿乎劉改之詩詞廬陵劉改之過以詩鳴江西厄於韋布放浪荆楚客食諸侯間開禧乙丑過京口余爲饟幕􅁃吏因識焉廣漢章以􅀄升之東陽黄幾叔機敷原王安世遇英伯邁皆寓是􅀖暇日相與蹠竒吊古多見於詩一郡勝處皆有之不能盡憶獨録改之多景樓一篇曰金焦兩山相對起不盡中流大江水一樓坐斷天中央収拾淮南數千里西風把酒閑來遊木葉漸脫人間秋關河景物異南北神京不見􅀟淚流君不見王勃詞華能盖世當時未遇庸人耳翩然落托豫章游􅅬王閣中悲帝子又不見李白才思眞天人時人不省爲謫仙一朝放迹金陵去鳯凰臺上望長安我今四海游將徧東歴蘇杭西漢􅃆第一江山最上頭天地無人獨登覽樓髙意逺愁緒多樓乎樓乎柰爾何安得李白與王勃名與此樓長突兀以􅀄爲之大書詞翰俱卓犖可喜囑余爲刻樓上㑹兵事起不暇也又嘉泰癸亥嵗改之在中都時辛稼軒弃疾帥越聞其名遣介招之適以事不及行作書歸輅者因傚辛體沁園春一詞併緘徃下筆便逼真其詞曰斗酒彘肩醉渡浙江豈不快哉􅀍香山居士約林和靖與蘇公等駕勒吾回坡謂西湖正如西子濃抹淡粧臨照臺諸人者都掉頭不顧只管傳杯白云天竺去來圗􅀞裏峥嶸樓觀開㸔縱横一澗東西水遶兩山南北髙下雲堆逋曰不然暗香踈影只可􅀌山先探梅蓬萊閣訪稼軒未晚且此徘徊辛得之大喜致餽數百千竟邀之去舘燕彌月酬倡亹亹皆似之逾喜垂别賙之千緍曰以是爲求田資改之歸竟蕩於酒不問也詞語峻㧞如尾腔對偶錯綜盖出唐王勃體而又變之余時與之飲西園改之中席自言掀髯有得色余率然􅀿之曰詞句固佳然恨無刀圭藥療君白日見􅀑證耳坐中烘堂一􅀏旣而别去如崑山姓某氏者愛之女焉余未及􅀲而聞其訃以􅀄後四年來守九江以憂免至金陵亦卒游從歴歴在目今二君墓木拱矣言之於邑金華士人滑稽葉丞相衡罷相歸金華里居不復問時事但召布衣交日飲亡何一日覺意中忽忽不怡問諸客曰某且死所恨未知死後佳否耳一士人在下坐作而對曰佳甚丞相驚顧問何以知之曰使死而不佳死者皆逃歸矣一死不反是以知其佳也滿坐皆􅀏明年丞相竟不起王中父觀之宰徳化暇日爲余戯言士人姓金滑稽人也賢巳圗元祐間黃秦諸君子在舘暇日觀畫山谷出李龍眠所作賢己圗愽奕樗蒲之儔咸列焉愽者六七人方据一局投迸盆中五皆玈而一猶旋轉不巳一人俯盆疾呼旁觀皆變色起立纎穠態度曲盡其妙相與歎賞以爲卓絶適東坡從外來睨之曰李龍眠天下士顧乃效閩人語耶衆咸怪請其故東坡曰四海語音言六皆合口惟閩音則張口今盆中皆六一猶未定法當呼六而疾呼者乃張口何也龍眠聞之亦􅀏而服桯史卷第二
