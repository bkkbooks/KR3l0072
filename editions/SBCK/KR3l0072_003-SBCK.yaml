body:
  text: 相臺岳珂嵗星之祥建炎庚戌狄􅀐飲海上躬御樓船次于龍翔秋駐蹕㑹稽時虜􅀄退師尚􅀫留淮泗朝議凛凛懼其反斾士大夫皆有杞國之憂范丞相宗尹薦朝散大夫毛隨有甘石學有詔赴行在所隨入對言按漢志嵗星所在國不可伐昔湯之元祀嵗星順行與日合于房房心宋亳分也周武王至豐之明年嵗星順行與日合于柳留于張柳張河洛分也故湯征無敵餘慶貤衍猶及微子武王定鼎郟鄏而周公迄營成周四方以無侮今年冬􅀊當􅄤而興宋自此虜必不能南渡矣然禦戎上䇿莫先自治願修政以應天道上大喜旣而果不復來紹興辛已逆亮渝盟有上封者言吾方得􅀊虜且送死詔以問大史考歩如言陳文正康伯當國請以著之親征詔書故其辭有曰嵗星臨於吴分冀成淝水之勲闘士倍於晉師當决韓原之勝盖指此是冬亮遂授首二事之驗不差毫􅁵盖宋國之號而吴則今時廵之所都天意篤棐於是益昭昭矣隨家衢之江山後亦不顯梓潼神應逆曦將叛前事之數月神思昏擾夜數躍起寢中叱咤四顧或終夕不得寢意頗悔欲但巳其弟晛力慫慂之曰是謂􅀐虎顧可中道下耶㬢家素事梓潼自玠璘以來事必禱有驗乃齋而請是夕夢神坐堂上已被赭玉謁焉因告以逆且祈卜年之脩永神不荅第曰蜀王已悉付安丙矣旣寐大喜謂事必遂時安以隨軍漕在魚􅀜驛召以歸命以爰立安顧逆謀堅决觸之且俱靡惟徐圗可以得志不得巳諾之猶辭相印遂以丞相長史權知都省事授之居踰月而成􅀗嘉之績梓潼在蜀著應特異紹興壬子瀘人殺帥張孝芳盖嘗正晝見于閱武堂逆黨恇潰以迄天誅相安之夢得之蜀士瀘之變在京魏公鏜帥蜀時慶元已未余在中都親聞之其他盖不可縷數云機心不自覺秦檜在相位頥指所欲爲上下奔走無敢議者曹泳尹天府民間以乏見鏹告貨壅莫售日嚚而爭因白之檜檜􅀏曰易耳即席命召文思院官未至趣者絡繹奔而來亟諭之曰適得㫖欲變錢法煩公依舊夾錫様鑄一緍將以進入盡廢見鏹不用約以翌午畢事院官不敢違唯而退夜呼工鞴液將以及期富家聞之大窘盡輦􅀫藏爭取金粟物賈大昻泉溢于市旣而様上省寂無所聞矣都堂左揆閤前有榴每著實檜嘿數焉怱亡其二不之問一日將排馬忽顧謂左右取斧伐􅀣有親吏在旁倉卒對曰實甚佳去之可惜檜反顧曰汝盗吾榴吏叩頭服盖其機穽根於心雖嵬􅃈弗自覺此所謂莫見乎隠者亦可嘆也舘娃浯溪靈巖中宫爲蘇永勝槩吊古者多詩之近世王義豐楊誠齋爲之賦植意卓絶脫去雕􅂐畦畛余得之王英伯録藏焉義豐賦舘娃曰汎浮玉之北堂得舘娃之遺基從先生而遊焉揖夫差而弔之或曰是可唾也奚以弔爲哉夫沈湎以䘮國固君人之失道然而有鍾鼓者胡可以弗考聞管籥者民喜而相告苟厥妃之當愛惟恐王之不好矣是則女樂亦可少乎必曰夏有末喜商有妲已周有褒姒而呉以西子苟求其故未必專於此也齊有六嬖威公以興正而不譎聖人􅁛焉非夫九合一正之業得仲父以當其任則其一巳之内少有以自適者舉不足以害成耶關大夫進夏徳豈昏微子得政商豈穢聞蘇公家父並用則􅇏火豈得妄舉子胥不見戮則呉之離宫别舘至于今可存抑夫差之資異在列國亦翹楚一􅀾而越沮再㑹而諸侯懼使僅得一中佐置􅀟翼於猛虎惟自剖其骨鯁而放意於一女敵乗其間無以外禦杯酒之失何足問獨爲此􅀖惜殺士之舉也此士不遭殺夫差不可愚苧羅之姝適足爲我娱胡得而竊吾之符榮楯可居適足華吾廬胡足以隳吾之都惟忠良之旣誅始猖狂而自如臺􅀆姑蘇舟􅀆太湖食􅀆鱠鱸曲􅀆棲烏􅀫􅀆嬪嬙脩明􅀆夷光二八􅀆分明捧心􅀆專房徑􅀆採香屧􅀆響廊􅀏􅀝􅀆玉床奈樂􅀆東方稻蟹種􅀆不遺爭盟􅀆黄池無人􅀆箴規有仇􅀆相窺至徳之廟遂爲禾􅁰悉陂池與臺榭倐一變而􅆊宇入笙歌於海雲令聲鐘而轉鼓儼麛鹿之容與瞰僧儀而觀覩駭越壘以在望奚五戎之閱武松引韻以嗚􅍋柳顰眉而凝佇山黯黯􅀆失色水洶洶􅀆􅁀怒追此謬於千里本差之於毫􅁵譬之養生􅂢其良醫逮疾作於中夜懵藥石之不知志士仁人所爲太息於斯焉盖嘗反覆于此竊謂種蠡亦可哂也勾踐方明舉國以聴十年生聚十年教訓以此衆戰何伐不定何至假負薪之女爲是可耻之勝哉始其土城誨􅁋自君終焉五湖合懽其臣青溪之典不正金谷之義不立滺滺扁舟遂其全璧使之脫鼎中之魚而羣沙頭之鷺返耶溪之蓮而吐洞庭之橘竊謂越之君臣何其陋於此役也越則陋矣呉亦太庸士目旣抉夫誰納忠可􅓧人之亡巳其自反而責躬乎公旣然雍相與歛容起視四山之中覺蕭蕭􅀆悲風誠齋賦浯溪曰予自二妃祠之下故人亭之旁招招漁舟薄遊三湘風與水􅀆俱順未一瞬而百里歘兩峰之際天儼離立而不􅀝其一怪怪竒竒蕭然􅀂仙客之鑑清漪也其一蹇蹇諤諤毅然􅀂忠臣之蹈鼎鑊也怪而問焉乃浯溪也盖􅝓亭在南峿臺在北上則危石對立而欲落下則清潭無底而正黒飛鳥過之不敢立迹余􅀄勇於好竒乃疾趨而登之挽寒藤而垂足照衰容而下窺余忽心動毛髮森竪乃蹟故歩還至水滸削苔讀碑慷􅁣吊古倦而坐於釣磯之上喟然嘆曰惟彼中唐國已膏肓匹馬北方僅或不亡觀其一過尚父日殺三庶其人紀有不斁矣夫曲江爲篋中之羽雄狐爲明堂之柱其􅀖經有不蠹矣夫水蝗䅋民之畒融竪椎民之髓其天人之心有不去矣夫雖微禄兒唐獨不隊厥緒哉觀馬嵬之威垂渙七萃之欲離殪尤物以􅀃焉僅平逹於巴西吁不危哉嗟乎齊則失矣而楚亦未爲得也靈武之履九五何其亟也宜忠臣之痛心􅀉春秋之二三䇿也雖然天下之事易於處而不難於議也使夫謝奉􅁽於髙邑將禀命於西帝違人欲以圗功犯衆怒以求濟天下之士果肯欣然爲明皇而致死哉蓋天厭不可以復祈人潰不可以復支何哥舒之百萬不如李郭千百之師推而論之事可知矣且士大夫之􅂢軀以從吾君之子者亦欲附龍鳯而攀日月踐台斗而盟􅅁礪也一復蒞以耄荒則夫千麾萬旟一呼如響者又安知其不掉臂也耶古語有之投機之㑹間不容穟當是之時退則七廟之忽諸進則百世之􅀭觶嗟肅宗處此其實難爲之九思而未得其計也巳而舟人告行秋日巳晏太息登舟水駃於箭回瞻兩峰江蒼茫而不見義豐賦中􅁛先生蓋時從范石湖成大游誠齋則以環轍湘衡過顔元碑下耳二地出處本不倫筆力到處便覺夫差肅宗無所逃罪獨恨管子趨覇之􅀃不可以訓如爲唐謀則忠今兩刹中皆無此刻而酲夢􅃨語徃徃滿壁間云天子門生盤石趙逵以紹興辛未魁集英之唱後三年以故事召歸爲校書郎時秦檜老矣怙權殺天下善􅀋以立威搢紳脅息趙至一見光範檜適喜欲􅀵拾之問知其家尚留蜀曰何不俱來趙對以貧未能致檜顧吏囁嚅語有頃奉黃金百星以出曰以是助舟楫費趙出不意力辭之吏從以出同舎郎或勸以母怫檜意者趙正色曰士有一介不取予獨何人哉君謂氷山足恃乎勸者縮頸反走吏不得已歸猶不敢以其言白檜已不樂居乆之語浸聞檜大怒曰我殺趙逵如獮狐兎耳何物小子乃敢爾耶風知臨安府曹泳羅致其隷軰而先張本于上曰近三舘士不檢頗多與宫邸通臣將廉之其醖禍不淺矣㑹得疾十月而有絳巾之招髙宗更化微聞其事十一月亟詔兼官朱邸􅁇復召對擢著作佐郎謂之曰卿乃朕自擢秦檜日薦士曾無一言及卿以此知卿不附權貴真天子門生也又曰兩王方學詩冀有以切磋之上意蓋欲以此破前謗趙之未召寔爲東川僉幕緫領符行中有子預薦意其爲􅀋試官宻以文屬之趙不啓緘擲几下旣而符氏子不預牓緫因以他事捃摭之甚峻然卒不能洿趙之介特有守蓋已見於初筮云姑蘇二異人姑蘇有二異人曰何蓑衣曰獃道僧蹤跡皆竒詭淳熈間名聞一時士大夫維舟者率往訪之至今呉人猶能言其大略何本淮陽朐山人書生也祖執禮仕至朝議大夫世爲鼎族遭亂南來寓于郡嘗授業于父已能文一旦焚書裂衣遁去人莫之知旣乃歸被草結廬于天慶觀之龍王堂佯狂妄談乆而皆有驗卧草中不垢不穢晨必一至呉江溲焉郡至呉江五十里往反不數刻人固訝之㑹有一瘵者拜謁乞醫何命持一草去旬而愈始翕然傳蓑可瘉病亦有求而不得隨輒不起者於是逺近稍敬異之孝宗在位怱夢有蓑而跣哭而來吊問之曰臣蘇人也詰其故則不肯言寤以語左璫時上意頗崇緇抑黃弗深信也居月餘成恭后上仙荘文􅁇即世璫因進勉釋而及之意欲以驗前定寛上心上矍然憶昨夢輟泣而嘆璫進曰臣微聞蘇有何姓者􅀋其人它日固未敢言因道其所爲上大驚有詔諭遣不至上嘗燕居深念以規恢大計累年未有所屬且坤儀虚位圗所以膺佐餕承顔之重者焚香殿中黙言曰何誠能仙顧必知朕意遂授璫以香茗曰汝見何則致䞇而已問所以來則曰陛下自禱我不及知視其何以復命璫承命惟謹何忽掉首呉音曰有中國人即有蕃人有日即有月不須問􅃐之去旣復呼還曰所問者姓我猶忘之但言朱家例子不可用也使者歸奏上曰是能知我心遂賜號通神先生築通神菴于觀之内親御寶跗書扁以寵之巳而成肅正中宫歸謝氏蓋本朝故事惟欽成本姓崔後育任氏朱氏旣而惟從朱姓不復歸上意嘗欲以爲比而未决也北伐之議亦少息焉先是觀中諸黃冠以殿宇旣燬欲試其驗羣造其廬拜且白之何從求䟽軸主者謾以與何􅀏曰來日自有施者至午而使者果來旣荅則曰我不能入覲以此累使者上聞而益竒之㑹浙西趙憲伯驌亦爲之請遂肆筆金闕寥陽殿額出内帑緍錢萬繪事一新以答其意上每􅀊以璫將命即其居設千道齋合雲水之士施予優普一􅀊偶踰期咸訝而請亟起于卧揺手瞬目而招之曰亟來亟來璫是日舟至平望乃見何在岸滸招而呼踵廬言之衆白何固未嘗出也因言所以其狀良是獃道僧者實本郡人爲兵家子少有所遇何舊與之友狎不知幾何時髠而髽曰似道似僧故曰道僧狀不慧而言發竒中與何頡頏好蕩游市井間見人必求錢止於三隨即與之貧者何旣不趨召它日璫或薦道僧上欲見之何挽呼不使去曰是將捉汝􅅞汝監汝不容汝來矣道僧竟來見于内殿不拜所言不倫上狎之使出入勿禁且命隨龍人元居實緫管者舘之元懼其逃猝無以應上命果日使十人從之所至不舎踰年歸見何何以杖詬逐之至死訖不與接一談重華倦勤復使召之不肯就邀守萬端三年而致之紹熈甲寅春道僧入北内坐榻前曰今日六月也好大雪侍璫咸􅀏顧曰爾滿身皆雪而􅀏我狂耶相與罔測亦莫以爲意至季夏八日而至尊厭代矣縞素如言焉二人勇於㗖肉食至十數斤獨皆不飲酒亦不言其所以然也何又能耐寒暑余兄周伯言有元某者丙午􅀊七十矣嘗言自丱角見之顔色無少異蘇有妄道士日從之游將倣其爲何不怒獨冒雪馳至垂虹而浴道士不能偕慙而去余兄往見之頗能言宦歴所至酷不喜韓子師方爲守千􅀐每來則提擊而罵之亦有人所不堪者子師素嚴厲於此不以爲忤也道僧先數年卒何慶元間猶在相傳百餘歳矣洪文敏夷堅辛志乙三志亦雜載其事雖微不同要皆履竒行恠有不可致詰者故著之趙希光節槩呉畏齋獵諭蜀有卭守楊熹者頗從輶軒羾所聞因道資中趙希光節槩甚悉余兄徳夫時從幕府得其書以示余楊之言曰趙昱字希光淳熈宰相衛公雄之子少苦學以司馬周程氏爲師每謂存天性之謂良貴充諸巳之謂内富故漠然不以利禄動其心出仕二十餘年僅一磨勘歴任不滿三考其恬退如此汛掃一室左圗右書盡晝夜積日月不舎終身弗改先是衛公相孝宗皇帝一日奏事上從容語及鄭丙曰鄭丙不曉事問他呉挺乃云小孫兒解甚厎衛公曰以大將比小兒丙誠不曉事然以臣見挺雖有所長亦有所短上曰何故公曰爲人細宻警敏此其所長然敢於欺君父又恃其憸巧而愚弄士大夫此其所短但朝廷用之不得其地上曰何謂不得其地衛公曰往年恢復至徳順中原父老簞食壺漿以迎王師者肩摩􅃑接悉取免敵錢大失民望迄以無功中原之人至今怨此子深入骨髓而朝廷乃使之世爲西將西人又以二父故莫不畏服挺亦望宣撫之任乆矣蜀雖名三軍二軍僅當其偏禆雖陛下神武御將百挺何能爲然古帝王長慮􅁍顧爲子孫萬世之計似不如此上大感悟後挺死朝廷雖略行其言已而復故開禧丁􅆗呉曦僣叛昱每念衛公此語輒投地大慟或至氣絶不蘇􅀄欲買舟順流而東賊以兵守蜀門弗果行於是製大布之衣每有自􅀜表避亂而歸者輒號泣弔之亟貽書成都帥臣楊輔謂逆雛驕竪干亂天紀痛哉宗社哀哉蒼生此直愚騃無知爲虜所㗖逆順昭然其下未必皆樂從肘腋之間禍將自作事尚可爲因勸以舉義遂絶粒至於卧疾不能起猶晝夜大號聲逹於外置一劒枕間每舉欲自刺輒爲家人捍之而止如是數四終不食而死熹所紀具是不復損益余生雖晩尚及識衛公父子紹熈壬子冬先君􅂢舘于廣余甫十齡護䘮北歸衛公以寜武之節來治于洪余舟過章江亟命幕屬來唁親以文奠焉余已卒無時之哭因謁棨下援手言疇昔歔欷不自勝顧余甚㓜遣使從先夫人求余程業頗竒其不懾賞其詞語而憐其蚤􅀌也余歸未釋絰而衛公薨輀車西泝余輅希光于琵琶頎然温厚今想見之已足以信熹之傳時方暑待亭上親吏言希光方治養生術以子午時有所行謝客移數晷乃得見冲澹無競其素也衛公止一子希光雖重􅁇體之託亦無訾云稼軒論詞辛稼軒守南徐巳多病謝客予來筮仕委吏實􅀠緫所例於州家殊參辰旦望䞇謁刺而巳余時以乙丑南宫試歳前涖事僅兩旬即謁告去稼軒偶讀余通名啓而喜又頗階父兄舊特與其㓗余試既不利歸官下時一招去稼軒以詞名每燕必命侍妓歌其所作特好歌賀新郎一詞自誦其警句曰我見青山多嫵媚料青山見我應如是又曰不恨古人吾不見恨古人不見吾狂耳每至此輒拊髀白􅀏顧問坐客何如皆歎譽如出一口既而又作一永遇樂序北府事首章曰千古江山英雄無覔孫仲謀處又曰㝷常巷陌人道􅀉奴曽住其寓感槩者則曰不堪回首佛狸祠下一片神鴉社鼓憑誰問廉頗老矣尚能飯否特置酒召數客使妓迭歌益自擊節徧問客必使摘其疵孫謝不可客或措一二辭不契其意又弗答然揮羽四視不止余時年少勇於言偶坐于席側稼軒因誦啓語顧問再四余率然對曰待制詞句脫去今古軫轍每見集中有解道此句真宰上許天應嗔耳之序嘗以爲其言不誣童子何知而敢有議然必欲如范文正以千金求嚴陵祠記一字之易則晚進尚竊有疑也稼軒喜促􅂰亟使畢其􅀃余曰前篇豪視一世獨首尾二腔警語差相似新作微覺用事多耳於是大喜酌酒而謂坐中曰夫君寔中予痼乃味改其語日數十易累月猶未竟其刻意如此余旣以一語之合益加厚頗职視其骩骳欲以家世薦之朝㑹其去未果是時潤有貢士姜君玉瑩中嘗與余游偶及此次日􅂝康伯可順庵樂府一袠相示中有滿江紅作於婺女潘子賤席上者如歎詩書萬卷致君人番沉陸且置請纓封萬户徑湏賣劒酬黃犢慟當年寂寞賈長沙傷時􅂘之句與稼軒集中詞全無異伯可蓋先四五十年君玉亦疑之然余讀其全篇則它語􅁍不甚􅁛似不及稼軒出一格律所􅂝乃板行又故本殆不可曉也順庵詞今麻沙尚有之但少讀者與世傳俚語不同批此恐是辛讀康詞偶熟不覺用其語耳决非竊也桯史卷第三
