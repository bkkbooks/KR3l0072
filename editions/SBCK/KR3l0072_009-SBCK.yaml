body:
  text: 相臺岳珂􅁉陵聖瑞􅁉陵年十三居于濮邸一日正晝憩便寢英祖忽顧問何在左右褰帳方見偃卧有紫氣自􅈹中出盤旋如香􅂐大駭亟以聞英祖􅀏曰勿視也後三年亦以在寢寤驚欽聖請其故曰方熟寐忽覺身在雲表有二神人捧足以登天是以嘑耳既而果登大寳元祐元年三月十四日詔録聖瑞之詳付宗正寺狀元􅀟筆内黃􅀓珏者以財雄大名父世隆决科爲二千石珏不力於學弁鶡碌碌下僚獨能知人嘗坐都市閲公卿車􅀐之過者言它日位所至無毫髮差􅀄不能相術毎曰予自得於心亦不能解也嘗寓北海王沂公曽始就郷舉珏偶俟其姻于􅁄圍之外遇之明日以􅀟筆要而遺之曰公必冠多士位宰相它日無相忘聞者皆􅀏珏不爲怍遂定交傾貲以􅂇其用沂公頼之既而如言故沂公與其二弟以兄事之終身不少替前輩風􅁩凛凛固可敬而珏之識亦未易多得也珏死明道問官止右班殿直監􅀶州酒其孫獻簡堯俞元祐中爲中書侍郎自誌其墓余舊嘗見前輩所記與誌微不同堯舜二字歐陽文忠知貢舉省闈故事士子有疑許上請文忠方以復古道自任將明告之以崇雅黜浮期以丕變文格蓋至日呉猶有喋喋弗去者過晡稍閴矣方與諸公酌酒賦請士又有扣簾梅聖俞怒曰瀆則不吿當勿對文忠不可竟出􅀿鵠􅂁環立觀所問士忽前曰諸生欲用堯舜字而疑其爲一事或二事惟先生幸教之觀者閧然􅀏文忠不動色徐曰似此疑事誠恐其誤但不必用可也内外又一􅀏它日每爲學者言必蹙頞及之一時傳以爲雅謔余按東齋記事指爲楊文公而徒問其爲㡬時人􅀊逺傳疑未知孰是然是舉也實得東坡先生識者謂不啻足爲詞場刷耻矣彼士何􅅓正隆南㓂金國僞正隆丁丑春二月逆亮御武徳殿召其臣吏部尚書李通刑部尚書胡勵翰林直學士蕭廉賜坐而語之曰朕自即位視閱章奏治宫中事常至丙夜始御内寢疇昔之夜方就榻恍惚如親覿有二青衣持幢節自天降授朕以幅紙􅀂牒謂上帝有宣命朕再拜受遂佩弓矢具鍪鎧將從之前而朕常所御小騅號小將軍者儵巳空勒待墀下青衣揖就􅀐旣行但覺雲霧勃鬰起馬蹄間下如海濤洶湧方􅁴心悸望一門正開金碧焜燿青衣指之曰天門也朕随入焉又里許至鈞天之宫嚴䆳宏麗光明奪目朕意欲馳二金甲人謂朕曰此非人間可下馬歩入及殿下垂簾􅀂有所待須􅁷有朱衣出賛拜髣髴聞殿上語如嬰兒使青衣傳宣􅂌朕曰天䇿上將令征某國朕伏而謝出復就馬見兵如􅀑者左右前後杳無邊際發一矢射之萬􅀑齊喏聲如震雷驚而寤喏猶不絶於耳朕立遣内侍至廐視小將軍喘汗雨浹取箭箙數之亦亡其一矣昭􅀿如此豈天假手於我令混江南之車書乎方與卿等圖之謹無􅂥衆皆稱賀於是始萌芽南牧之議矣明年夏五月復召通及翰林學士承㫖翟永固宣徽使敬嗣暉翰林直學士韓汝嘉入見薫風殿問曰朕欲遷都于汴遂以伐宋使海内一統卿意如何通以天時人事不可失機爲對亮大恱永固却立楹間亮顧見之問之故徐進曰臣有愚慮請殫一得本朝自海上造􅀖民未見德而黷兵是聞皇統亦知其不戢之自焚也故雖如梁王之武毅猶以和爲長䇿今宋室偏安天命未改金繒締好􅀊事無闕遽欲出無名之師以事逺征臣竊以爲未便兼中都始成未及數載帑藏虚乏丁壯疲瘁營汴而居是欲竭根本冨庶之力以繕爭戰丘墟之地尤爲非冝臣事陛下不敢不以正對因伏地請死亮以問暉汝嘉暉是通汝嘉是永固亮大怒拂䄂起傳宣二臣殿側聽旨繼而召翰林待制綦戩講漢史戩及陸賈新語事亮怒稍霽乃赦之明日通爲右丞暉爲參知政事永固遂請老又明年左丞相張浩及暉與叛臣孔彦舟内侍梁漢臣卒營汴焉帝豝之禍實昉此汝嘉又二年來盱眙傳命諭郤我使人徐嚞等歸而微諌竟不免戮命讀張棣正隆事迹愽考它記而得其顚末熊克中興小暦書於紹興二十八年者蓋誤以薫風之事合於武徳云梁王者大酋兀术之封李大諒征蒙記謂嘗追􅁽以帝號按紹興辛巳髙景山來求淮漢地指􅀄畫疆事亦以爲梁王要當以國中通言者爲正鼈渡橋虞雍公允文以西掖賛督議既郤逆亮于采石還至金陵謁葉樞宻義問于玉帳留鑰張忠定燾及幕屬馮校書方洪檢詳邁在焉相與勞問江上戰拒之詳天風欲雪因留卯飲酒方行流星警報沓至蓋亮巳懲前􅗮將改圖􅀲洲坐上皆恐謂其必致怨於我也時劉武忠錡屯京口病且亟度未必可􅀝議遣幕府合謀支敵衆以雍公新立功咸屬目葉四顧乆之酌巵醪以前曰馮洪二君雖參帷幄實未履行陣舎人威名方新士卒想望勉爲國家卒此勲業義問與有頼焉雍公受巵起立曰某去則不妨然記得一小話敢爲都督誦之昔有人得一鼈欲烹而食之不忍當殺生之名乃熾火使釡水百沸横篠爲橋與鼈約曰能渡此則活汝鼈知主人以計取之勉力爬沙僅能一渡主人曰汝能渡橋甚善更爲我渡一遭我欲觀之僕之此行無乃􅀋是乎席上皆􅀏已而雍公竟如鎭江亮不克渡而弑自此簡上知馴致魁柄鼈渡本諺語以爲蟹其義則同燕山先見宣和將伐燕用其降人馬植之謀由登萊航海以使于女眞約盡取遼地而分之子女玉帛歸女眞土地歸我議既定矣宇文肅愍虚中在西掖昌言開邊之非䇿論事亹亹王黼惡之及童貫蔡攸以宣威建臺遂使之參謀意欲溷以同浴且窒其口時有旨乏興避事皆從軍法肅愍不得免乃上書極諌曰臣伏覩陛下恢睿聖英武之略紹祖宗之詒謀將舉仁義之師復燕雲之故境不以臣愚不肖使參預機宻臣􅀍命之􅀄意謂朝廷未有定議欲命臣經度相視其事及至河北諸路見朝廷命將帥調兵旅厲器械轉移錢糧已有擇日定舉之􅀃臣既與軍政苟有所見豈敢隱嘿輒具利害仰干淵聽臣聞用兵之䇿必先計強弱虚實知彼知已以圖萬全今論財用之多寡指宣撫司所置便爲財用有餘􅀂㳂邊諸郡帑藏空虚􅅒食不繼則略而不問論士卒之強弱視宣撫司所駐便言兵甲精銳􅀂㳂邊諸郡士不練習武備刓缺則置而不講夫邊圉無􅀿敵之具軍府無數日之糧雖孫呉復生亦未可舉師是在我者未有萬全之䇿也用兵之道禦攻者易攻人者難守城者易攻城者難守者在内而攻者在外在内爲主而常逸在外爲客而常勞逸者必安勞者必危今宣撫司兵約有六萬邊鄙可用不過數千契丹九大王耶律淳者智略輻湊素得士心國主委任信而不疑今欲亟進兵於燕城之下使契丹自西山以輕兵絶吾糧道又自營平以重兵壓我營壘我之糧道不繼而耶律淳者激勵衆心堅城自守則我亦危殆矣是在彼者未有必勝之兆也夫在我無萬全之䇿在彼亦未可必勝兹事一舉乃安危存亡之所繫豈可輕議乎且中國與契丹講和今踰百年間有貪惏不過欲得􅀜南十縣而止耳間有傲慢不過對中國使人稍虧禮節而止耳自女眞侵削以來嚮慕本朝一切恭順今捨恭順之契丹不封植拯救爲我藩籬而逺踰海外引強悍之女眞以爲鄰國彼既藉百勝之􅀔虚喝驕矝不可以禮義服也不可以言􅀃諭也視中國與契丹拏兵不止鏖戰不解勝􅀒未决強弱未分持卞莊兩􅃲之􅀃引兵踰古北口撫有悖桀之衆繫纍契丹君臣雄據朔漠貪心不止越逸疆圉慿陵中夏以百年怠墮之兵而當新銳難敵之虜以寡謀持重乆安閑逸之將而角逐於血肉之林巧拙異謀勇怯異􅀔臣恐中國之邊患未有寜息之期也譬猶冨人有萬金之産與寒士爲隣欲肆并吞以廣其居乃引強盗而謀曰彼之所䖏汝居其半彼之所畜汝取其全強盗從之寒士旣亡雖有萬金之富日爲切鄰強盗所窺欲一夕髙枕安卧其可得乎愚見竊以爲確喻望陛下思祖宗創業之艱難念鄰域百年之盟好下臣此章使百寮廷議儻臣言可採乞降詔㫖罷將帥還朝無滋邊􅂩俾中國衣冠禮義之俗永覩昇平天下幸甚臣冒昧盡言不任戰慄書下三省黼讀之大怒捃以他事除集英殿脩撰督戰益急而北事始不可收拾矣遼又有降將曰郭藥師統其卒曰常勝軍怙寵􅀒衆漸桀驁不可馴肅愍憂之力言于朝請以恩禮留之京師盡使挈致家屬居于賜第緩急有用只以單􅀐遣行事畢即歸以杜後患亦弗聽旣而金人寒盟藥師首叛粘罕遂犯太原肅愍以宣諭使事歸奏徽祖見之歎曰王黼不用卿封殖契丹以爲藩籬之議是以有此是日遂詔於榻前草詔罪巳大革弊政其略曰百姓怨懟而朕不知上天震怒而朕不悟令下人心大恱識者以比陸贄感泣山東之詔云植之歸以童貫先改姓名李良嗣後賜國姓靖康􅀄伏誅藥師仕金至安􅀖鎮國功臣其子亦顯蠲毒圎髙皇毓聖中原得西北之正氣夙賦充實自少至耋未嘗用温劑每小不怡輒進蠲毒圎數百一以芫花大黄大㦸爲主侍醫縮頸而上服之自如有王涇者以技進侈言勇往居之不怍間奉圭七先意持論自詭無傷孝宗素危之屢詰責要以禍福弗之顧淳熈丁未聖夀踰八齡矣一日進餛飩覺􅇩膈欬壅涇猶主前藥既投而不支遂以大漸孝宗震怒立詔誅之慈福要上苦諌薄不􅀗巳減死黥流杖脊朝天門中使涖焉方覬其速斃涇貨五伯下其手卒得活􅀄巨醫王繼先幸紹興始用是取驗孝宗在朱邸扈蹕視師至建康館秦檜故第史文惠爲講官實從行燕之正堂而命莊文醴曽龍于後圃孝宗樂飲以碼碯觥釂者十二因游于圃二臣復各獻一巵後三日屬疾髙皇賜藥使内侍視之服文惠聞之疑其爲蠲毒亟䄂人參圓入問而信遂竊易之僅瘉是日微文惠㡬殆髙皇蓋主此而不知南北之異禀也涇祖繼先之緒餘株守不變是以敗云憲聖護醫憲聖后在慈福慶元丁巳朝廷方卜郊而后不豫始猶自彊起曰上始郊不可以吾故溷齋思敕左右勿奏十一月乙巳還御端門肆眚竣事趣駕至宫而大漸矣先是旬日忽寢疾侍醫進藥輒郤之咸請其故喟然曰吾夀八袠而以醫累人耶意懲王涇之得罪也故廟謚之議曰郤藥輟進務全護醫蓋紀實云京魏公鏜時當軸嘗親爲客言慈聖所謂只此日去免煩他百官其逹死生之變眞􅀂出一揆也魯公拜後慶元間有􅀫儒以文名入鼇掖爲承旨朝議謂且大用㑹韓平原有歸子曰葎先鈐呉門兵時出妾方娠鬻當湖巨室魯氏得男焉葎也旣貴無他子遂以重幣請于魯而歸之始至而平原適有恩制當降麻偶不詳知遂於廷綸中用魯公拜後事意蓋指忠獻耳有欲進者忌之摘其語謂含譏刺平原讀之見其姓之偶符大怒不踰月遂去國終其身不復用當其下筆時􅀄不自覺轉喉之觸謂禍福不可以智力勝當於此乎占之金陵無名詩批或傳是劉貢父題其行李中枕屏熈寧七年四月王荆公罷相鎭金陵是秋江左大蝗有無名子題詩賞心亭曰青苗免役兩妨農天下嗷嗷怨相公惟有蝗虫感恩徳又隨鈞斾過江東荆公一日餞客至亭上覽之不恱命左右物色竞莫知其爲何人也萬􅀊山瑞禽艮嶽􅀄建諸巨璫爭出新意事土木旣宏麗矣獨念四方所貢珍禽之在圃者不能盡馴有市人薜翁素以豢擾爲優場戯請于童貫願役其間許之乃日集輿衛鳴蹕張黄屋以㳺至則以巨柈貯肉炙粱米翁傚禽鳴以致其􅀋既乃飽飫翔泳聽其去來月餘而囿者四集不假鳴而致益狎玩立鞭扇間不復畏遂自命局曰來儀所招四方籠畜者置官司以揔之一日徽祖幸是山聞清道聲望而羣翔者數萬焉翁輒先以牙牌奏道左曰萬􅀊山瑞禽迎駕上顧罔測大喜命以官賚予加厚靖康圍城之際有詔許捕馴籞者皆不去民徒手得之以充飱云王涇庸醫宇文忠惠紹節在樞府余間見焉因及五行之理相與縱譚有客在坐偶曰黥醫王涇者昨鞭背都市流逺方及平原用事始得歸稍叙故秩自言元不曽受杖嘗􅃝而示某以背完瑩無疵􅀄不解其如何也後見他醫言杖皆有瘢惟噬膚之􅀄傅以金箔則瘢立消意金木之性相制耳忠惠􅀏曰昔人有以胝足之藥售于市者輒掲扁于門曰供御或􅀏其不根聞于上召而罪之既而宥其愚及出乃復増四字曰曽經宣喚今此方無乃其比耶子將誰售客亦􅀏不敢􅀿時忠惠未識涇也其二年余在里下聞忠惠不起爲位以􅂘及都人來廼云涇實用蠲毒㵼足疾以致大故朝廷知之再命追涇所復官免杖流永興余因憶在京華時傅著作行簡姚胄丞師皐皆甘涇餌目撃其殞著作未啓手足猶進一刀圭不脱口而逝余一日隨班景靈見胄丞殿門下云痰癖新愈因相勞苦則曰王御醫實生我癖去矣痰下者數斗今顧疲􅒒他則無恙余聞而􅀻憂之謂未必能勝未旬果卒嗟夫醫之害如此哉追思疇昔之言爲之流涕并志顚末以悼其庸黒虎王醫師余稚年入閩過福聞有黒虎王醫師者冨甲一郡問之則􅁇先之别名也􅁇先丗業醫其大父居京師以黑虎丹自名因號黒虎王家及􅁇先幸於髙宗積官留後通國稱爲醫師雖貶猶得麗於稱謂焉􅀄秦檜擅權而未張頗賂上左右以固寵􅁇先寔表裏之當其盛時􅀔熖與檜挈大張去爲而下不論也諸大帥率相與父事王勝在偏校因韓蘄王以求見首願爲養子遂帥金陵軍聞者爭傚不以爲恠檜欲貴其婣族不自言毎請進􅁇先之黨與官􅁇先亦乗間爲檜請諸子至列延閣金紫􅄹門揜顧賕謝攘市便􅃾抑民子女爲妾侍罪不可勝紀而依慿城社中外不敢議者三十年紹興辛巳六月蜀人杜莘老爲南牀擬擊之而未發㑹邊釁啓􅁇先首輦重寳爲南遁計都城爲之騷然上聞之不樂劉武忠錡帥京口請以先發制人之䇿决用兵上意猶隱忍不决亶欲以兵􅀿􅁇先素怯猶幸和議之堅以竊安因間言于上曰邊鄙本無事蓋新進用主兵官好作弗靖欲邀功耳各斬一二人和可復固上不答徐謂侍貂曰是欲我斬劉錡耶於是素軋其下而不得逞者頗浸􅃳及之矣逆亮索我大臣廷遣徐嚞張掄徃聘亮以非指使諌議大夫韓汝嘉至盱眙止之更令遣所索奏至上適在劉婕妤閤當饋輟食婕妤恠之問諸侍貂而得其繇進􅀃寛譬頗與􅁇先之言符上大驚問曰汝安得此婕妤不能隱具以所聞對遂益怒丁未詔婕妤歸别第莘老遂上䟽列其十罪􅀄進讀玉色猶怫然莘老扣榻曰臣以執法事陛下不能去一醫死不敢退猶未許因宻言外議謂􅁇先以左道幸恐謗議叢起臣且不忍聽上始變色首肯罷朝使宣㫖曰朕以顯仁餌汝藥故假爾寵今言者如此當不復有靣目見朕期三日有施行其自圖之辛亥遂詔􅁇先居于福子孫勒停都城田宅皆没官奴婢之強鬻者從便令下中外大恱􅁇先以先事聞詔多藏逺徙故雖籍不害其冨也迄今其故居華棟連甍猶號巨室一傳而子弟蕩柝至不能家或者謂其致不以道冝於厚亡趙牲之作中興遺史載􅁇先始末極詳參以所聞而著其事桯史卷第九
