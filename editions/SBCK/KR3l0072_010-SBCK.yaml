front:
  text: 桯史卷第十八則
  hash: sha256:293c1020eef628f0841feab54a9d508e656625f725db38ffe5a675b1a6ee942c
  markers:
  - {type: page-break, offset: 0, content: '', id: KR3l0072_SBCK_010-1a}
body:
  text: 相臺岳珂永㤗挽章建中靖國􅀄徽祖自藩王入􅁇大統虚心納諌弊政大革海内顒想庶㡬慶曆元祐之治曽文肅爲相頗右紹述諌官陳祐六䟽劾之不從賜罷綸言以觀望推引責之右司諌江公望聞而求對靣請其故上曰祐意在逐布引李清臣爲相耳公望言臣不知其他但近者易言官者三逐諌官者七非朝廷美事因䄂䟽力言豐祐政事得失且曰陛下􅀂自分彼此必且起禍亂之源上意感格危從之矣㑹前太學􅀶士范致虚上書言太學取士法不當變且言臣讀聖製泰陵挽章曰同紹􅁉陵尊此陛下孝弟之本心也臣願守此而巳時黃冠􅀄盛范因右街道録徐知常以其姓名聞禁中且陳平日趨向謂非相蔡京不可上幡然亟召見曰朕且不次用卿遂除右正言􅂊供職首論二事其一言神宗一代之史非紹聖無以察正元祐之詆謗今復詔參修是紛更也願令史官條具紹聖之所以掩蔽者示天下其二言元祐置訴理所以雪先朝得罪之人紹聖命安享蹇序辰駮正固當然耳二人乃坐除名如此則訴理爲是矣夫二臣之罪不除則兩朝之謗終在䟽奏上益嚮之於是國論始决是秋江以論蔡邸獄責知淮陽軍范馴致尚書左丞云殿中鷴徽祖居端邸時藝文之暇頗好馴養禽獸以供玩及即位貂璫奉承羅致稍廣江公望在諌省聞之亟諌上大恱即日詔内禦盡縱勿復留殿中有一鷴蓄乆而馴不肯去上親以麈尾逐之迄不離左右乃刻公望姓名于麈柄曰朕以旌直也及江去國享上之論興浸􅁋及于艮嶽矣都城廣莫秋風夜静禽獸之聲四徹宛如郊野識者以爲不祥益思江之忠焉劉藴古劉藴古燕人也逆亮將南㓂使之僞降以覘國而無以得吾柄乃以首飾販鬻往來夀春頗言兩國事見淮賈輒流涕曰予何時見天日耶因縱譚亮國虚實以㗖朝廷自詭茍見用取中原滅大金直易事耳邊臣不疑宻以名聞時兵釁巳啓詔許引接至行都首言其二弟在北皆登巍科惟巳兩薦禮部而未第因謀南歸以成功名當國者喜之遂授迪功郎浙西帥司準備差遣時紹興三十一年九月癸巳也藴古猶不厭意日強聒于朝辯舌泉涌廷臣咸竒之㑹亮誅未得間以北􅁇改京秩爲鄂倅隆興􅀄元三月濠梁奏北方游手萬餘人􅀿募欲以營田藴古聞而有請願得自將以與虜角毋使徒老耒租間左揆陳文正參預張忠定同知辛簡穆咸是之次相史文惠獨不可曰是必姦人來爲虜間國家隄防稍宻不得施其伎欲姑以此萬人藉手反國耳諸公雜然謂逆詐文惠顧行首吏召之曰俟其來嘗可見也相與坐堂中俟乆之至文惠迎謂曰昔樊噲欲以十萬衆横行匈奴中議者猶以爲可斬子得萬烏合何能爲藴古素謂廟議咸許其來也意得甚卒聞此語大駭失色遽曰某意無他此萬人家口皆不來必不爲吾用不如乗其未定挾去爲一拍事幸成猶不可知耳文惠顧諸公曰巳得之通判之言是矣此萬人固不留獨不知通判盛眷今在何所時藴古家在幽燕自知失言内愒不得對比茶甌至戰灼不復能執㡬墮地遂退諸公猶不然然迄得不遣既踰月張忠獻奏改倅太平州往來都督府禀議軍事後數載藴古私使其僕駱昂北歸有告者及捜所遣家訊則皆刺朝廷機事也乃伏其誅於是始服文惠之先識焉􅀄呉山有伍貟祠瞰闤闠都人敬事之有冨民􅂢貲爲扁額金碧甚侈藴古始至輒乞靈焉妄謂有心諾輟俸易牌而刻其官位姓名于旁市人皆驚曰以新易舊惡其不華耳易之而不如其舊其意果何在有右武大夫魏仲昌者獨曰是不難曉他人之歸正者僥倖官爵金帛而已藴古則眞細作也夫諜之入境不止一人榜其名所以示踵至者欲其知巳至耳聞者憮然不信後卒如言余嘗謂納降非上䇿見于前録呉畏齋啓文惠之謀國可以言智矣仲昌一武弁乃能逆見姦人之情其才亦有足稱者今世殆不多見也大散論賞書紹興壬午春南北既交兵蜀宣撫使吳璘謀取雍使大將姚仲攻大散關不下仲乆于軍妄謂軍士不用命實賞給之薄故功且弗成王參預之望時緫軍賦仲之幕屬曰宋紱嘗登門焉以書抵之曰先生以博大髙明之學當艱難險阻之時凡百施設莫非經乆顧兹全蜀乆頼綏撫雖三􅁁用兵之際無征輸重困之勞自非先生以體國愛民爲念何以及此天下之􅀔固有不兩立者兵與民是也兵不可不費財而責其萬死之功民不可不出財而濟其一時之急此天下之通理也先生深知兵民兩相爲用之䇿聞蜀民自軍興之後恬然自安不有用兵之費先生恩德固亦大矣然有可言者紱爲先生門下士豈敢自隱且時異事異故冝改更不可執一自虜人九月六日叩關于時事出倉卒諸將云大軍一出必遂破敵􅀄宣撫呉公自謂可以兩月爲期必能克敵既而虜壁愈堅相持已踰四月矣將帥牽制乆未成功兵不可不謂之􅁀露如今日事􅀔與前日不同先生當相時之冝以取必勝兹其時也聞之諸軍􅃲志不銳戰心不壯且曰使我力戰就能果立微勞其如賞給在何䖏伺􅀱覈實保明申􅀗宣司緫司㫖麾往返數旬豈能濟急大率在今之􅀔與前旣異不立重賞何以責人前宣撫呉公僅能保守全蜀蓋賞厚而戰士用命也先生詳酌事機别與措置略於川蜀敷科軍湏之費十分之一多與準備給賞錢物近一二百萬自緫所移文諸帥明出曉示號令諸軍各使立功以就見賞謂如散關一處設使當􅀄有銀絹各一二萬匹錢引一二十萬道樁在鳯州宣撫呉公節使姚公以上忤賞給明告諸軍遣二三統制便冝各以其所部全軍一出諭之曰當進而退則坐以軍法進而勝捷能破關隘則有此重賞如是而軍不用命虜不破滅無有也􅀃者謂方今朝廷財用匱乏􅀂寅縁軍興而費耗國用則先生所不取紱曰不然先生體國愛民之心朝野孰不知兵事固有當更張而不更張則悠乆相持不能力濟機㑹一勞而乆逸暫賞而永寜正在此舉紱之區區未必可行幸先生恕其狂愚或以爲可教則一覽付火王讀之大駭乃答書曰辱示劄且見咎不科敷百姓異哉足下之言也本所以財賦爲職事􅀿副諸軍自當竭力􅀂是軍湏闕乏有功將士合賞但於王少卿取辦可也至於科敷他人何預哉僕中原人蜀中無一錢生業亦無親族寓居其不科敷何私於蜀蓋以大軍十餘萬衆仰給於此不得不愛養其民力以固根本有四川民力則有三軍四川民窮則三軍坐困矣如足下輩月俸􅀊􅅒不從空虚中來亦知其所自乎朝廷德意深厚毎務寛恤東南調度如此不聞歛取於民四川獨可加賦乎國家養兵所以保民而足下乃謂軍民不兩立恐非安民和衆制用豐財之義又云用兵本約兩月今巳四箇月然則觧嚴未可期也􅀂本所當時便徇諸處無藝之求只作兩箇月計則今日何以支吾事未可期則所費無限且不愛民力以備方來之湏將如異日何僕之歛於民乃所以爲諸軍也用兵一百三十日糗糧草料銀絹錢引所在委積未嘗乏興而足下乃云爾不知軍行出入何處闕錢糧草料累次喝犒并朝廷支賜自是諸軍􅀿報稽緩文字􅂊到本所立便給散略無留阻􅀂是激賞則湏俟有功諸軍既無功狀本所慿何支破散關前日不下聞自有􅀃莫不爲無銀絹錢引否不知散關是險固不可取乎是有可取之理而無銀絹錢引之故乎士卒不肯用命豈計司之責必有任其咎者况聞攻關之日死傷不少則非士卒之不用命矣自來兵家行動􅀂逗撓無功多是以糧道不􅁇嫁禍於有司以自解亦未聞以無堆垜賞給爲詞者也國家息兵二十年將士不戰竭四川之資以奉之一旦臨敵更湏堆垜銀絹而後可用則軍政可知矣且如向來和尚原丁劉圈殺金平諸軍大捷近日呉宣撫取方山原秦州等䖏王四廂取啇􅉑等州呉四廂取唐鄧州不聞先垜銀絹始能破賊也朝廷賞格甚明本所􅀄無慳吝如秦州治平之功得宣司關狀􅀰時行下魚關支散何嘗稍今闕悞兼魚關簽㕔所備金帛錢物充滿府藏宣撫不住關撥豈是無樁辦也顧生民膏血不容無功而得耳假令僕重行科敷積金至斗諸軍衣糧犒設支賜之外􅀂無功效一錢豈容妄得哉果有功豈容本所以不科敷而不賞乎諸軍但務立功無患賞給之不行也但管取足無問緫所之科敷也劉晏歛不及民何害李郭之勲李晟屯東渭橋無積貲輸糧以忠義感人卒滅大盗足下以書生爲人幕府不能以此等事規賛主帥而反咎王人以不歛於民豈不異哉九月以後興元一軍支撥過錢引二十八萬道銀絹二千匹兩而糗糧草料與犒設賞錢之􅀋不與焉亦不爲不􅀿副矣􅀂皆及將士豈不可以立功有功賞而未得者何人也朝廷分司差職各有所主而於財賄出納爲􅀹嚴經由檢察互相關防所有屢降㫖揮凡有支費宣司審實緫所量度此古今通義而聖朝之明制也足下獨不便何哉來書謂攻散關􅀂得銀絹一二萬匹錢引一二十萬樁在鳯州有此重賞而虜不破滅無有也樁在鳯州與魚關何異方宣撫以攻守之䇿㑹問節使時亦不聞以此爲言今散關鳯翔未破足下可與軍中議取散關要銀絹錢引􅀂千取鳯翔要􅀂干可以必克本所當一切抱認足下可結罪保明具申當以聞於朝廷如克敵而賞不行僕之責也􅀂本所抱認而不能成功足下當如何僕前後見將帥多是忠義赴功􅂢軀報國之人只縁幕中導之或非其道以至害事如姚帥之賢固不妄聽然足下自不􅀿爲此異論也萬一朝廷聞之得無不可乎之望嘗備貟剡薦預有懼焉且冝勉思婉畫謹重話言勿恤小利以敗大事但得主帥成功足下復何求哉信筆不覺喋喋幸照紱得書頗自慚悔仲亦大恐閠月癸酉率諸軍肉薄而登遂克之余嘗從蜀士大夫得其書謂今世言功者多約取而豐責先事質償如宿逋然神州未復端坐此耳王之盡理仲之􅀘過紱之服義要皆可書故剟取其詳而傳之成都貢院成都新繁有藏藝祖御容者莫知始何年令長交事匵護􅂌付惟謹淳熈間胡給事元質制置四川聞之謂偏陬下鄙非所宜有命歸之府議以爲乾徳平僣僞雖鑾輿不親幸而􅂄定一方實爲雋功欲扳援章武端命故事建殿以嚴毖奉遂斥羡財鳩工伐巨木千章卜地築宫有日矣僚寀或謂郡國私建宗廟􅁩盍先以聞俟報可胡竦然乃暫輟役驛書請于朝廷議果不以爲然弗之許胡大沮念木石巳具且動觀瞻不容巳㑹貢院敝甚因撤而新之旣畢工壯麗甲西州焉事有適㑹乃如此向子西能言其詳因伶語而及兹􅀃萬春伶語胡給事既新貢院嗣􅀊庚子適大比乃侈其事命供帳考校者悉倍前規鵠􅂁入試茗卒饋漿公庖􅁇肉坐案寛㓗執事恪敬誾誾于于以鬯於文士論大愜㑹􅀄場賦題出孟子舜聞善􅀂决江河而以聞善而行沛然莫禦爲韻士旣就案矣蜀俗敬長而尚先逹毎在廣􅂣不廢請益焉晡後忽一老儒擿禮部韻示諸生謂沛字惟十四泰有之一爲顚沛一爲沛邑注無沛决之義惟它有霈字乃從雨爲可疑衆曰是閧然扣簾請出題者偶假寐有少年出酬之漫不經意亶云禮部韻注義旣非増一雨頭無害也揖而退如言以登于卷坐逺于簾者或不聞知乃仍用前字於是試者用霈沛各半明日將試論語籍籍傳凡用沛字者皆窘復扣簾出題者􅀄不知昨夕之對􅀿曰如字廷中大諠浸不可制譟而入曰試官誤我三年利害不細簾前闈木如拱皆折或入于房執考校者一人歐之考校者惶遽急曰有雨頭也得無雨頭也得或又咎其誤曰第二􅂣更不敢也蓋一時祈脫之辭移時稍定試司申鼓譟􅂣屋胡以不稱於禮遇也怒物色爲首者盡繫獄韋布益不平旣拆號例宴主司以勞還畢三爵優伶序進有儒服立于前者一人旁揖之相與詫􅀶洽辨古今岸然不相下因各求挑試所誦憶其一問漢四百載名宰相凡㡬儒服以蕭曹而下枚數之無遺羣優咸賛其能乃曰漢相吾言之矣敢問唐三百載名將帥何人也旁揖者亦詘指英衛以及季葉曰張廵許逺田萬春儒服奮起爭曰廵逺是也萬春之姓雷歷攷史諜未有以雷爲田者揖者不服撑拒滕口俄一緑衣參軍自稱教授前据几二人敬質疑曰是故雷姓揖者大詬􅃝裼奮拳教授遽作恐懼狀曰有雨頭也得無雨頭也得坐中方失色知其風已也忽優有黃衣者持令旗躍出稠人中曰制置大學給事台㫖試官在坐爾軰安得無禮羣優亟歛容趨下喏曰第二􅂣更不敢也俠戺皆􅀏席客大慙明日遁去遂釋繫者胡意其爲郡士所使録優而詰之杖而出諸竟然其語盛傳迄今山谷范滂傳山谷在冝州嘗大書後漢書范滂傳字徑數寸筆􅀔飄動超出翰墨逕庭意蓋以悼黨錮之爲漢禍也後百年眞蹟逸人間趙忠定得之寳寘巾篋搢紳題跋如牛腰焉既廼躬蹈其禍可謂竒䜟嘉定壬申忠定之子崇憲守九江刻石郡治四􅀃堂紫巖二銘張紫巖謫居十五年憂國耿耿不替昕夕適權姦新斃時宰恃虜好而不固圉紫巖方居毋䘮上䟽論事朝廷以爲狂復詔居零陵一日慨然作几間丸墨并常支笻竹杖二銘以寓意墨之銘曰存身于昬昬而天下之理因以昭昭斯爲瀟湘之寳予將與之歸老而逍遥杖之銘曰用則行舎則藏惟我與爾危不持顚不扶則焉用彼或録以示當路大怒以爲諷已將奏之㑹病卒不果它日陳正獻俊卿爲孝皇誦之摘其一銘書于御杖焉桯史卷第十
