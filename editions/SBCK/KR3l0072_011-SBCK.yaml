front:
  text: 桯史卷第十一八則
  hash: sha256:f1cd6829475a908b4f7ed5727647c72480c4c29c61c8b185ac665ed7a826e09b
  markers:
  - {type: page-break, offset: 0, content: '', id: KR3l0072_SBCK_011-1a}
body:
  text: 相臺岳珂李白竹枝詞紹聖二年四月甲申山谷以史事謫黔南道間作竹枝詞二篇題歌羅驛曰撑崖拄谷蝮蛇愁入箐攀天猿掉頭􅀑門􅀜外莫言逺五十三驛是皇州浮雲一百八盤縈落日四十九渡明􅀑門􅀜外莫言逺四海一家皆弟兄又自書其後曰古樂府有巴東三峽巫峽長猿鳴三聲淚霑裳但以抑怨之音和爲數疊惜其聲今不傳余自荆州上峽入黔中備嘗山川險阻因作二疊傳與巴娘令以竹枝歌之前一疊可和云􅀑門􅀜外莫言逺五十三驛是皇州後一疊可和云􅀑門􅀜外莫言逺四海一家皆弟兄或各用四句入陽􅀜小秦王亦可歌也是夜宿于驛夣李白相見於山間曰予往謫夜􅀰於此聞杜䳌作竹枝詞三疊丗傳之不子細憶集中無有三誦而使之傳焉其辭曰一聲望帝花片飛萬里明妃雪打圍馬上胡兒那解聽琵琶􅀿道不如歸竹竿坡靣蛇倒退摩圍山腰胡孫愁杜䳌無血可續淚何日金雞赦九州命輕人鮓甕頭船日瘦􅀑門􅀜外天北人墮淚南人􅀏青壁無梯聞杜䳌今豫章集所刋盖自謂夣中語也音響節奏似矣而不能揜其真亦寓言之流歟蟻蝶圖黨禍既起山谷居黔有以屏圖遺之者繪􅀟蝶翾舞骨於蛛􅁝而隊蟻憧憧其間題六言於上曰胡蝶􅀟飛得意偶然畢命網羅群蟻争􅀵墜翼䇿勛歸去南柯崇寜間又遷于宜圖偶爲人􅂝入京鬻于相國寺肆蔡客得之以示元長元長大怒將指爲怨望重其貶㑹以訃奏僅免其在黔嘗摘香山句爲十詩卒章曰病人多夣醫囚人多夣赦如何春來夣合眼在郷社一時網羅之味盖可想見然余觀其前篇又有􅁳懐齊逺近委順隨南北歸去誠可憐天涯住亦得之句浩然之氣又有百折而不衰者存蟻計左矣周益公降官周益公相兩朝慶元間以退􅀓居于吉􅀮然有東山之望當路忌之時善􅁼引去者紛紛一皆指爲僞學婺有吕祖泰者東萊之别􅂀也勇義敢言憤時事之日非􅁬然投匭上書力詆用事者且乞以益公爲相皁嚢下三省朝論雜然起或以爲益公實頥指之遂露章奏劾且謂淳熈之季王魯公爲首台益公嘗擠而奪之位以身爲僞學摽凖羽翼其徒使邪􅀃横流以害天下屏居田野不自循省而誘致狂生扣閽自薦以覬召用乞加貶削上不以爲然言者益急乃鐫一官爲少保下祖泰于天府杖而竄之益公上表謝余時在里中傳得之今尚憶其全文曰告老七年宿愆故在貶官一等洪造難名敢期垂盡之年猶麗怙終之罪中謝伏念臣踈庸一介際遇四朝逮事髙皇已徧塵於臺省受知孝廟復乆玷於機衡不思勉效於同寅乃敢與聞於異論既肺肝衆所共見豈口舌獨能自明惟光宗興念於元僚亦屢分於閫􅀉肆陛下曲憐其末路爰俾遂於里居首將正於狐丘巢忽危於燕幕狂生妄發姓名輙及於樵蘇公議大喧論罰盍輸於薪粲僅削司徒之秩猶存平􅁟之官兹蓋恭遇皇帝陛下崇德尚寛馭民敬故國皆曰殺雖㣲可恕之情耄不加刑姑用惟輕之典遂令衰朽亦與生全臣有愧積中無階報上省諐田里視桑䕃之幾何托命乾坤比櫟材而知免􅀄當路入浸􅃳欲文致以罪而難其重名意或有辨論乃寘於貶及奏至引咎紆徐言正文婉洒然消釋既而東朝奉寳冊詔復其秩時北門者當制廷綸有曰駭匹夫狂悖之上聞乃片言詿誤之併及既有疑於三至姑薄禠於一階朕方建皇極而融㑹於黨偏尊重闈而濡浹於慶施申念三朝之遺老僅同下國之靈光寜屈彛章以全晚節屬外親之詣闕在更生􅀄豈預知貶宫保以居間矧彦􅀶巳嘗得謝猶不謂非罪也嘉定更化詔湔祖泰過名授以文資而晦庵朱文公而下皆襃贈賜謚於是其言始伸方祖泰之得罪有宗姓者尹京据案作色涖制梃焉祖泰大呼庭下曰公爲天族同國休戚某乃爲何人家計安危而􅀗斯辱也尹亦慙趣訖其罪使去行都人至今能誦其詳猶有爲咤惜者畨禺海獠畨禺有海獠雜居其最豪者蒲姓號白畨人本占城之貴人也既浮海而遇風濤憚於復反乃請于其主願留中國以通徃來之貨主許焉舶事寔頼給其家􅀊益乆定居城中屋室稍侈靡踰禁使者方務招徠以阜國計且以其非吾國人不之問故其宏麗竒􅊆益張而大冨盛甲一時紹熈壬子先君帥廣余年甫十􅀊嘗游焉今尚識其故處層樓傑觀晃蕩緜亘不能悉舉矣然稍異而可紀者亦不一因録之以示傳竒獠性尚􅀑而好㓗平居終日相與膜拜祈福有堂焉以祀名如中國之佛而實無像設稱謂聱牙亦莫能曉竟不知何神也堂中有碑髙袤數丈上皆刻異書如􅂐籕是爲像主拜者皆嚮之旦輙㑹食不置匕箸用金銀爲巨槽合鮭炙梁米爲一灑以薔露散以氷腦坐者皆寘右手于褥下不用曰此爲觸手惟以溷而巳羣以左手攫取飽而滌之復入于堂以謝居無溲匽有樓髙百餘尺下瞰通流謁者登之以中金爲版施機蔽其下奏厠鏗然有聲楼上雕鏤金碧莫可名狀有池亭池方廣凡數丈亦以中金通甃制爲甲葉而鱗次全􅁼今州郡公宴燎箱之爲而大之凡用鉟鋌數萬中堂有四柱皆沉水香髙貫于棟曲房便榭不論也嘗有數柱欲羾于朝舶司以其非常有恐後莫致不之許亦卧廡下後有窣堵波髙入雲表式度不比它塔環以甓爲大址絫而増之外圜而加􅁅飾望之如銀筆下有一門拾級以上由其中而圜轉焉如旋螺外不復見其梯磴毎数十級啓一竇􅀊四五月舶將來群獠入于塔出于竇啁唽號嘑以祈南風亦輙有驗絶頂有金雞甚鉅以代相輪今亡其一足聞諸廣人始前一政雷朝宗潨時爲盗所取跡捕無有㑹市有窶人鬻精金執而訊之良是問其所以致曰獠家素嚴人莫闖其藩予棲梁上三宿而至塔裹麨糧􅀮于顚晝伏夜縁以剛鐡爲錯斷而懐之重不可多致故止得其一足又問其所以下曰予之登也挾二雨盖去其柄既得之伺天大風鼓以爲翼乃在平地無傷也盗雖得而其足卒不䏻􅀘以至今他日郡以􅀊事勞宴之迎導甚設家人帷觀余亦在見其揮金如糞􅁟輿皁無遺珠璣香貝狼籍坐上以示侈帷人曰此其常也後三日以合薦酒饌燒羊以謝大僚曰如例龍麝撲鼻竒味不知名皆可食逈無同槽故態羊亦珍皮色如黄金酒醇而甘㡬與崖􅁡無辨獨好作河魚疾以腦多而性寒故也余後北歸見藤守王君興翁諸􅀰言其冨巳不如􅇮日池匽皆廢云泉亦有舶獠曰尸羅圍貲乙於蒲近家亦蕩析意積賄聚散自有時也王荆公王荆公相熈寜神祖虚心以聽荆公自以爲遭遇不世出之主展盡底藴欲成致君之業顧謂君不堯舜世不三代不止也然非常之元諸老力爭紛紜之議殆偏天下乆之不䏻堪又幸其事之集始盡廢老成務汲引新進大更弊法而時事斬然一新至于元豊上巳漸悔罷政居鍾山不復再召者十年其後元祐羣賢迭起不推原遺弓之本意急於民瘼無復周防激成黨錮之禍可爲太息余嘗侍樓宣獻及此宣獻誦荆公是時嘗因天雪有絶句曰􅀔合便疑埋地盡功成直欲放春回農夫不觧豊年意秪欲青天萬里開其志盖有在余􅀿曰不然舊聞京師􅂭冬嘗有官檢凍死秀才腰間繫片􅁓啓視之乃喜雪詩四十韻使來年果豐巳無救溝中之瘠矣况小人合􅀔如章曽蔡吕輩未知竟許放春否宣獻聽然是其􅀃及今觀之發冢之議同文之獄以若人而居位豈不如所臆度荆公􅀄心於是􅀌矣尊堯集表日録一書本熈寕間荆公奏對之辭􅀻所録記紹聖以後稍尊其􅀃以竄定元祐史諜蔡元度卞又其壻方烜赫用事書始益章建中靖國􅀄曽文肅布主紹述垂意實録大以据依陳了翁瓘爲右司貟外􅀰以書抵文肅謂薄神考而厚安石尊􅀻史而壓宗廟不可文肅大怒罷爲外郡㝷責合浦了翁始著合浦尊堯集爲十論亶辨其所紀載猶未敢以荆公爲非及北歸又著四明尊堯集爲八門曰聖訓曰論道曰獻替曰理財曰邊機曰論兵曰處已曰寓言始條分而件析之無婉辭矣政和元年徽祖聞有此章下政典局宣取時了翁坐其子正彚獄徙通川郡移文索之了翁遂以表進乞於御前開拆􅀄崇寜既建辟廱詔以荆公封舒王配享宣聖廟肇剏坐像了翁憤之併於奏牘寓意其略曰代言之筆盡目其徒爲儒宗首善之宫肇塑其形爲坐像禮官舞禮而行謟吏書獻佞而請觀光乎仲尼乃王雱聖父之賛比諸孔子實卞等輕君之情彼衰周之僻王弃真儒之將聖當時不得配太廟之饗後世所以廣上丁之祠今比安石爲欽王之臣則方神考爲何代之主又况一人幸學列辟班隨至尊拜伏於爐前故臣驕倨而坐視百官氣鬰多士心寒自有華夏以來無此悖倒之禮神考之再相安石始終不過乎九年安石之屏迹金陵弃置不名者十載八字威加於鄧綰萬機獨運於元豊豈可於善述之時忽崇此不遜之像又曰又况臨川之所學不以春秋爲可行謂天子有北面之儀謂君臣有迭賔之禮禮儀如彼名分􅀂何此乃衰世侮君之非豈是先王訪道之法贑川舊學記刋于四紀之前辟水新廱像成於一壻之手唱如聲召􅀿􅀂響随其自叙則曰愚公老矣益堅平險之心精衛眇然未捨塡波之願殁而後已志不可渝望雖隔於戴盆夣不忘於馳闕丹誠上格天語遥詢要觀尊主之恭緩議奸時之罪淵冰在念梟磔寜逃書奏有㫖陳瓘自撰尊堯集語言無緒並係詆誣不行毀弃送與張啇英意要行用特勒停送台州覊管令本州當職官常切覺察不得放出州城月具存在申尚書省於是廟堂意叵測識者爲了翁危之了翁不顧至天台剡謝之辭猶曰知詆誣之不可志在尊堯豈行用之敢􅀻心惟􅂇舜語言無緒議論至迂獨歸羙於先猷遂大違於國是不行毀棄有誤咨詢虚消十載之光隂靡恤一門之溝壑果煩揆路特建刑章􅀂非䝉庇於九重安得延齡於再造其凛凛不屈盖如此余後因讀夷堅支乙見其記優人嘗因對御戲設孔子正坐顔孟與安石侍側孔子命之坐安石揖孟子居上孟辤曰天下逹尊爵居其一軻僅䝉公爵相公貴爲真王何必謙光如此遂揖顔子顔曰回也陋巷匹夫平生無分毫事業公爲名世眞儒位貌有間辤之過矣安石遂處其上夫子不䏻安席亦避位安石皇懼拱手云不敢徃復未决子路在外憤憤不能堪徑趨從祀堂挽公治長臂而出公治爲窘迫之狀謝曰長何罪乃責數之曰汝全不救護丈人看取别人家女壻其意以譏卞也時方議欲升安石於孟子之右爲此而止是知當時公議雖小夫下俚猶不愜不特了翁也其後朝論亦頗疑於禮文遇車駕幸學輒以屏障其面是時荆公位實居孟子上與顔子爲對未嘗爲止夷堅誤矣國􅀄舊制兖鄒二公東西嚮今郡縣學二公所以並列于左者盖靖康撤荆公像之時徒撤而不復正耳其位尚可攷也然徽祖聖孝根心毎以􅁉陵篤睠之故不忍以荆公爲非翠華北狩居五國城一日燕坐聞外有貨日録者亟輟衣易之曹功顯勛親紀其事羮牆之念本無一日忘了翁之辨雖明其迄不見省者亦政宣大臣無以正救爲將順者歟三忠堂記廬陵號多士儒先名臣今古輩出里人圖所以尊顯風厲以垂無窮者嘉㤗四年八月始爲堂縣庠以祀三忠時周益公在里居春秋七十有九矣是􅀊多不懌稍謝碑版之請不肯爲一日韋布􅅃其門者百數閽辤焉弗可乃強爲通益公方卧奮然起曰是當作即爲屬藁文不加􅀧而成邑人愜望四方聞其復秉筆求者沓至益公實病矣其冬十月朔遂薨盖絶筆焉後四年余得録本於李次夔大章其文曰文章天下之公器萬世不可得而􅀻也節義天下之大閑萬世不可得而踰也吉爲江西上郡自皇朝逮今二百餘年兼是二者得三公焉曰歐陽公脩以六經粹然之文崇雅黜浮儒術復明遂以忠言直道輔佐三朝士大夫翕然尊之天子從而謚曰文忠莫不以爲然南渡搶攘右相杜充擁衆臣虜金陵守陳􅀖光就降惟通判楊􅀖乂㦸手罵賊視死如歸國􅀔凛凛士大夫復翕然尊之天子從而褒贈之賜謚曰忠襄則又莫不以爲然時宰議禮衆論詾詾惟一編脩官胡銓毅然上書乞斬相參虜使三綱五常頼以不墜士大夫復翕然尊之厥後天子從而褒贈賜以忠簡之謚則又莫不以爲然是之謂三忠雖然此􅀖非無宰相如劉沆沖之在朝嘗力薦文忠留寘翰苑又引冨文忠公弼共政今姓名著在勲臣之令而謚則未聞子瑾孫僴俱爲待制迄不䏻請矧􅀍遇之從臣乎夫然後知節以一惠天子猶不敢專亦必士大夫翕然尊之乃可得耳廬陵宰趙汝厦即縣庠立三忠祠􅀊時率諸生祀焉巍巍堂堂衮服有章掲日月而行學者固仰其煒煌􅀂夫百世之下聞清風而興起得無幕休烈􅀭顯光者耶汝厦用意逺矣其後樓宣獻銘益公墓稱其精確簡嚴士謂紀實益公謚文忠余謂它日有尚賢者在位隮配其間尚可謂四忠也臨江四謝臨江謝氏世以儒鳴元豊八年有名懋者及其弟􅄮其子舉廉世充同登進士第連標之盛侈於一時時人謂之臨江四謝舉廉字民師東坡嘗以書與之論文今載集中艮齋諤紹熈間位中執法以厚徳著盖其族孫也桯史卷第十一
