front:
  text: 桯史卷第十二十三則
  hash: sha256:d3a8637bc54d5648fe1f09ad6fbd92ed41f16c746a70c1f1eafca5cbf59ea875
  markers:
  - {type: page-break, offset: 0, content: '', id: KR3l0072_SBCK_012-1a}
body:
  text: 相臺岳珂王盧溪送胡忠簡胡忠簡銓既以乞斬秦檜掇新州之禍直聲振天壤一時士大夫畏罪䈤舌莫敢與立談獨王盧溪廷珪詩而送之今二篇刋集中曰嚢封􅀄上九重􅀜是日清都虎豹閑百辟動容觀奏牘幾人回首愧朝班名髙北斗星辰上身墮南州瘴海間豈待它年公議出漢庭行召賈生還大厦元非一木攴欲將獨力拄傾危癡兒不了官中事男子要爲天下竒當日姦䛕皆膽落平生忠義只心知端能飽喫新州飯在處江山足護持於是有以聞于朝者檜益怒坐以謗訕流夜􅀰時年七十既而檜死盧溪因讀韓文公猛虎行復作詩寓意曰夜讀文公猛虎詩云何虎死忽悲啼人生未省向來事虎死方羞前所爲昨日猶能食熊豹今朝無計柰狐狸我曽道汝不了事喚作癡兒果是癡盖復前􅀃也㝷許自便孝宗􅀄政召對寤合詔曰王􅋝珪粹然耆儒凛有直節頃以言語文字抵牾權臣流落排拫殆踰二紀召對便殿敷奏詳華可特改左承奉􅀰除國子監主簿廷珪不留乞崇道祠官去乾道六年再召對便殿上又留之不可乃詔復禄以祝􅁵後告老終于家壽九十三其再召也廟堂欲予一子官既而不果識者謂以忠得壽而澤不及嗣天人報施猶􅀂少偏時又有朝士陳剛中三山寓公張仲宗亦以作啓與詞爲餞而得罪檜之怨忠簡盖流貤不少置也秦檜死報秦檜擅權乆大誅殺以脅善􅁼末年因趙忠簡之子汾以起獄謀盡覆張忠獻胡文定諸族􅁄寺奏牘上矣檜時已病坐格天閣下吏以牘進欲落筆手顫而汙亟命易之至再竟不能字其妻王在屏後揺手曰勿勞太師檜猶自力竟仆于几遂伏枕數日而卒獄事大解諸公僅得全􅀄汾就逮自分必死然竟不知加以何罪囑其家曰此行無全理脫幸有恩言當於饋食中寘􅁏􅀏靨一以爲信毋忘既入獄月餘無所問亶日施慘酷求死不可得一日正晝寘之闇屋仰絣之使視椽榱偶見屋上一竅如錢㣲有日影湏􅁷稍轉射壁上有一反字汾解意亟臣異謀遂得小梃惟數晷以待盡忽外致食于橐滿其中皆􅀏靨汾泣曰吾約以一而今乃多如是殆紿我旣而獄吏皆來賀即日脫械出則檜聲鍾給􅉠矣忠獻是時居永亦㣲聞當路意汾旣繫昕夕不自安且念爲大夫人憂不敢明言忽外間報中都有人至亟出視一男子喘卧􅉉下殆不能言方吉凶叵測衆環睨縮頸忠獻素堅定於是亦色動有頃掖之坐稍灌以湯餌而甦猶未出語亶數指腰間索之得片􅁓盖故吏聞檜訃走介星馳至近郊益奔程欲速是以顚䠞頃刻之間堂序懽聲如雷王盧溪在夜􅀰郡守承風㫖待以囚􅀠至不免旬呈適郵筒至張燕公堂以召之盧溪恠前此未之有不敢赴邀者系踵不得巳趨詣罷燕之明日始聞其事守盖先得之矣故盧溪旣得自便之命題詩壁間曰辰州更在武陵西毎望長安信息希二十年興搢紳禍一終朝失相公威外人􅀄􅀃哥奴病逺道俄聞逐客歸當日弄權誰敢指如今憶得姓依稀蓋志喜也同時謝任伯之子景思伋家在天台爲郡守劉景所捕既至而改禮王仲言揮塵録詳紀之與夜􅀰守略同是知檜稔惡得斃爲善􅁼之福不貲要非幸災也吕東萊􅀕文吕東萊祖謙居于婺以講學唱諸儒四方翕然歸之陳同父蓋同郡􅀒才頡頏亦游其門以兄事之嘗於丈席間時發警論東萊不以爲然既而東萊死同父以文􅀕之曰嗚呼孔氏之家法儒者世守之得其粗而遺其精則流而爲度數刑名聖人之妙用英豪竊聞之狥其流而忘其源則變而爲權譎縦横故孝悌忠信常不足以趨天下之變而材術辯智常不足以定天下之經在人道無一事之可少而人心有萬變之難明雖髙明之洞見猶小智之自營雖篤厚而守正猶􅀌壘之易傾盖欲整兩漢而下庶㡬及見三代之英豈曰自我成之在兄方夜半之􅇵論嘆古來之未曽講觀象之妙理得􅀿時之成能謂人物之間出非天意之徒生兄獨疑其未通我引數而力爭豈其於無事之時而已懐厭世之情俄遂嬰於末疾喜未替於儀刑何所遭之太慘曽不假於餘齡將愽學多識使人無自立之地而本末具舉雖天亦有所未平耶兄嘗誦子皮之言曰虎帥之聽孰敢違子人之云亡舉者莫勝假使有聖人之宏才又將待幾年而後成孰知夫一觴之慟徒以拂千古之膺伯牙之琴已分其不可復鼓而洞山之燈忍使其遂無所承眇方來之難恃尚既徃之有靈朱晦翁見之大不契意遺婺人書曰諸君子聚頭磕額理㑹何事乃至有此等恠論同父聞之不樂它日上書孝宗其略曰今世之儒士自謂得正心誠意之學者皆風痺不知痛痒之人也舉一世安於君父之大讎而方且􅀭眉拱手以談性命不知何者謂之性命乎陛下接之而不任以事也臣以是服陛下之仁意盖以㣲風晦翁而使之聞之晦翁亦不訝也此􅀃得之蔡元思念成猫牛盗余辛未􅀊官中都居旌忠觀前家素蓄一青色猫善咋䑕家人咸愛之一日正午出門即逸去購求竟不􅀗又憶緫角時先夫人治家政城南有别墅一牯甚腯爲人所盗先夫人不欲擾其鄰弗捕既而有言湖中民分肉不均羣闘而訟在邑余時尚㓜家無紀綱僕莫能弊訟又弗問從邑中自斷後推其月日乃同一夕盖逺在百里外牛舉趾緩迄不知何以致也它日余間以問客有能知閭里之姦者爲余言内北和寜門實有肆其間號曰鬻野味直廉而肉豊市人所樂趨其物則市之猫犬􅁼也夜􅇢犬􅀒而趨猶幸不遇人􅀂猫則皆晝攫都人居淺隘猫或嬉敖于外一見不復可遁毎得之即持浸户外防虞缸桶中猫身濕輙䑛非甚乾不已以故無鳴號者有見而逐之則必問以毛色自䄂出其尾皆非是傳聞其手中乃有十數尾視其非者而出之都人習尚不窮姦雖知其盗以爲它人家猫則亦不問也夜則皆入于和寜之肆無遺育焉牛嗜鹽盗者持一鈎一竿一繩竿通中行則爲杖䇿而匿鈎繩于腰間見者固莫疑其眹伺夜入欄手鹽以飼牛牛引舌則鈎之夙導繩通中急趣其杪牛􅀒痛欲觸則隔竿之長欲鳴則礙鈎之利鈎者奔牛亦奔故雖數合直一瞬耳又它日以質之捕吏之良者道盗之智甚悉所聞皆信然嗟夫盗亦人耳使即此心以喻於義夫孰能禦哉一有所移而用止於是觀者亦思所以用者而擇焉斯可矣味諌軒戎州有蔡次律者家于近郊山谷嘗過之延以飲有小軒極華㓗檻外植餘甘子數株因乞名焉題之曰味諌後王子予以橄欖遺山谷有詩曰方懐味諌軒中果忽見金盤橄欖來想共餘甘有􅀲􅁑苦中真味晚方囬時盖徽祖始登極國論稍還是以有此句云龍見赦書金國熈宗亶皇統十年夏龍見御寨宫中雷雨大至破柱而去亶大懼以爲不祥欲厭禳之左右或以爲當肆赦遂召當制學士張鈞視草其中有顧兹寡昧及眇予小子之言文成奏御譯者不曉其退託謙冲之義乃曰漢兒彊知識託文字以詈我主上耳亶驚問故譯釋其義曰寡者􅀌獨無親昧者不曉人事眇爲瞎眼小子爲小孩兒亶大怒亟召鈞至詰其􅀃未及對以手劒剺其口􅁄而醢之竟不知譯之爲愚爲姦也其年亶弑亮於登寳位赦􅁀其惡而及此丹稜巽巖眉山秀出岷峨屬邑丹稜者李文簡燾實家焉邑有山曰龍鶴文簡讀書其上命曰巽巖因以自號士夫至今以爲稱嘗自爲記曰子真子三卜居乃得此山向東南靣西北其位爲巽爲乾盖處已非乾徤無以立􅀿物非巽順無以行易六十四卦仲尼掇其九而三陳之起乎履止乎巽此講學之序也語曰可與共學未可與適道可與適道未可與立可與立未可與權夫人各有所􅂂善惡分焉惟能謙可與共學惟能復可與適道知所適而無以自立則莫能乆故取諸常使乆於其道或損之或益之至於困而不改􅀂井未始隨邑而遷則所以自立者成矣雖然吉凶禍福横發逆起有不可知將合于道其惟權乎然非巽則權亦不可行學而至于巽乃可與權此聖賢事業也文簡字仁父一字子真作記時年二十四鄭少融遷除孝宗在位乆益明習國家事厲精政本頗垂意骨鯁以彊本朝淳熈六年鄭少融丙􅀄拜西掖首䟽官冗賞濫力指時政之失且謂卿監丞簿事簡官備館職史官至二十貟學官書局各以十數監司郡守疊授三政參議祠廟歸正添差養老將校充滿外路東宫徹章館閣進書雜流厮役例霑賞典曰隨龍曰􅀿奉開河修堰併􅂣蠲賦無時推恩他司錢物漕乞移用尉不捕賊詭奏有功張大虚聲横􅀍醲賞累數百言上覽而壯之奎札付中書曰賞功遷職不以濫予鄭丙言是也給舎遇書讀宜隨事以聞於是廷臣始側目既而少融益亹亹論事敢扵劘上上亦忻然納之無忤八年遂兼夕拜東宫春坊陳􅀛年女嫁巨室裴良珣裴死于酒兄良顯訴陳女利其冨死有􅁈事下天府語連􅀛年尹不敢治詔送大理左右有爲之地者詔漕司先審責良顯不實反坐狀始得行少融駮奏曰願少存國法爲子孫萬世計竟如􅀄詔韓子師以曽覿援有起廢意少融極口詆之曰是人仰累聖德後大臣或指二言之切爲賣直上不聽諭少融曰朕自喜給舎得人亟遷吏書以矯其讒時王謙仲藺丞宗正進對曰今日不欺陛下惟鄭丙惜其愛莫助之耳上喜亦遷監察御史謙仲􅀹擊􅅮不畏彊禦馴致大用奬直厲斷盖􅀮然有亨阿封即墨之風焉至今士夫間猶能誦其獨立敢爲之實也少融繼守數郡治㣲尚嚴云沙丗堅乾道間有歸正官曰沙丗堅素武勇坐􅂍配􅀠靜江府鄭少融爲廣西憲命之捕盗有功稍復其官慶元中爲徳安守麄􅁀自如酷不喜文吏余郷有晁仲式百辟者丗名家爲安陸宰實爲其僚晁好飲而敢爲􅀄亦相得乆益厭乃枘鑿不謀丗堅捕邑胥羅致其罪欲劾奏之先對易外邑一尉章垂上而病稍自悔尼不發檄晁歸府見之卧内命妾以杯酒酌之頗道􅀄意之謬謂人實浸􅃳非我也晁唯唯謝因歴歴囑後事且諉其與它僚同任責既而曰沙丗堅武人性直没許多事一句是一句知縣不相怨否晁素滑稽忽抑首㣲對曰百辟豈敢怨太尉但心裏有些忡忡地沙大怒亟叱使去力疾發郵筒又旬而死晁竟坐是不得調者十年遂終于家一言輕發横挑黥夫之辱晁固不無罪也淮隂廟楚州淮隂夾漕河而邑於澤國諸聚落􅀹爲荒涼開禧北征余舟過其下舟人指河東岸弊屋數椽曰是爲楚王信廟亟維纜登焉堂廡傾欹幾不庇風雨兩旁皆過客詩句楹楣戸牖題染無餘往往玉石混淆殊不可讀左廂有髙堵不知何人冩楊誠齋二詩其上字甚大不䏻工亦舛筆畫余以意揣録之其一曰來時月黒過淮隂歸路天花舞故城一劒光寒千古淚三家市出萬人英少年跨下安無忤老父圯邊愕不平人物􅀂非觀􅀊暮淮隂何必减文成其二曰鴻溝秪道萬夫雄雲夣何銷武士功九死不分天下鼎一生還􅀒室前鐘古來犬斃愁無盖此後禽空悔作弓兵火荒餘非舊廟三間破屋兩株松音節悲壯倫儗抑􅀭徧壁間殆無繼者本題文成爲宣成余按張留侯謚與霍博陸自不同後得麻沙印本朝天續集乃亦作宣字􅀹可恠也前篇首尾兩淮隂雖意不同疑亦傳􅃨虜既入塞舊廟當無復存不知今血食如何金鯽魚今中都有豢魚者能變魚以金色鯽爲上鯉次之貴游多鑿石爲池寘之簷牖間以供玩問其術祕不肯言或云以闤市洿渠之小紅蟲飼凡魚百日皆然􅀄白如銀次漸黄乆則金矣未暇驗其信否也又别有雪質而黒章的皪􅀂􅃮曰玳􅈘魚文采􅀹可觀逆曦之歸蜀汲湖水浮載凡三巨艘以從詭狀瑰麗不止二種惟杭人能餌蓄之亦挾以自隨余考蘇子羙詩曰松橋扣金鯽竟日獨遲留東坡詩亦曰我識南屏金鯽魚則承平時蓋巳有之特不􅀂今之盛多耳張賢良夢張賢良君恱咸家蜀綿竹世以積徳聞紹聖􅀄再試制科宰相章惇覽其䇿以所對不以元祐爲非大怒雖得簽書劒西判官以去而科目自是廢矣仕既不甚逹益篤意植媺貤慶以遺後人嘗一日晝寢夢神人自天降告之曰天命爾子名德作宰相驚而寤未㡬而魏公生時魏公之兄已名滉君恱不欲更所從乃字魏公曰徳逺出入將相垂四十年忠義勲名爲中興第一天固有以啓之者歟乾坤鑑法政和􅀄濮有異人曰王老志以方術幸賜號洞微先生蔡絛國史後􅀘巳詳其事不復􅃨紀所履旣竒崛道幽顯事益渉於誕惟掉頭禄豢時出危言與靈素等異趣爲可稱其在京師毎心非時事亦屢以意風蔡元長使遷於善而弗聽也徽祖嘗召之入禁籞顯肅后在坐老志率然出幅􅁓于䄂曰陛下它日與中宫皆有難臣行死不及見矣臣有乾坤鑑法可以厭禳然􅀹當修徳始可回天意請如臣法鑄鑑各以五色流􅂫垂之寘於寢殿臣死後當時坐鑑下記憶臣語日儆一日思所以消變於未形者上竦然受其􅀃左右皆大驚既有詔尚方庀工鑑成進御而老志歸于濮遂病以死靖康陟方之禍二宫毎寳持之且歎其先識古今方士多矣憶中不足竒而能棄巳所嗜納君於正斯可嘉也剟而載之以見聖徳之兼容者桯史卷第十二
