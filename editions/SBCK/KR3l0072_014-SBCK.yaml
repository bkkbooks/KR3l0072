front:
  text: 桯史卷第十四五則
  hash: sha256:62546342a868acde18f8ba4b9c1d8e5e6c15e6ec4ae21f2c4e588970074f6aee
  markers:
  - {type: page-break, offset: 0, content: '', id: KR3l0072_SBCK_014-1a}
body:
  text: 相臺岳珂陳了翁始末陳了翁在徽祖朝名重一時爲右司貟外􅀰曽文肅敬之欲引以附已屢薦于上使人諭意以將大用之了翁謂其子正彚曰吾與丞相議多不合今乃欲以官相餌吾有一書將遺之汝爲我書且曰郊恩不逺恐失汝官柰何正彚再拜願得書了翁喜明日持以見文肅于都堂適與左司朱彦㑹待于賔次朱借讀其書動色旣見文肅果大怒嘻􅀏謂曰此書它人得之必怒布則不然雖十書不較也了翁退即録所上文肅書及日録辨國用須知以狀申三省曰昨詣尚書省投書䝉中書相公面諭其詳謂瓘所論爲元祐淺見單聞之􅀃兼言天下未嘗乏才雖有十書布亦不動瓘不逹大體觸忤大臣除具申御史臺乞賜彈劾外伏乞敷奏早行竄黜遂出知泰州鄒道郷在西掖救之不從上臨朝謂文肅曰瓘如此報恩地耶又曰卿一向引瓘又欲除左右史朕道不中議論偏今日如何文肅愧謝􅀄議竄徙韓文定爲首台陸農師在政地救之曰瓘言誠過當􅀂責之則更以此得名曽布必能容之也謫乃薄余謂前輩名節之重身蹈危機不復小顧申省公牘百載而下讀之凛凛有生氣余丱角時先夫人教誦古今奏議謂足壮它日氣節此書與焉今尚憶其全文曰壦聞之古賢未嘗無過周公孔子顔淵皆有過也子路聞過則喜所以爲聖賢之徒成湯改過不吝所以爲百丗之師故曰過而能改善莫大焉匹夫改過善在一身大臣改過福及天下閤下徳隆功大四海之内所賛頌然謂閤下無過則不可尊􅀻史而壓宗廟縁邊費而壞先政此二者閤下之過也違神考之志壞神考之事在此二者天下所共知而聖主不得聞其􅀃䝉蔽之患孰大於此瓘之所撰日録辨一篇已進之於上閤下試一讀之則所謂尊􅀻史而壓宗廟者可見矣瓘去年所論陜西河東事未盡詳悉近守無爲奉行朝廷詔敕乃知天下根本之財皆已運於西邊比縁都司職事看詳内降劄子因述其事名曰國用須知亦已進之於上閤下試讀之則所謂縁邊費而壞先政者可見矣主上修繼述之效閤下乃違志壞事以爲繼述自今日已往其効漸見所以誤吾君者不亦大乎効之速者􅀹在於邊費熈寜條例司之所講元豐右曹之所守舉朝公卿無如閤下最知其本末今閤下獨擅政柄首壞先烈彌縫壅蔽人未敢議它日主上因此兩事以繼述之事問於閤下閤下將何以爲對當此之時閤下雖有腹心之􅂇恐亦不得髙枕而卧也且邊事之費外則帥臣内則宰相帥臣知一方之事而巳雖竭府庫之財而傾之不可責也至於宰相之任則異乎此矣豈可以知天下匱竭而恬不恤匱竭困壞先政因務蔽䝉閤下欲辤其過可乎瓘比縁禀事聞閤下之言指尚書省爲道揆之地瓘謂閤下此言失矣三省長官宜守法而巳􅀂夫道揆天子三公之事豈太宰之所得預乎兩年日食之變皆在正陽之月此乃臣道大彊之􅀿亦閤下之所當畏也宜守而揆豈抑畏之謂乎周官曰居寵思危今天下旱蝗方數千里天變屢作人心憂懼邊費壞敗國用耗竭而閤下方且以爲得道揆之體可謂居寵而不思危矣閤下於瓘有薦進之恩瓘不敢􅀒是以論吉凶之理獻先甲之言冀有􅀘於閤下􅀂閤下不察其心拒而不受則今日之言謂之􅀒恩可也􅀒與不􅀒在瓘察與不察在閤下事君之位無髙下各行其志孰得而奪之乎瓘去年九月三日上封章皆乞奏知東朝所以尊人主而抑外家也欽聖未見察則瓘􅀍貶黜後來慈意開悟則瓘得牽復人主察􅀌臣之盡忠欽聖知忠言之有􅀘毋慈子孝主聖臣直此國家兩全之道廟社無疆之福也今欽聖納忠之羙未白於天下而諌官不二之心得罪於廟堂脅持之風甚於去􅀊乖離之論唱自大臣所以厚欽慈者果在此乎瓘前日辤都司之命而閤下未許其去者閤下必有以處瓘矣此士大夫之所共諭也主上念欽聖納忠之意察􅀌臣不二之心奬眷之恩至深至厚瓘欲擇死所以圖報效無􅀒於人主無愧於外家一身之安危豈睱恤哉然則今日之言安知不見察於閤下也閤下深思而已瓘不敢供要職重取煩言又不忍嘿嘿而去惟閤下留聽幸甚前書尊堯集表蓋與此互見始末讋䛕立懦不厭屢書也正彚是似益可嘉後竟坐罪流削坎􅇄不自悔云八陣圖詩瞿唐灔澦天下至嶮毎春夏漲潦砂磧巨石如屋者皆一夕隨波去獨諸葛武侯八陣圖巋然歴千古獨存識者謂其有神護紹興中蜀士有喻汝礪者持憲節來治于夔趣召過郡與䕫帥宴江上謂是圖源委風后表而詩之自爲序曰䕫帥任子野以人日置酒江瀕觀武侯八陣圖諸公皆云八陣自武侯始捫䣛先生獨謂不然乃作古風示之庶㡬諸公知八陣之所由起其詩曰魚復江邊春事起萬􅀧紅旗颺清泚主人元是劉夢得載酒娛賔水光裏酒䦨放脚歩沙磧細石作行相靡迤卧龍起佐赤龍子天地風雲入鞭箠蛇盤虎翼飛鳥翔四正四竒公所壘當時二十四萬師開門闔門隨臂指幾回嚇殺生仲逹往往宵遁常􅀐豕海中僊人丈二履相與往來迃玉趾􅀏云此公大肚皮龍拏虎擲堆􅅐胃江頭風波幾劘蕩㫁岸奔峯俱披靡陽侯鏖戰三峽怒秪此細石吹不起晉大司馬宣武公常山之蛇中首尾幙中矹矹何物客未有一客能解此千年獨有老竒癲見之斂􅃑三嘆喟頗知此法自元女細與諸公剖根柢君不見風后英謀儘竒詭龕定􅃖􅀹等蜉蟻漢大將軍親閱試四夷聞風皆禠氣馬􅂭三千相角掎西羗茸茸落牙觜而公於此出新意蓋丗功名無第二不知何處著􅀟手建立乃與天地比河圖洛書亦如此堂堂孔明今未死我門生人如死人老了不作一件事却􅀍猕猴坐御床孰眎天王出居汜旣不能蹠穿􅂰􅁀秦玉庭放聲七日􅂘不已又不能斷脰决腹死社稷滿地淋漓流腦髓羡它安晉温太眞壯它覇越㑹稽蠡八年嫪戀飽妻子灑涕東風􅁏生髀斑斑猶在杲卿髮離離未落張巡齒愛惜微軀欲安用有臣如此難準擬雖然愛國心尚在左角右角頗諳委二廣二矩及二甄春秋所書晉所紀况迺東廂與洞當復有青龍洎旬始􅁋􅁋陳法有如許智者舎是愚者蔽此圖昔人之芻狗參以古法行以巳偏爲前距狄􅀏之制勝於兹亮其豈尔朱十萬破百萬第顧方略何如耳嗟我去國􅀊月老渺􅄅赤心馳玉扆可憐阿伾財女子而我未刷􅀖家耻屬者買舟瀘川縣扣船欲泛吳江水赤甲山前春雪深白帝城下扁舟艤胡爲於此乆留滯細雨打篷愁不睡剽聞逆雛犯淮泗陛下自將誅陳豨六師如龍賊如䑕殺回屋瓦皆蜚墜距􅁰直射六百歩虜尸蔽江一千里哀哉猕猴太癡絶垂死尚持虞帝匕那知光武定中興要把中原痛􅐡洗君不見陛下神武如太宗萬全制陳將平戎􅀝聞獻馘平江宫坐使四海開春容六騑還自江之東光復舊京如轉蓬蜀花千枝萬枝紅輒莫取次隨東風竒癲眼腦醉冬烘東向舞蹈壽廼翁醉醒聊作竹枝曲乞與欵乃歌巴童喻三嵎人靖康􅀄爲祠部外􅀰僞楚之僣集議祕省簮弁恇慴喻獨捫其䣛曰此豈易屈者哉即日掛冠去於是以捫􅂰自號有集十四卷它詩文嶮恠挺絶皆稱是劉後溪光祖實序之焉開禧北征開禧丙寅五月王師北伐有詔發鎮江緫司緡錢七十萬犒淮東軍命官宣旨軍前宣臺檄余往時鏠旗罙入未有所底傳聞叵測人皆憚行文移峻甚余不敢辤遂浮漕河而北次楚道北神登海舟以入于淮天方暑夜碇中流海光接天星斗四垂回首白雲之思惻然悽動至漣水城已焚蕩六軍皆露宿獨餘軍學宣聖一殿巋然瓦礫中余謁宣參錢温父廷玉方病卧一板門上在十哲之傍視像設皆左祍相顧浩歎遂至金城海舟之行􅀟桅舞風舷幾入水稍轉則反之未嘗正也歸復道洪澤􅀛山至盱泗招撫郭倪招宴泗之凝雲樓樓据城而髙城不甓址以石北望中原無龍斷焉樓之下爲㕔事後有屋三楹榜曰金蘭堂方積笴充棟榜青牌金字乃一士人書不知虜法何以不禁也郡治陋甚僅如江浙一監當衙宇耳虜法簡便大抵如此聞之淮人云此乃承平遺規南渡以後州郡事體始増侈旣渉淮迄事歸而王師失利潰兵蔽野下泣聲不忍聞皆傷痍或無半體爲之潸然間有依余馬首以南然不可勝救也是役也殿司兵素驕貫於炊玉不能茹糲食部餫者復幸不折閱多雜沙土軍中急於無糧強而受之人旦莫給飯二盂沃以炊湯多弃之道復􅀒重暑行不堪其苦多相泣而就罄道旁逃屋皆是臭不可近地多眢井亦或赴死其間毎憩馬一汲輒得文身之皮浮于桶面間以井滿不可汲余暍甚不復能勺徒勺酒烹雞而薦之旣還南徐官下以藴􅀬飲惡下利幾三月乃甦余嘗以塗中所作詩篇爲録曰北征多寓見其間特不詳所歴暇日回思少年氣銳直前不懾者爲之心折因書梗㮣以起髀肉之悲泗州塔院余至泗親至僧伽塔下中爲大殿兩旁皆荆榛瓦礫之區塔院在東廂無塔而有院後以上石甃洞作兩門中爲巖穴設五百􅀿眞像大小不等或塑或刻皆左其祍余以先妣素敬釋氏奉其一于笈中以歸殿上有十六柱其大皆尺有半八觚色黯淡如暈錦正今和州土碼碯也和之産紹興間始剖山得之不知中原何時已有此前六條特異皆晶明如􅆞􅁝承梁者二髙皆丈有六尺其左者色正紅透時暑日方出􅀮柱而觀燁然晃明天下竒物也泗人爲余言唐時張刺史建殿而髙麗有僧以六柱至航海入淮一􅀛砆露立云舊有碑載其事今不存莫詰信否塔有影前輩傳記雜書之余至之明日適見于城中民家亟往觀焉信然泗固無塔而影儼然在地殊不可曉或謂影之見爲不祥泗㝷蕩棄豈其􅀿歟殿柱聞郭倪欲載以還維􅀭今不知何在二將失律王師始度淮李汝翼以􅀐帥郭倬以池田俊邁以濠分三軍並趨符離環而圍之虜守實欲迎降忠義敢死已肉薄而登矣我軍反嫉其功自下射之顚陴者曰是一家人猶爾我輩何以脫於戮始復爲備符離一尉游徼于外不得歸城外十里間有叢木尉兵依焉我之餉軍者輦過其下招司不夙計征丁于市人皆無衛部運官吏多道匿無與俱者尉鳴鼓餉者盡弃而奔則出于本間聚而焚之已輒歸三將無覺者但怪糧不時至居數日而士不㸑矣􅀄取泗無攻具夜發盱眙染肆之竿􅀂寺廟之刹爲長梯以登泗本土堙又無禦者幸而捷忠義與軍士已爭功而譁及是復不􅂝寸木徃居泗一月而後之宿宿聞有我師以其帥府命先芟積清野待砲械無所取辦敢死又巳前郤乃坐而仰髙􅅮手莫知所施汝翼之至也舎于城南有方井之地夷坦不宿草軍吏喜其免於崇薙也而營之㑹夜暑雨大作營乃故積水卑窪處草以浸死元非可頓兵也平明帳中水巳數尺軍饑遂先潰二軍不能攴皆掃營去改塗自蘄縣歸入城少憩而虜人坐其南門覆諸山下矣兵出方半縣門發屋者皆桀石以投人我軍機殱焉大酋僕撒孛董者使謂汝翼曰田俊邁守濠實誘我人而啓釁端執以歸我我全汝師汝翼不敢􅀿池之帥司提轄余永寜者聞之以告倬曰今事已爾何愛一夫而不脫萬衆之命乎倬憮然頷之永寜傳呼召俊邁計事至則􅇌下馬反接俊邁厲聲呼倬曰俊邁有罪太尉斬之可也柰何執以與虜倬回顧汝翼俱不言第目永寜使速行俊邁脫手自扼其喉卒復􅐁之俊邁有二馭者忘其名實在旁不能捄泣而逃虜旣得俊邁折箭爲誓啓門以出二將猶勦其後􅀐免者不能半焉輕􅀐至盱眙幕府自歸余時適至二將舎玻瓈泉猶傳呼􅀭揚自􅀂倬蓋招撫倪之弟也意右之招余言頗自文欲縶以歸于宣臺議旣定問余何以處余曰大義㓕親正典刑以全門户上䇿也使它日朝廷欲勿行則失刑矣何以馭軍行之則失恩矣何以待招撫倪勃然變乎色不終席而揖余以湯招幕有與余厚者退而咎余言太峻余􅀏不答遂登舟以歸倬未行客有獻計於倪者曰軍方敗事未宣也縶而歸之其聞愈章遂庇弗遣余歸病中得邸狀汝翼倬俱薄謫湘湖間意泯熄矣居亡何有㫖命大理正喬夢符即京口置獄推俊邁事皆莫測所以發旣乃聞余永寜者適以事至宣司遇俊邁之馭執之呼􅁈丘樞訊焉得其情以事已行不欲䆒第杖永寜脊黥流海島倬之弟僎輕佻人也好大言聞永寜得罪而恕實不知其事之出於倬妄謂不然以訴于平原平原謂之曰乎反易耳第萬或一然國有常憲彼時何以爲君地不如姑已僎固稱枉請直之喬遂來復追永寜于道俱下吏左驗明甚九月獄具永寜磔死倬弃市從者皆論極典汝翼以不出語得减死竄瓊州復劾其匿軍帑之罪籍其家貲俊邁家賜宅予官時倪猶帥揚上親灑宸翰慰安之龍舒守章以􅀄升之方待次居京口因至􅀭倪泣謂之曰岳監倉在否爲我謝之愧不及先知之明也至冬倪亦以怯懦罷遂謫南康嘉定更化與僎俱流嶺南貲産隨所在没入之僎蓋又儀眞䘮師之將也倬之罪不及汝翼倬嘗爲建康副帥在廬輕財勇往遷池不數旬即出兵於艱難中頗得士卒心方潰時不得已俱至蘄猶力戰獨以一諾罹禍汝翼嘗爲九江帥刻剥無藝軍士甚貧者日課屨一􅀟軍中號爲李草鞋其遷馬帥也船發琵琶亭塗人咸詬而提擊之旣敗猶取馬司五萬緡歸其家焚其籍倬死之後喬再入院鞠􅂍罪兼旬而竟僅得不死人猶以爲幸也明年有自虜逃歸者云見俊邁尚在虜蓋不殺或謂郭氏實倡言以自逭莫可致詰倪倬僎皆棣杲果之諸子浩之孫丗將家寵利盈溢進不知量隤其家聲云桯史卷第十四
