body:
  text: 相臺岳珂淳熈内禪頌中興三朝授受之懿追嫓堯禹一時薦紳名士親逢盛際濃墨大字以侈千一之遇者間有之而史不多見三松王才臣子俊者家廬陵以文鳴江西嘗作淳熈内禪頌一篇其文贍蔚典麗余甲戌􅀊在九江才臣自蜀東歸嘗訪余而出其藁其文曰惟皇上帝簡在宋徳誕集大命于我藝祖厥􅀄造草昧相時之黔淪胥于虐浮頥沈顚靡所底定其孰躋之繄我是恃寜濡我躬俾即于夷塗匪位之懐我圖我民匪天我􅀻惟我有仁八聖嗣厥理益以厚厥澤動植是洽堪輿是塞叶氣兹有羨以溢于罔極計其攸鍾是必有甚盛徳使之横絶今古焜燿典冊而後天之報施乃不爽厥則惟我髙宗克靈承于兹屬時陽九天歩用艱犬羊外陵狗䑕内訌民罔奠居皇綱就淪惟我髙宗克宏濟于兹左秉招揺右提干將灑掃函夏復壽炎籙兹惟難能哉典時神天歴載三紀民生春熈治象日舒曽靡是居俾聖嗣是荷兹惟難能哉惟我壽皇紹大歴服聖謨無所事改慮我則闡之俾益光聖治無所事改爲我則熈之俾益昌志靡一不繼事靡一不述我興問寢明星在天我往視膳麗日在户起敬起愛用家人禮祀越二十八曽靡間厥肇思篤于親爰釋大位髙宗神孫伊我聖子我是用禪先後惟一􅁤皇乎休哉􅃉古之茫赫胥大鴻橧庥繩書不可攷也巳羲圖炳文民用有識孔刪自唐登載益煥惟堯聖神談者稽焉蕩蕩巍巍匪天弗則遜于虞嬀首出帝典重華是仍亦以授禹由姒以降莫返于古􅀄或以謂臣堯舜禹之事懿矣揆之於今其可儷歟臣曰奚直儷之耳堯陟元后七十載遭時不易洚水滋儆才者十六未宣乃庸凶族有四未麗于辟日叢萬㣲以悴于厥􅂨式時元徳歴試罔不績主􅀕賔門天人交歸焉于廟受終夫豈其艱舜生登庸越其在位歴載各三十宅帝即真又三十有三稽圖揆齡九秩式有衍脫躧萬乗兹非其時哉惟我髙宗春秋五十有六惟我壽皇春秋六十有三黄屋赤霄委而弗留從容退居靡俟大耄以今准昔其决孰需焉以虞易唐嬀變而姒惟械于位廑廑釋厥􅀒乃􅀂爲天子父以天下養後丗無傳焉惟我壽皇聖孝孔時力靡遺餘愛敬旣䆒熈以鴻號錫􅀋湛恩燕及人老鉅典盛儀輝赫萬丗惟我皇上聿駿前躅日肅輿衛來覲來省翼翼如也愉愉如也以昔視今其孝孰􅂭焉故曰奚直儷之耳臣惟昔者封禪典引正符等篇其事至末矣侈于麗藻以掞不朽矧今宏休軼于古始頌聲弗宣不其缺歟作宋一經以駕帝典顧瞻朝著將有人焉臣賤不敢與兹事堯極立民康衢有謡載在萬丗不以賤廢臣誠不侫請試效之謹拜手稽首而作頌曰太􅀄􅁳􅁳孰䆒孰營羲儀圖之靡麗于成有聖惟勛䟽之㵸之斧其不條而荒度之匪丗不阜匪穹不佑可燕可守而勛以不有乃遜于華與丗爲公何以告之曰允執其中華述厥志亦以命文命率克念厥紹以共闡厥盛皇皇惟天而勛則之絶徳與功紹者克之我瞻我稽閱丗惟千泯泯棼棼曽莫闖厥藩天將􅄏之必固培之厥培以豊古尚克回之豈惟回之視培淺深軼而躙之視我斯今粤􅀊己酉二月壬戌天仗宵嚴彤廷曉蹕穆穆壽皇如天斯臨羣后在位奉承玉音曰予一人實倦于勤退處北宫以篤于親赫是大寳􅂌我聖子聖子惟睿天命夙以啓不吝于權盍居乃功釋焉不居惟壽皇之公壽皇之公其孰發之念我髙宗中心怛之始時春秋五十有六嚮用康寜以燕遐福亟其與子于宻退藏其子爲誰繄我壽皇壽皇承之匪亟匪徐二十八年四方于于國是益孚生齒益蕃于野于朝肅肅閑閑聖子重暉如帝之􅀄於千萬年曽靡或渝孰條不根孰委弗源念我髙宗允遜孔艱匪髙宗是懐藝祖之思洗時之腥仁涵于肌靈旗􅆋􅆋平國惟九其酋旣貸矧彼羣醜吾子吾孫吾士大夫毋刻爾刑顧質之書爾有嘉言爾則我告我賞我勸如彼害何悼不以干戈而置詩書維彼槐庭謂匪儒弗居列聖一心諱兵與刑維鯁言是聽惟大猷是經鍾我髙宗啓我壽皇爰及聖上篤其明昌惟是四條式克至今藝祖髙宗壽皇之心匪時匪今振古之式式勿替厥度亦以燕罔極帝開明堂百辟來賀四夷攸同莫敢或訛不肅不厲不震不竦焯其舊章貽我垂拱勛迫大耄乃禪于華華逮陟方俾夏建厥家孰如髙宗及我壽皇與齡方昌而遽晦厥光帝降而王功弗徳之逮庸不列五帝而祖三代孰如我皇惟徳崇崇顯號鴻休蔚其並􅂭維時壽皇萬壽無疆日三受朝衮冕煌煌維時皇上治益底厥極親心載寜萬􅀖以無斁萬姓謳歌于室于塗㣲臣作頌以對于康衢又自作序其後謂元次山言前代帝王有盛徳大業者必見於歌頌蓋帝王之丗以詩頌爲一件最緊切事專設採詩之官以搜求之重以其時教養有方人人能文故郊祀天地則有頌祀四嶽河海則有頌講武􅀋禡則又有頌薦魚獻鮪等事亦皆有頌後丗於詩頌既不甚經意而能文之士亦不丗有鴻烈麗藻率不相值且如有肅宗復兩京之功又適有元結能作頌有憲宗平淮蔡之功又適有韓愈栁宗元能作碑􅀂雅是以其功烈益大彰明灼著足以傳示無極韓碑一爲人所磨易以叚文昌之作便俳諧淺陋讀者悶然厭之豈復能有所發􅀭也子俊於前輩無能爲役亦詎敢謂能文然所述淳熈内禪頌郷曲一二鉅公皆盛有所穪道以爲可以庶幾古作者墮在山林無階上徹蓋十有六年于兹屬者士大夫或惎之俾自附於東漢傅毅之義上表投進亦試擬作表章一通矣又念齒髮如許恐有干澤之嫌以召簡書朋友之譏亦不果進也顧藏之家以自致其意云才臣蓋師誠齋誠齋亟稱其文有發而爲文自鑄偉辭其史論有遷固之風其古文有韓栁之則其詩句有􅂫黄後山之味至於四六踵六一東坡之歩武超然絶塵崛竒層出自汪彦章孫仲益諸公而下不論也小技如尺牘本朝惟山谷一人今王君亦咄咄逼之矣挾希丗之寳而未􅀿時之須可爲長太息等語嘗游京師上史館書述此頌之意以杜篤自况階薦得官􅀄任徑爲成都帥幙歸遂棲遲衡泌其節亦可觀云愛莫助之圖建中靖國􅀄韓文定忠彦當國黨禍稍解天下吐氣鄧洵武爲起居􅀰乗間以紹述熈豊政事爲言上意雖不能無動而未始堅决也鄧氏有位中丞者曰綰成都人在熈寜􅀄倅寜州嘗上言陛下得聖臣行青苗良法臣以寜州民心歡恱者占之天下可從知矣惟陛下堅守勿變毋惑流俗王荆公喜薦于上遂階召擢是時蜀士在朝者咸唾罵之綰有唾罵從汝好官須我爲之之語洵武蓋其子也自度清議必弗貸且有駟不及舌之慮懼文定知之未知所以回天者憂形于色有館客者聞之獻計曰新法者神考所行之法也韓􅄾實嘗沮之爲條例司所駮先帝以其勲勞弗之罪今忠彦得政而廢新法是忠彦能紹述􅄾之志也忠彦爲人臣尚不忘其父上爲天子乃忘其父兄耶誠能以此爲上别白上必感動洵武喜謝不及造􅂰如其言玉色愀然亟俞之於是崇寜改元天下曉然知其意矣洵武復進一圖曰愛莫􅂇之圖以豊祐人才分而爲二能紹述者居左惟温益而下一二人而列于右者皆指爲害政蓋舉朝無遺焉於左列之上宻覆一名曰蔡京謂非相京不可上覽而是之洵武亦馴致政地卒之成蔡氏二十年擅國之禍胎靖康裔夷之酷者此圖也􅀄神宗旣用荆公隨亦厭之綰薦荆公之子雱宸筆中出以綰操心頗僻賦性姦回論事薦人不循分守遂罷中丞知􅉑州夫洵武以左史薦宰相以庶僚變國論可謂不循分守者矣是以似之者歟慶元公議趙忠定旣以議者之言去國善􅀋多力爭而逐韓平原之權遂張公議譁然日有懸書北闕下者捕莫知主名太學生敖器之陶孫亦有詩其間曰左手旋乾右轉坤羣公相扇動流言狼胡無地歸􅁎旦魚腹終天痛屈原一死固知公所欠􅀌忠頼有史長存九原􅀂遇韓忠獻休􅀃渠家末代孫一時都下競傳既乃知其出於器之平原聞之亦不之罪也器之後登進士第今猶在選調中楊艮議命蜀有楊艮者善議命游東南公卿間瞽而多知自云知數言頗不碌碌其得失多以五行爲主不深信珞琭諸書嘉泰辛酉來九江太守易文昌祓留之徧見郡官余適在周夢與坐上時韓平原得君權震天下夢與因扣以所至艮屏人愀然曰是不能令終夫年壬申金也申爲金位有坤土以厚之故金之剛者莫加焉目曰劒􅄡從可知矣是金不復畏它火惟丙寅能制之蓋攴干納音俱爲火而履於木木實生火火且自生生生不窮雖使百錬終能勝天理之自然哉凡人生時主末今乃遇之兆已成矣且其月辛亥其日己巳四孟全備二氣交戰雖以致大受之福亦以挻衝擊之災今術者亦頗知之多疑其丙寅􅀊病死以爲不可再值其實不然蓋火炎金液外強中乾以剛遇烈赫赫然天地一鑪鞴萬物一橐籥孰可郷邇是年顧當兆禍耳未疾顚也年運于夘火爲沭浴氣㣲而敗􅁅燼鎔竭不能攴矣然受物也大非盡其用弗可一陽將萌亶其時乎夢與相顧動色謹志之􅁽弗敢言及余官鎮江偶遇之適林緫卿祖洽來餉軍興檄吳江􅀽丞韶入幕丞登科人有雋才余問其命曰辛巳丙申丁亥壬寅余謂亦俱在四孟而丁壬丙辛皆眞化且於格爲天地徳合􅀹分明遂扣艮前􅀃因以爲擬艮作而曰惟其太分明所以非韓比特二化氣皆生韓自此却不及之遂一􅀏舎去旣而艮言皆大驗乃歎其神􅀽近􅀊以薦者改秩爲宰蓋方晉未艾也獻陵䟽文獻陵嗣位未幾而有狄禍躬蹈大難以紓京邑之酷天下歸其仁炎興中天八駿忘返髙景山􅀄以訃聞朝野縞素皆有攀龍髯泣烏號之痛任元受時爲下僚率中原搢紳爲位佛宫以致哀焉作䟽文二篇以叙其志文澹意眞讀者灑涕其一曰時巡萬里羣心乆阻於望霓􅀊閱三星凶問奄傳於馳馹哀纒率土􅁈薄層空臣等跡忝簮纓心増荼蓼從君以出始慙晉國之亡臣御主而還終愧趙王之養卒攀號靡及摧殞何窮嘗聞無罪而殺一夫尚復有辭而請上帝矧兹二紀䘮我兩君義不戴天扣九􅀜而無路禮􅀿投地庶十力之可慿爰竭蚍蜉之誠仰干龍象之馭恭惟大行孝慈淵聖皇帝夙躋上聖遽辱多艱嗣服幾年躬勤庶政屈尊絶域本爲生靈已深露蓋之嗟更劇輬車之痛遺弓安在慿凡莫聞熏修唯藉於佛乗升濟式資於僊駕恭願神游超越睿識圎明區脫塵空來即寳華之法㑹兠離響滅常聞金鼓之妙音更冀大覺垂慈三靈恊佑護持正法􅂭丗祖中興之功摧伏諸魔雪懐王不返之怨其二曰僊馭賔空載嚴遐薦法筵撤席更罄餘哀恭惟大行孝慈淵聖皇帝蹈千仞之淵氷脫羣生於塗炭皇天降割裔土告終萬乗墨縗將禦徐戎之難六軍縞素咸聲義帝之􅁈自憐踈逖之蹤莫效纎微之報唯慿妙果式助神遊恭願法證三乗趣超十地如天子名爲善寂萬有皆空如丗尊身入􅄺槃一眞不㓕然後神明􅂇順中外恊謀載木主以徂征併修先君之怨奉梓宫而旋葬仰慰在天之靈元受上湯中丞啓珂固嘗書之義不忘君直不蔽姦忠信之至也徽祖上賔洪忠宣蓋嘗於燕京憫忠寺肆筵以奠是時方身縻異境􅀂於郡國禮制之外因心薦嚴雖前無此比亦不失臣子盡誠之􅁩云李敬子南康屬邑曰建昌脩水經焉元祐尚書李公擇常居其上宗􅂀皆承素業以儒名有曰敬子燔者登進士第爲禮部易經魁授岳陽郡愽士其祖母黄氏死敬子請解官與諸叔俱行䘮義聲振一時旣復分教襄陽武帥某者敬禮之敬子獨不答適郡有醼敬子預坐間言及􅀊薦事寮屬咸起囁嚅帥曰郡有賢儒爲師楷詎可舎不薦皇及其它敬子作曰燔之無功名念乆矣此决不敢當帥怒罷酒然終欲牢籠之敬子岸然弗屈郡庠有櫺星門居營幕之左昬夙啓閉之不時軍士以爲病請于前校官削學地置軍門旣數載矣敬子顧必復之軍吏讙呶不服上之府帥乗此欲擠之文移頗侵學官敬子解其意一夕解印綬遁去城􅕡以狀白帥徑以聞且劾擅去官守有詔免所居官敬子旣歸躬鋤耰其樂不改治廟祀裁古今彛制爲通行家事繩繩有法度築室曰耕讀以待學者横經其間士爭趨之輿議亟稱其賢嘉定辛未詔除大理司直朝路欣欣望其來敬子力辭且曰燔茍固丘園非所學特冐焉立朝懼越其分請得以幕議賛澄清之最遂添差江西漕屬方其居郷時士子向風不逺千里至晦庵朱先生在建陽敬子實師承之其源流蓋有自云黃潜善宣和六年春東都地震後三月又震宫殿門皆動有聲旣而蘭州地及山之草木悉没入地而山下麥苗乃在山上驛書聞朝廷徽祖爲之側席時方得燕兵端釁日侈上心向䦨遇災而懼臨朝謂羣臣曰大觀彗星之異張商英勸朕畏天戒更政事雖復作輟朕常不忘五月壬寅遂罷經撫房於是時事危一變矣㑹遣右司􅀰中黃潜善按視回乃没其實以不害聞天意遽回六月詔天下起免夫錢圖卒固燕黃驟遷户部侍􅀰建炎中興復以攀附致鼎軸殺陳東歐陽澈逐李忠定綱撤備納㓂皆其爲也維揚渡江以覆餗賜罷迹其媕阿患得之心蓋巳見於在庶僚時矣遺臭千載言之拂􅈾郭倪自比諸􅁑亮郭棣帥淮東實築二城倪從焉余兄周伯吏部時在其幕府毎從東閤游見其論議自􅀒莫敢攖者一日持扇題其上曰三顧頻繁天下計兩朝開濟老臣心意蓋以孔明自許竊恠之以爲少年戯劇妄標置耳嘉㤗開禧間倪位殿巖賔客日盛相與慫慂眞以爲卧龍復出遂逢當軸意以興六月之師吳衡守盱眙過見之于􅀭倪迎謂曰君所謂洗脚上船也子生西陲如斜谷祁山皆陜隘可守而不可出豈􅀂得平衍夷曠之地掉鞅成大功顧不快耶陳景俊爲隨軍漕先行燕之中席酌酒曰木牛流馬則以煩公衆咸􅀏之余至泗正暑見其坐上客扇果皆有此兩句然後知所聞爲不誣也倬旣潰于符離僎又敗于儀眞自度不復振對客泣數行時彭灋傳師爲法曹好謔適在坐謂人曰此帶汁諸􅁑亮也傳者莫不拊掌倪知而怒將罪之㑹罷去遂止傳師豪士以恩科得官依錢東巖之門不伈伈顧宦督府嘗欲舉以使虜而不克遣終老於選調云桯史卷第十五終
