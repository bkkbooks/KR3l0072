body:
  text: 桯史小説家𩔖一雜事之屬提要臣等謹案桯史十五卷宋岳珂撰珂字肅之號倦翁又號亦齋湯陰人武穆王飛之孫敷文閣待制霖之子官至户部侍郎淮東總領制置使是書載南北宋􅇎事凡一百四十條各有標目其間雖多俳優詼謔之詞然惟金華士人看命司諸條不出小説習氣為自􅁾其書耳餘則大㫖主於寓褒刺明是非借物論以明時事非他書所載徒資嘲戲者比所記遺事惟張邦昌劉豫三册文可以不存至於石城堡寨一條汴京故城一條皆有闗於攻守形勢施宜生一條趙希光節概一條葉少藴内制一條乾道受書禮一條范石湖一言悟主一條紫宸廊食一條燕山先見一條大散論賞書一條秦檜死報一條鄭少融遷除一條任元受啓一條陳了翁始末一條開禧北征一條二將失律一條愛莫助之圖一條黄潛善一條皆比正史為詳備所録詩文亦多足以旁資考証在宋人説部之中亦邵博王明清之亞也惟其以桯史為名不甚可解考工記曰輪人為葢達常為圍三寸桯圍倍之注曰桯車杠也説文解字曰桯牀前几也皆與著書之義不合至廣韻訓為碓桯集韻訓與楹同義更相逺疑以𫝊疑闕所不知可矣毛晉刻本末有附錄一卷前為岳飛𫝊及飛遺文併珂詩文各一首已與此書無闗又附明劉瑞孝娥井銘王公詞記各一篇尤足驗非此書所舊有今併删之庶不溷簡牘焉乾隆四十三年六月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀欽定四庫全書桯史卷一十二則宋岳珂撰張紫微原芝
