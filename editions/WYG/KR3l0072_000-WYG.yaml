front:
  text: 御製詠桯史隆興按鞠事孝宗初受禪鋭志期復古宫中戒宴安習勞御鞍馬叶擊鞠殿庭中張帟避風雨一日馬覺疲奔逸入殿廡馬馳上擁楣垂立扶而下叶夹陛驚失色繼乃頌神武嗚呼有是哉殿豈試馬所然而有其對乃曽經目覩召南齊侍郎授經諸皇子叶下直乗馬歸馬入齊罥梠失魄遂致病休致還田里叶二事正相同一笑掌堪拊岳珂方譽之謂符厥藝祖岳珂載孝宗此事謂與藝祖抵城挽鬃若合符節以譽孝宗之英武誠不值一噱如珂所紀善持控者必不若此乃至首觸于楣猶復擁楣垂立其無能已可概見尚何足譽之有若藝祖因試惡馬且不施銜勒馬逸上城觸楣墜地徐起追馬騰上事載宋史其可稱在于騰馬而不在觸楣孝宗何堪比擬適與齊召南之騎馬入門罣楣傷腦同資笑柄耳欽定四庫全書子部十二
